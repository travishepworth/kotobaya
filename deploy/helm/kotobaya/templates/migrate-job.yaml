{{- if and .Values.migrate.enabled (eq .Values.migrate.mode "hook") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65534
      containers:
        - {{- include "kotobaya.migrateContainer" . | nindent 10 }}
{{- end }}
