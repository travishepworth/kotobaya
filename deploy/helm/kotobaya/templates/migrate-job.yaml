{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65534
      containers:
        - name: migrate
          # placeholder: Flyway migrations (spec: migrate = pre-upgrade hook)
          image: {{ include "kotobaya.image" (dict "root" . "img" .Values.api.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: {{- toYaml .Values.migrate.command | nindent 12 }}
          env: {{- include "kotobaya.appEnv" . | nindent 12 }}
{{- end }}
