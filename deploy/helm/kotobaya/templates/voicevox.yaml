{{- if .Values.voicevox.enabled }}
{{- $sel := dict "root" . "component" "voicevox" }}
{{- /* VOICEVOX engine (T601), CPU image. Cluster-internal; only the worker may reach it (networkpolicy.yaml).
       The root filesystem stays writable: the engine writes caches and user settings under its home directory
       and the image does not document a read-only mode. ~/.local is an emptyDir instead, so nothing persists. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-voicevox
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "kotobaya.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kotobaya.selector" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: voicevox
          image: {{ .Values.voicevox.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{- toYaml (merge (dict "readOnlyRootFilesystem" .Values.voicevox.readOnlyRootFilesystem) .Values.containerSecurityContext) | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.voicevox.port }} }]
          readinessProbe:
            httpGet: { path: /version, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /version, port: http }
            periodSeconds: 30
            failureThreshold: 6
          resources: {{- toYaml .Values.voicevox.resources | nindent 12 }}
          volumeMounts:
            - { name: local, mountPath: /home/user/.local }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: local, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-voicevox
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  selector: {{- include "kotobaya.selector" $sel | nindent 4 }}
  ports: [{ name: http, port: {{ .Values.voicevox.port }}, targetPort: http }]
{{- end }}
