{{- if .Values.voicevox.enabled }}
{{- $sel := dict "root" . "component" "voicevox" }}
{{- /* VOICEVOX engine (T601), CPU image. Cluster-internal; only the worker may reach it (networkpolicy.yaml).
       The root filesystem stays writable: the engine writes caches and user settings under its home directory
       and the image does not document a read-only mode. ~/.local/share is an emptyDir instead (NOT all of ~/.local: the engine python packages live in ~/.local/lib), so nothing persists. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-voicevox
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "kotobaya.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kotobaya.selector" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: voicevox
          image: {{ .Values.voicevox.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # The image CMD is a user-switching wrapper (python3 run.py ...), which cannot switch users as non-root with all caps dropped.
          # Run the engine directly (same args as the image CMD, WorkingDir /opt/voicevox_engine).
          command: [/opt/python/bin/python3, ./run.py]
          args: [--voicelib_dir, /opt/voicevox_core/, --runtime_dir, /opt/onnxruntime/lib, --host, 0.0.0.0, --port, {{ .Values.voicevox.port | quote }}]
          securityContext: {{- toYaml (set (deepCopy .Values.containerSecurityContext) "readOnlyRootFilesystem" .Values.voicevox.readOnlyRootFilesystem) | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.voicevox.port }} }]
          readinessProbe:
            httpGet: { path: /version, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /version, port: http }
            periodSeconds: 30
            failureThreshold: 6
          resources: {{- toYaml .Values.voicevox.resources | nindent 12 }}
          volumeMounts:
            - { name: local, mountPath: /home/user/.local/share }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: local, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-voicevox
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  selector: {{- include "kotobaya.selector" $sel | nindent 4 }}
  ports: [{ name: http, port: {{ .Values.voicevox.port }}, targetPort: http }]
{{- end }}
