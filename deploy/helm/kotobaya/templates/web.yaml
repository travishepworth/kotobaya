{{- $sel := dict "root" . "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "kotobaya.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kotobaya.selector" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 101
      containers:
        - name: web
          image: {{ include "kotobaya.image" (dict "root" . "img" .Values.web.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.web.port }} }]
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          # nginx needs writable cache/pid dirs when run as non-root
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /run }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  selector: {{- include "kotobaya.selector" $sel | nindent 4 }}
  ports: [{ name: http, port: {{ .Values.web.port }}, targetPort: http }]
