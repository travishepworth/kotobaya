{{- $sel := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy: { type: Recreate }   # one API at a time: startup replay and migrations are not concurrent-safe
  selector:
    matchLabels: {{- include "kotobaya.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kotobaya.selector" $sel | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 65534
      {{- if and .Values.migrate.enabled (eq .Values.migrate.mode "initContainer") }}
      initContainers:
        # exits non-zero while the DB is unreachable; kubelet restarts it with backoff
        - {{- include "kotobaya.migrateContainer" . | nindent 10 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "kotobaya.image" (dict "root" . "img" .Values.api.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          env:
            - { name: PORT, value: {{ .Values.api.port | quote }} }
            {{- include "kotobaya.appEnv" . | nindent 12 }}
            - name: AUTH_PASSWORD_HASH
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.appSecretName }}, key: AUTH_PASSWORD_HASH } }
            - name: AUTH_TOTP_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.appSecretName }}, key: AUTH_TOTP_SECRET, optional: true } }
            {{- with .Values.api.trustedProxies }}
            - { name: AUTH_TRUSTED_PROXIES, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.api.publicUrl }}
            - { name: PUBLIC_URL, value: {{ . | quote }} }
            {{- end }}
            {{- if and (not .Values.backup.enabled) (not (hasKey .Values.api.env "BACKUPS_DISABLED")) }}
            - { name: BACKUPS_DISABLED, value: "true" }
            {{- end }}
            {{- range $k, $v := .Values.api.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:   # gated on restore finalize + scheduler-version replay
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  selector: {{- include "kotobaya.selector" $sel | nindent 4 }}
  ports: [{ name: http, port: {{ .Values.api.port }}, targetPort: http }]
