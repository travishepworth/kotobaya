{{- /* Backups (T112). Rendered only with backup.enabled=true. Scripts live in the backup image (deploy/backup/). */}}
{{- define "kotobaya.backupJob" -}}
{{- $root := .root -}}
{{- $comp := .component -}}
{{- $v := $root.Values.backup -}}
schedule: {{ .schedule | quote }}
concurrencyPolicy: Forbid
{{- if .suspend }}
suspend: true
{{- end }}
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 5
jobTemplate:
  spec:
    backoffLimit: 0
    activeDeadlineSeconds: {{ $v.activeDeadlineSeconds }}
    template:
      metadata:
        labels:
          {{- include "kotobaya.labels" $root | nindent 10 }}
          app.kubernetes.io/component: {{ $comp }}
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 60
        {{- if .serviceAccount }}
        serviceAccountName: {{ .serviceAccount }}
        {{- else }}
        automountServiceAccountToken: false
        {{- end }}
        securityContext:
          {{- toYaml $root.Values.podSecurityContext | nindent 10 }}
          runAsUser: 65534
        containers:
          - name: {{ $comp }}
            image: {{ include "kotobaya.image" (dict "root" $root "img" $v.image) }}
            imagePullPolicy: {{ $root.Values.imagePullPolicy }}
            securityContext: {{- toYaml $root.Values.containerSecurityContext | nindent 14 }}
            # tini -g forwards SIGTERM to the whole process group so the script's EXIT trap can alert
            command: [/sbin/tini, -g, --, {{ .script | quote }}]
            envFrom:
              # RESTIC_REPOSITORY, RESTIC_PASSWORD, AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (S3 repo), NOTIFY_URL (optional)
              - secretRef: { name: {{ $v.secretName }} }
            env:
              {{- include "kotobaya.appEnv" $root | nindent 14 }}
              - { name: BACKUP_CRONJOBS, value: "{{ $root.Release.Name }}-backup {{ $root.Release.Name }}-backup-verify" }
              - { name: KEEP_LAST, value: {{ $v.keepLast | quote }} }
              - { name: STALE_SECONDS, value: {{ mul $v.staleHours 3600 | quote }} }
              {{- with $v.notify.url }}
              - { name: NOTIFY_URL, value: {{ . | quote }} }
              {{- end }}
              {{- range $k, $val := $v.env }}
              - { name: {{ $k }}, value: {{ $val | quote }} }
              {{- end }}
            resources: {{- toYaml $v.resources | nindent 14 }}
            volumeMounts:
              - { name: work, mountPath: /work }
              - { name: tmp, mountPath: /tmp }
        volumes:
          - name: work
            emptyDir: { sizeLimit: {{ $v.workSize }} }
          - name: tmp
            emptyDir: { sizeLimit: {{ $v.tmpSize }} }
{{- end -}}
{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  {{- include "kotobaya.backupJob" (dict "root" . "component" "backup" "schedule" .Values.backup.schedule "script" "/opt/backup/backup.sh") | nindent 2 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup-verify
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  {{- include "kotobaya.backupJob" (dict "root" . "component" "backup-verify" "schedule" .Values.backup.verifySchedule "script" "/opt/backup/verify.sh") | nindent 2 }}
---
# Never runs on a schedule (suspended). deploy/backup/restore-k8s.sh creates a Job from it
# with the api and worker scaled to zero.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup-restore
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  {{- include "kotobaya.backupJob" (dict "root" . "component" "backup-restore" "schedule" "0 0 1 1 *" "suspend" true "script" "/opt/backup/restore.sh") | nindent 2 }}
---
# Watchdog: never suspended by restore-k8s.sh. Alerts when backups are stale or the backup
# CronJobs are suspended (by hand, or left suspended by a failed restore).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup-watchdog
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  {{- include "kotobaya.backupJob" (dict "root" . "component" "backup-watchdog" "schedule" .Values.backup.watchdogSchedule "serviceAccount" (printf "%s-backup-watchdog" .Release.Name) "script" "/opt/backup/watchdog.sh") | nindent 2 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-backup-watchdog
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-backup-watchdog
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [{{ .Release.Name }}-backup, {{ .Release.Name }}-backup-verify]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-backup-watchdog
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-backup-watchdog }
subjects:
  - { kind: ServiceAccount, name: {{ .Release.Name }}-backup-watchdog }
{{- end }}
