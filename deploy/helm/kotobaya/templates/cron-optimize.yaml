{{- /* Weekly FSRS optimizer (T606): enqueues one fsrs-optimize job per live preset (dedupe fsrs-optimize:<id>); the worker Deployment runs them. */}}
{{- if .Values.optimizer.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-optimize
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.optimizer.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.optimizer.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "kotobaya.labels" . | nindent 12 }}
            app.kubernetes.io/component: optimize
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
            runAsUser: 65534
          containers:
            - name: optimize
              image: {{ include "kotobaya.image" (dict "root" . "img" .Values.worker.image) }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              securityContext: {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              command: [python, -m, kotobaya_worker.optimizer.enqueue]
              env:
                - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.appSecretName }}, key: DATABASE_URL } } }
              resources: {{- toYaml .Values.optimizer.resources | nindent 16 }}
{{- end }}
