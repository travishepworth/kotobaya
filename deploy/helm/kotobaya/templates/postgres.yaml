{{- if .Values.postgres.enabled }}
{{- $sel := dict "root" . "component" "postgres" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "kotobaya.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kotobaya.selector" $sel | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_INITDB_ARGS, value: {{ .Values.postgres.initdbArgs | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgresSecretName }}, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgres.user | quote }}, -d, {{ .Values.postgres.database | quote }}] }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes: [{ name: run, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
spec:
  selector: {{- include "kotobaya.selector" $sel | nindent 4 }}
  ports: [{ name: pg, port: 5432, targetPort: pg }]
{{- end }}
