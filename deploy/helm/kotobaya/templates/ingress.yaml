{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.tls.clusterIssuer }}
  annotations:
    {{- with .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ printf "kotobaya.%s" .Values.domain | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ printf "kotobaya.%s" .Values.domain | quote }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } } }
          - { path: /healthz, pathType: Exact, backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-web, port: { name: http } } } }
{{- if contains "nginx" .Values.ingress.className }}
---
# SSE: no proxy buffering and a long read timeout on the events stream (longest prefix wins over /api).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-events
  labels: {{- include "kotobaya.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.sse.readTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.sse.readTimeoutSeconds | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ printf "kotobaya.%s" .Values.domain | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ printf "kotobaya.%s" .Values.domain | quote }}
      http:
        paths:
          - { path: /api/v1/events, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } } }
{{- end }}
{{- end }}
