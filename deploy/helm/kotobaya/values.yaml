# Placeholders; override per environment. No secret values live here.
domain: kotobaya.example.invalid
imageRegistry: registry.example.invalid/kotobaya
imagePullPolicy: IfNotPresent

# Secrets are created out-of-band (kubectl / sealed secrets / external-secrets) and referenced by name.
secrets:
  # keys: DATABASE_URL (JDBC form), S3_ACCESS_KEY, S3_SECRET_KEY, AUTH_PASSWORD_HASH (required),
  #       AUTH_TOTP_SECRET (optional). Never put these in values.
  appSecretName: kotobaya-app
  # keys: POSTGRES_PASSWORD (only read when postgres.enabled)
  postgresSecretName: kotobaya-postgres
  # keys: S3_ACCESS_KEY, S3_SECRET_KEY, s3.json (only read when objectStore.enabled)
  objectStoreSecretName: kotobaya-objectstore

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }

# Single replica everywhere (personal deployment), so no PodDisruptionBudgets are rendered.
api:
  image: { repository: api, tag: "0.1.0" }
  replicas: 1
  port: 8080
  # Extra plain env vars (e.g. a "backups disabled" switch if T112 defines one).
  env: {}
  # AUTH_TRUSTED_PROXIES: CIDR(s) of the ingress/pod network whose X-Forwarded-For is trusted by the
  # login rate limiter. Empty = variable not set. k3s default pod CIDR is 10.42.0.0/16.
  trustedProxies: ""
  # PUBLIC_URL: public origin put into pairing QR codes, e.g. https://kotobaya.example.net. Empty = not set:
  # the API then trusts X-Forwarded-Proto/Host only from trustedProxies, and refuses to create pairing codes
  # if it cannot tell the public URL.
  publicUrl: ""
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }
worker:
  image: { repository: worker, tag: "0.1.0" }
  replicas: 1
  healthPort: 8081
  # Parse service (C-12), cluster-internal: the api reaches it at PARSER_URL = http://<release>-worker:<parserPort>.
  parserPort: 8082
  # jpdb deck cache (JPDB_CACHE_DIR). Provisional: a small PVC, not object storage.
  jpdbCache: { storage: 1Gi, storageClassName: "" }
  # Optional JPDB_API_KEY from a Secret (never in values); off = Pages source only.
  jpdbApiKey: { enabled: false, secretName: kotobaya-jpdb }
  command: [python, -m, kotobaya_worker.runner]
  # DICT_SOURCES_JSON: pinned dictionary sources + checksums (format: docstring of
  # worker/src/kotobaya_worker/jobs/dict_refresh.py). Rendered into a ConfigMap; empty = not set.
  dictSourcesJson: ""
  env: {}
  resources:
    # A full dictionary build needs > 1Gi; override here if needed.
    requests: { cpu: 100m, memory: 1Gi }
    limits: { memory: 3Gi }
web:
  image: { repository: web, tag: "0.1.0" }
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

postgres:
  enabled: true   # false: put your own DATABASE_URL in the app secret
  image: postgres:17
  database: kotobaya
  user: kotobaya
  storage: 5Gi
  storageClassName: ""
  # initdb locale: the schema (contracts/db/SCHEMA.md 1) needs a UTF-8 ctype. Applies only when the
  # data directory is first created.
  initdbArgs: "--locale=C.UTF-8"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # EXTERNAL POSTGRES (postgres.enabled=false): create the database with a UTF-8 ctype, e.g.
  #   CREATE DATABASE kotobaya TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C.UTF-8' LC_CTYPE 'C.UTF-8';
  # (LC_CTYPE=C breaks the V1 migration), and put the JDBC URL in the app secret's DATABASE_URL.
objectStore:
  enabled: true   # false: set endpoint/region below to an existing S3-compatible store
  image: chrislusf/seaweedfs:3.80   # ADR-003
  bucket: kotobaya
  storage: 10Gi
  storageClassName: ""
  endpoint: ""
  region: us-east-1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

migrate:
  enabled: true
  # initContainer (default): `server migrate` runs as an api init container, retried until the DB is
  #   reachable. Works on first install with the bundled Postgres (a pre-install hook cannot, the
  #   StatefulSet does not exist yet) and on every upgrade.
  # hook: Helm Job `pre-install,pre-upgrade`; use with an external, already reachable Postgres.
  mode: initContainer
  command: [/opt/server/bin/server, migrate]

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: kotobaya-tls
    # cert-manager ClusterIssuer (Let's Encrypt DNS-01 per DECISIONS); empty = secret managed elsewhere.
    clusterIssuer: ""
  # /api/v1/events is SSE. nginx classes get no-buffering + long read timeout annotations on a
  # dedicated Ingress; Traefik streams text/event-stream unbuffered already (its entrypoint
  # respondingTimeouts default to none). With Traefik keep the Service externalTrafficPolicy: Local
  # (k3s: HelmChartConfig for traefik) so the real client IP reaches the login rate limiter.
  sse:
    readTimeoutSeconds: 3600

# Gateway API alternative to the Ingress (independent toggle; either, both or neither may be on).
# Requires the Gateway API CRDs and an existing Gateway (not installed by this chart).
# parentRefs: list of { name, namespace, sectionName }. hostnames empty = kotobaya.<domain>.
# Routes the same paths as the Ingress: /api, /healthz -> api; / -> web; /api/v1/events (SSE) gets no
# request timeout (the equivalent of the nginx buffering/read-timeout annotations).
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  sse:
    requestTimeout: 0s

networkPolicy:
  enabled: true

# ntfy / UnifiedPush (T309). Off by default. With enabled=true the chart runs ntfy (auth required, default access
# deny-all) and the api posts server events to each device's push_topic (NTFY_BASE_URL, NTFY_POST_BASE_URL, NTFY_TOKEN).
# Secret `ntfy.secretName` (never in values), all keys optional: NTFY_TOKEN (api -> ntfy publish token),
# NTFY_AUTH_USERS / NTFY_AUTH_ACCESS / NTFY_AUTH_TOKENS (ntfy provisioning format; the token must be allowed to
# write the devices' topics, the phone's user to read its own). Topics outside the public base URL are never posted to.
ntfy:
  enabled: false
  image: binwiederhall/ntfy:v2.14.0
  port: 8080
  secretName: kotobaya-ntfy
  # Public base URL ntfy advertises; empty = https://kotobaya.<domain>/ntfy
  baseUrl: ""
  # Forward to an external ntfy (ntfy.enabled=false): its public base URL, the prefix of device push topics.
  externalBaseUrl: ""
  defaultAccess: deny-all
  storage: 1Gi
  storageClassName: ""
  ingress:
    enabled: true
    annotations: {}
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Backups (T112). Off by default: the target is a placeholder (docs/DECISIONS.md). See deploy/backup/README.md.
# enabled=true renders the nightly `backup` and weekly `backup-verify` CronJobs and a suspended
# `backup-restore` CronJob (used by deploy/backup/restore-k8s.sh).
# enabled=false: no backups exist, so durable_seq stays 0 and devices never purge acked ops. To let
# devices purge (nothing to restore from), the server must report durable_seq = high_water_seq: set
# api.env.BACKUPS_DISABLED="true" (the server does not read it yet; see README "Backups disabled").
backup:
  enabled: false
  image: { repository: backup, tag: "0.1.0" }   # built from deploy/backup/Dockerfile
  # Secret (never in values): RESTIC_REPOSITORY, RESTIC_PASSWORD, plus the repo's credentials as env
  # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for an s3: repo, ...); optional NOTIFY_URL.
  secretName: kotobaya-backup
  schedule: "17 3 * * *"        # nightly (frequency is a HUMAN_CHECKS item)
  verifySchedule: "47 4 * * 0"  # weekly, Sunday
  watchdogSchedule: "37 9 * * *"  # daily; never suspended by restores; alerts on stale/suspended backups
  keepLast: 14                  # verified snapshots kept; the newest verified one is always kept
  # Failure notification target, an ntfy topic URL (e.g. https://ntfy.example.invalid/kotobaya-alerts).
  # Treat a real topic URL as secret: put NOTIFY_URL in the backup Secret instead and leave this empty.
  notify: { url: "" }
  # Alert when the newest verified snapshot is older than this (about 2x the nightly schedule): catches
  # jobs killed without a chance to alert (OOMKill, eviction, SIGKILL), checked by backup and verify.
  staleHours: 52
  # Limits. The blob mirror is staged on disk: workSize must hold the dump plus ALL blobs
  # (raise it as the media grows; exceeding it evicts the pod, which staleHours then reports).
  # tmpSize holds restic's cache/temp. Memory: restic + pg_dump; raise for a very large repository.
  workSize: 10Gi
  tmpSize: 2Gi
  activeDeadlineSeconds: 7200
  env: {}
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 2Gi }
