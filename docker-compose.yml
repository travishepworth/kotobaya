# Dev stack. Credentials are dev-only defaults; override via env (never commit .env.local).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kotobaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kotobaya-dev}
      POSTGRES_DB: kotobaya
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotobaya -d kotobaya"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kotobaya}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kotobaya-dev-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: worker }
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
