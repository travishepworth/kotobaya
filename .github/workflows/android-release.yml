# T312: signed Android release on each v* tag, both flavors. Setup: android/signing/README.md.
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# GITHUB_TOKEN is the built-in token (contents: write only).
name: android-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version from tag and run number
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v[0-9]*) ;;
            *) echo "tag must look like v<major>.<minor>.<patch>: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build both release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: make apk

      - name: Verify signature and version of each APK
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          aapt2="$(dirname "$apksigner")/aapt2"
          for apk in android/build/outputs/apk/ankidroid/release/kotobaya-release.apk \
                     android/build/outputs/apk/own/release/kotobaya-own-release.apk; do
            "$apksigner" verify --print-certs "$apk"
            badging="$("$aapt2" dump badging "$apk")"
            grep -qF "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<<"$badging" \
              || { echo "$apk: versionCode/versionName is not $VERSION_CODE/$VERSION_NAME" >&2; exit 1; }
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          default_apk="dist/kotobaya-${VERSION_NAME}.apk"
          own_apk="dist/kotobaya-own-id-${VERSION_NAME}.apk"
          cp android/build/outputs/apk/ankidroid/release/kotobaya-release.apk "$default_apk"
          cp android/build/outputs/apk/own/release/kotobaya-own-release.apk "$own_apk"
          cat > dist/NOTES.md <<EOF
          Kotobaya ${VERSION_NAME}

          Install ONE of these APKs:

          - ${default_apk##*/} (default). Package com.ichi2.anki, the name Takoboto's AddContentApi looks for.
            WARNING: this is AnkiDroid's package name. Android refuses to install it while AnkiDroid is
            installed (different signing key). Uninstall AnkiDroid first; only one app can own AnkiDroid's provider.
          - ${own_apk##*/}. Package kotobaya.android. Use this if AnkiDroid stays on the phone.

          Obtainium: install the default APK via the repo URL with APK filter ^kotobaya-[0-9][^/]*\\.apk\$
          EOF
          gh release create "$GITHUB_REF_NAME" --title "Kotobaya $VERSION_NAME" \
            --notes-file dist/NOTES.md "$default_apk" "$own_apk"
