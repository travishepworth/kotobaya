    QueueItem:
      type: object
      description: One card to show, with everything needed to render and grade it.
      required:
      - card
      - entry
      - sentence
      - review_type
      - preview
      properties:
        card:
          $ref: '#/components/schemas/Card'
          description: The card, with `note`.
        entry:
          oneOf:
          - $ref: '#/components/schemas/DictEntry'
          - type: 'null'
          description: The note's dictionary entry, or null (no reference, or entry missing).
        kanji:
          oneOf:
          - $ref: '#/components/schemas/Kanji'
          - type: 'null'
          description: For a note of base type `kanji`, the `ref.kanji` row of its `kanji_literal` (C-2); null for
            other notes or when the kanji is not in `ref.kanji`. The client passes `literal`, `meanings`,
            `on_readings` (onyomi), `kun_readings` (kunyomi) and `stroke_count` to the core renderer as
            `RenderInput.kanji` / `JsRenderInput.kanji`, so a kanji note with empty fields (`auto_kanji`,
            `jpdb_import`) renders from it identically on every host. Absent is treated as null.
        sentence:
          oneOf:
          - $ref: '#/components/schemas/Sentence'
          - type: 'null'
          description: Example sentence chosen for this showing (grammar cloze and other rotating-example kinds);
            send its id back as `sentence_id`. Null otherwise. For a grammar card (C-15) it is the full row of
            `grammar_sentence.sentence_id` (tokens for furigana, audio, image) when `grammar_sentence` is non-null,
            and null when `grammar_sentence` is null.
        grammar_sentence:
          oneOf:
          - $ref: '#/components/schemas/GrammarCardSentence'
          - type: 'null'
          description: |
            C-15 (additive). The example sentence and span to show for a card of a grammar note
            (`card.note.grammar_point_id` non-null) of any kind except `production`, chosen at
            queue-build time by the shared core picker `GrammarCardSentences.pick` (rotation, i+0
            first). Null for all other cards, and for grammar cards with no usable candidate.
            Absent (older server) is treated as null. The rules are on `GrammarCardSentence`.

            Clients pass it to the core renderer unchanged as `RenderInput.cloze` /
            `JsRenderInput.cloze` (`sentence_id` → `sentenceId`, `text`, `start_offset` → `start`,
            `end_offset` → `end`, `translation`), keep showing it for the whole showing of this item
            (front, back, undo of a later card, redisplay), and send `sentence_id` back as
            `ReviewAnswerRequest.sentence_id`. When it is null for a grammar card, they render
            with `cloze = null` (the renderer emits the `missing_cloze` warning) and SHOULD show an
            i18n "no example sentence yet" notice with the point's pattern.
        review_type:
          type: string
          enum:
          - scheduled
          - learning
          - drill
          - cram
          description: Review type an answer will be logged with.
        preview:
          oneOf:
          - $ref: '#/components/schemas/SchedulePreview'
          - type: 'null'
          description: Null for drill and cram items.
    GrammarCardSentence:
      type: object
      description: |
        C-15. The example sentence for one showing of a grammar card (SPEC "Grammar review": the
        sentence rotates on each review; i+0 sentences first). It is exactly the
        `GrammarCandidate` returned by the core's `GrammarCardSentences.pick(candidates,
        lastShown, rotation)`, plus its inputs and source. Servers MUST call that core function;
        they never re-implement the choice.

        **Candidates** (one per distinct (`sentence_id`, `start_offset`, `end_offset`)): every
        live span (`deleted_at` null; origin `detected` or `manual`) of the note's
        `grammar_point_id` in an `app.sentence` row with `origin = media` whose media is live.
        Generated sentences are never candidates (SPEC: kept separate); Tatoeba sentences have no
        spans and are not candidates. A span whose grammar point is deleted, whose sentence is
        missing, or that is not a valid UTF-16 range of the text (`GrammarCardSentences.isValidSpan`:
        empty, out of range, or cutting a surrogate pair) is dropped. `unknownCount` = the
        sentence's `Sentence.unknown_count` (the `filter` parameter's definition, now).

        **Inputs**:
        - `rotation` = `card.reps` of the card as returned in the same item (after replay).
        - `lastShown` = the `sentence_id` of the card's latest review (highest `hlc`) among
          `review_log` rows with `undone_at` null and `review_type` not `manual`, counting rows
          logged on cards merged into it; null if there is none or its `sentence_id` is null
          (earlier rows are not consulted).

        **Determinism**: the result is a pure function of the replica's state. Fetching the
        queue again without answering returns the same sentence; answering moves both inputs
        (the answered sentence becomes `lastShown`; a schedule answer also increments `reps`),
        so the next showing differs whenever two or more candidate sentences exist; undoing
        that answer restores both inputs and therefore the earlier sentence. The pick can
        change between fetches only when the candidates change (new detection, a span removed,
        a word becoming known); clients must not swap the sentence of an item already shown.
        Drill and cram answers log `sentence_id` but leave `reps` unchanged; `lastShown` still
        advances, so drills rotate too.

        **Offline / Android**: a device building its queue locally runs the same pick over its
        replica: candidates from installed media snapshots (sentences, detected spans) plus
        manual spans from `grammar.span_put`, `unknownCount` from local word statuses, and
        `card.reps` / `review_log` from local state. Media whose snapshot is not installed
        contribute nothing; with no candidate the device renders with `cloze = null`, as for a
        null `QueueItem.grammar_sentence`. A device and the server may pick differently when
        their replicas differ; this only affects display, and the review logs whatever was shown.
      required:
      - sentence_id
      - text
      - start_offset
      - end_offset
      - translation
      - unknown_count
      - rotation
      - last_shown_sentence_id
      - source
      properties:
        sentence_id:
          $ref: '#/components/schemas/Uuid'
          description: The chosen sentence (`app.sentence.id`); equals `QueueItem.sentence.id`. Send it as
            `ReviewAnswerRequest.sentence_id`.
        text:
          type: string
          minLength: 1
          description: The sentence text, identical to `QueueItem.sentence.text`.
          examples:
          - 行かざるを得ない。
        start_offset:
          type: integer
          minimum: 0
          description: UTF-16 start of the chosen span of the card's grammar point, inclusive. Cloze blanks it,
            recognition highlights it, spot reveals it on the back. Other spans of the same point in this sentence
            are in `QueueItem.sentence.grammar_spans` and are not highlighted by the core renderer.
          examples:
          - 0
        end_offset:
          type: integer
          minimum: 1
          description: UTF-16 end of the span, exclusive; `start_offset < end_offset <= text length`, never inside a
            surrogate pair.
          examples:
          - 8
        translation:
          type:
          - string
          - 'null'
          description: English translation for the back, or null. Always null for now (mined media sentences carry
            none); reserved so the renderer's `{{cloze:translation}}` can be filled later without a contract change.
        unknown_count:
          type: integer
          minimum: 0
          description: The sentence's unknown-word count the pick used (0 = i+0).
          examples:
          - 0
        rotation:
          type: integer
          minimum: 0
          description: The `rotation` input of the pick (`card.reps`). Informational, for debugging and for checking
            that a device agrees.
          examples:
          - 6
        last_shown_sentence_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: The `lastShown` input of the pick. Informational.
        source:
          $ref: '#/components/schemas/ExampleSentenceSource'
    ExampleSentenceSource:
