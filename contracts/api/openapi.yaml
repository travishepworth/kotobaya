  # ---------------------------------------------------------------- export
  /export:
    get:
      operationId: exportAll
      tags: [export]
      summary: Full JSON dump of your data.
      description: |
        Streams one JSON document (schema `ExportDump`) read in a single repeatable-read
        snapshot. `tables` holds every row of every learning-data table plus `media` and
        `parse_override`, tombstones and merge losers included, each row with every column of
        `V1__init.sql` except generated ones (`note.search_text`): arrays as JSON arrays, `jsonb`
        as JSON, timestamps as RFC 3339 UTC, including `clocks`/`hlc` (so a dump can seed a
        replica). With `include=media_content` the bulk tables `media_segment`, `sentence`,
        `occurrence` and detected `sentence_grammar_span` rows are added (can be hundreds of
        MB). Never included: `device`, `api_token`, `change`, `job`, `blob` rows, blob bytes,
        `ref.*`. Sent with `Content-Disposition: attachment; filename="kotobaya-export-<UTC date>.json"`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: include
          in: query
          description: Optional extra sections, comma-separated.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: {type: string, enum: [media_content]}
          example: [media_content]
      responses:
        '200':
          description: The dump.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportDump'}
              examples: {default: {$ref: '#/components/examples/ExportDump'}}
        default: {$ref: '#/components/responses/Problem'}
  /export/anki:
    get:
      operationId: exportAnki
      tags: [export]
      summary: Export notes and cards as an Anki package (.apkg).
      description: |
        Builds an `.apkg` (Anki 2.1 `collection.anki21` format) of live notes and cards: one
        Anki note type per Kotobaya note type (fields in order, one card template per card
        kind, rendered templates from the core), tags, referenced audio and image blobs as
        media files, and the review log (`revlog`; `manual`, `drill`, `cram` and undone rows are
        left out). Scheduling is exported as FSRS memory state plus due date. With `query`, only
        cards matching the card search string (and their notes) are exported; a query that does
        not parse is `422 invalid_query`. No match still yields a valid, empty package.
        Sent with `Content-Disposition: attachment; filename="kotobaya-<UTC date>.apkg"`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: query
          in: query
          description: Card search string restricting what is exported.
          schema: {type: string, maxLength: 2000}
          example: deck:"Frieren"
      responses:
        '200':
          description: The package.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
              example: (binary)
        '422': {$ref: '#/components/responses/InvalidQuery'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- events
  /events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Server-sent events - job progress, sync activity, new notes, device changes.
      description: |
        A `text/event-stream` (HTML Living Standard) that stays open. Each event is

        ```
        id: <n>
        event: <type>
        data: <one line of JSON: the Event object>

        ```

        - `id` counts up from 1 per connection. There is **no replay**: `Last-Event-ID` is
          ignored. After (re)connecting, a client refetches what it shows; the first event on
          every connection is `hello` and carries `high_water_seq` for that purpose.
        - `data` is always a single-line JSON object with the schema `Event`
          (`{"type", "at", "data"}`); `event:` repeats `type`.
        - A comment line `: ping` is sent every 25 seconds so proxies keep the connection.
        - Delivery is best effort; events may be coalesced. Slow consumers are disconnected
          when more than 1000 events are buffered for them.
        - The stream ends with HTTP close when the credential is revoked or expires.

        | `type` | `data` schema | Sent when |
        |---|---|---|
        | `hello` | `EventHello` | Once, first, on every connection. |
        | `sync.changed` | `EventSyncChanged` | One or more ops were logged (any origin). Coalesced to at most one per second; carries the new `high_water_seq`. Clients with a replica pull; others refetch. |
        | `note.created` | `EventNoteCreated` | A `note.created` op was applied (once per note). |
        | `job.updated` | `Job` | A job was created, changed status, or its progress changed (at most one per job per second while running; the terminal state is always sent). Never sent for a server-internal job (C-9, see `Job`); its progress shows up as `job.updated` of its parent. |
        | `device.paired` | `EventDevice` | `POST /devices/pair` succeeded. |
        | `device.revoked` | `EventDevice` | A device was revoked. |

        `types` filters the stream (comma-separated); `hello` is always sent.

        **ntfy forwarding.** The server posts the same `Event` JSON as the message body to the
        `push_topic` of every non-revoked device for: `job.updated` with a terminal status
        (except kind `grammar-detect`, C-13: one rule edit can end hundreds of them), and
        `sync.changed` (coalesced to at most one per minute per device, and not to the device
        that originated the change).
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: types
          in: query
          description: Only these event types (plus `hello`). Default - all.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/EventType'}
          example: [job.updated, sync.changed]
      responses:
        '200':
          description: The event stream (never completes normally).
          content:
            text/event-stream:
              schema:
                type: string
                description: Stream of events as described above. Each `data:` line is an `Event`.
              example: |
                id: 1
                event: hello
                data: {"type":"hello","at":"2026-11-12T09:30:00.000Z","data":{"high_water_seq":48213,"log_epoch":"0193a1b2-00ee-7000-8000-000000000001","server_time":"2026-11-12T09:30:00.000Z"}}

                : ping

                id: 2
                event: sync.changed
                data: {"type":"sync.changed","at":"2026-11-12T09:30:07.120Z","data":{"high_water_seq":48215}}

        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- compat
  /ankiconnect:
    post:
      operationId: ankiConnect
      tags: [compat]
      summary: AnkiConnect-compatible subset for Yomitan and other mining tools.
      description: |
        Speaks AnkiConnect protocol version 6: the request is
        `{"action", "version", "params", "key"}`; the response is **always HTTP 200** with
        `{"result", "error"}` where exactly one is non-null (`error` is a string). Requests with
        `version` below 6 or absent are answered in the same v6 shape. Protocol-level failures
        (unknown action, bad params, auth) are reported in `error`, not as HTTP errors; only a
        body that is not JSON gets `400`.

        **Auth** (`x-auth: body-key`). Either the usual credentials, or - because Yomitan can only
        send an API key in the body - a personal access token in `key`. The empty alternative
        `{}` in `security` exists only so that generic clients and gateways let a request without
        an `Authorization` header or cookie through; it does **not** make the operation public:
        the server authenticates such a request by `key` (same validity and revocation rules as a
        bearer token, `token_hash` lookup) and requires the scope named in `x-body-key-scope`.
        If both a header/cookie and `key` are present, the header/cookie wins (`key` is ignored).
        Only the `version` action needs no credential. Without a valid credential the response is
        `{"result": null, "error": "valid api key must be provided"}`. Needs the `write` scope
        (also for the read-only actions, to keep one rule). Cookie-authenticated calls need the
        CSRF header as usual. The server answers `OPTIONS` preflights for this path only with
        `Access-Control-Allow-Origin: *` and allows the headers `Content-Type`; cookies are
        never accepted cross-origin.

        **Ids.** AnkiConnect note ids are integers. `anki_id(note)` = the first 48 bits of the
        note's UUIDv7 (Unix milliseconds) × 32 + the 5 bits following the version nibble
        (always below 2^53). It is derived, not stored; a lookup by `anki_id` resolves to the
        live note with the smallest id among those sharing it.

        | Action | Params | Result | Behaviour |
        |---|---|---|---|
        | `version` | - | `6` | No auth needed. |
        | `deckNames` | - | array of strings | Names of live `user` decks, ascending, de-duplicated. If there is none, `["Kotobaya"]` (notes added to that name go to no deck). |
        | `modelNames` | - | array of strings | Names of live note types, built-ins first. |
        | `modelFieldNames` | `modelName` | array of strings | The field **keys** of that note type, in order. Unknown name: error `model was not found: <name>`. |
        | `canAddNotes` | `notes` (array of note objects) | array of booleans | Per note, false when `addNote` would fail as a duplicate or its model is unknown. |
        | `addNote` | `note` | integer `anki_id` | See below. |
        | `findNotes` | `query` | array of integers | Supports the forms Yomitan sends: `"<field>:<value>"` terms (exact match of that field after stripping HTML, optionally quoted, combined with spaces = AND), `deck:"<name>"`, and `nid:<id>`; anything else matches nothing. Returns `anki_id`s of live notes, ascending. |
        | `storeMediaFile` | `filename`, and one of `data` (base64), `url` | the stored filename | Stores the bytes as a blob (kind by extension: audio or image; else `upload`). Returns `<sha256>.<original extension>`; a `[sound:<that name>]` or `<img src="<that name>">` in a later `addNote` field is rewritten to `[sound:<sha256>]` / `<img src="blob:<sha256>">`. |

        **`addNote`.** `note` = `{deckName, modelName, fields: {<key>: <html>}, tags: [..],
        options: {allowDuplicate}, audio/picture: [{url|data, filename, fields: [..]}]}`.
        The server resolves `modelName` to a note type and matches a dictionary entry with the
        core's matcher from the fields `expression` and `reading` when the base type is `vocab`
        (no match: `entry_seq` null). It then emits `note.created` (origin `ankiconnect`),
        `card.created` per default kind and, when `deckName` names a live user deck,
        `deck.item_put` - exactly as `POST /notes`. `audio`/`picture` attachments are stored as
        blobs and appended to the named fields. Duplicate rule: if a live note already
        references the matched entry, or (no entry) a live note of the same note type has the
        same first-field value, the result is error `cannot create note because it is a
        duplicate` - unless `options.allowDuplicate` is true and there is no matched entry
        (a second note for the same entry is never created; with `allowDuplicate` the existing
        note's `anki_id` is returned instead).
      x-emits-ops: [note.created, card.created, deck.item_put]
      x-auth: body-key
      x-body-key-scope: write
      security:
        - {}
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnkiConnectRequest'}
            examples:
              version: {summary: version, value: {action: version, version: 6}}
              add_note:
                summary: addNote from Yomitan
                value:
                  action: addNote
                  version: 6
                  key: kbp_Zx81LmQpR4tUv7WyA2cD5eF9gH3jK6nM0oPqS1bT
                  params:
                    note:
                      deckName: Inbox
                      modelName: Vocab
                      fields: {expression: 食べる, reading: たべる, meaning: to eat, sentence: パンを食べる}
                      tags: [yomitan]
                      options: {allowDuplicate: false}
              find: {summary: findNotes duplicate check, value: {action: findNotes, version: 6, params: {query: '"expression:食べる"'}}}
      responses:
        '200':
          description: AnkiConnect result envelope (also for protocol-level errors).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnkiConnectResponse'}
              examples:
                version: {summary: version, value: {result: 6, error: null}}
                add_note: {summary: addNote, value: {result: 55421578936332, error: null}}
                duplicate: {summary: Duplicate, value: {result: null, error: cannot create note because it is a duplicate}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Device token (`kbd_...`) or personal access token (`kbp_...`) in `Authorization: Bearer <token>`.
        The array in each operation''s security requirement is the scope needed.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: kotobaya_session
      description: Web session cookie set by `POST /auth/login`. Sessions hold all five scopes; non-GET requests also
        need `X-Kotobaya-Csrf`.
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` from the previous page. Absent = first page. A malformed or foreign cursor
        is `422`.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      example: eyJrIjpbIjIwMjYtMTEtMTJUMDk6MzA6MDAuMDAwWiIsIjAxOTMxZjQwIl19
    IncludeDeleted:
      name: include_deleted
      in: query
      description: Also return tombstoned rows (`deleted_at` set).
      schema:
        type: boolean
        default: false
      example: false
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Device id.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f3e-0000-7000-8000-0000000000a1
    TokenId:
      name: token_id
      in: path
      required: true
      description: '`api_token.id`.'
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f3f-0000-7000-8000-0000000000b1
    PresetId:
      name: preset_id
      in: path
      required: true
      description: Preset id (`fsrs_params.id`).
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 00000000-0000-7000-8000-000000000010
    NoteTypeId:
      name: note_type_id
      in: path
      required: true
      description: Note type id.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 00000000-0000-7000-8000-000000000101
    Seq:
      name: seq
      in: path
      required: true
      description: JMdict sequence number of the entry.
      schema:
        $ref: '#/components/schemas/EntrySeq'
      example: 1358280
    NoteId:
      name: note_id
      in: path
      required: true
      description: Note id.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f40-1a2b-7c3d-8e4f-000000000a01
    CardId:
      name: card_id
      in: path
      required: true
      description: Card id.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f40-1a2b-7c3d-8e4f-000000000c01
    DeckId:
      name: deck_id
      in: path
      required: true
      description: Deck id. For a media deck this equals the media id.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f40-2000-7000-8000-000000000d01
    MediaId:
      name: media_id
      in: path
      required: true
      description: Media id.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f40-3000-7000-8000-000000000e01
    GrammarPointId:
      name: grammar_point_id
      in: path
      required: true
      description: Grammar point id.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f40-4000-7000-8000-000000000901
    JobId:
      name: job_id
      in: path
      required: true
      description: Job id.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f42-0000-7000-8000-000000000b01
    BlobHash:
      name: hash
      in: path
      required: true
      description: Lowercase hex SHA-256 of the blob's bytes.
      schema:
        $ref: '#/components/schemas/BlobHash'
      example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    CoverageHide:
      name: hide
      in: query
      description: |
        Classes left out of every coverage number, comma-separated. `names`, `particles`,
        `auxiliary` = entries whose `occurrence.pos_class` is `name`, `particle`, `auxiliary`;
        `ignored` = entries whose word status is `blacklisted` or `ignored`; `unmapped` = tokens
        that matched no dictionary entry. Default `ignored`. Pass an empty value (`hide=`) to hide
        nothing.
      style: form
      explode: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
          - names
          - particles
          - auxiliary
          - ignored
          - unmapped
        default:
        - ignored
      example:
      - names
      - particles
      - ignored
    SentenceFilter:
      name: filter
      in: query
      description: |
        `all` (default); `i+1` = sentences with exactly one unknown word; `i+0` = none.
        "Unknown word" = a distinct entry among the sentence's tokens whose effective word status
        is `new`; tokens of class `particle`, `auxiliary`, `name`, unmapped tokens and entries
        with status `blacklisted`/`ignored` are not counted. Because an unencoded `+` in a query
        string decodes to a space, servers MUST also accept `i 1` and `i 0`.
      schema:
        type: string
        enum:
        - all
        - i+0
        - i+1
        default: all
      example: i+1
    SentenceSegment:
      name: segment_id
      in: query
      description: Only sentences of this segment.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f40-3100-7000-8000-000000000e11
    SentenceQ:
      name: q
      in: query
      description: Substring of the sentence text (exact characters, no normalisation).
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: 食べ
    SentenceEntry:
      name: entry_seq
      in: query
      description: Only sentences with a token mapped to this entry.
      schema:
        $ref: '#/components/schemas/EntrySeq'
      example: 1358280
    SentenceGrammar:
      name: grammar_point_id
      in: query
      description: Only sentences with a live span of this grammar point.
      schema:
        $ref: '#/components/schemas/Uuid'
      example: 01931f40-4000-7000-8000-000000000901
    StatsFrom:
      name: from
      in: query
      description: First study day, inclusive. Default - `to` minus 364 days.
      schema:
        $ref: '#/components/schemas/LocalDate'
      example: '2026-01-01'
    StatsTo:
      name: to
      in: query
      description: Last study day, inclusive. Default - the current study day.
      schema:
        $ref: '#/components/schemas/LocalDate'
      example: '2026-11-12'
  headers:
    Seq:
      description: '`change.seq` of the last op this call emitted. Absent when the call emitted no op.'
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 48213
    ContentLocation:
      description: Present only when the addressed row lost a merge - the canonical URL of the survivor that the body
        describes.
      schema:
        type: string
      example: /api/v1/notes/01931f40-1a2b-7c3d-8e4f-000000000a01
  responses:
    Problem:
      description: Any other error. See the error table in the API description.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: urn:kotobaya:problem:internal
                title: Internal error
                status: 500
                code: internal
                detail: Unexpected error. The request id identifies it in the server log.
                request_id: 01931f43-aaaa-7000-8000-00000000r001
    InvalidRequest:
      description: The body is not valid JSON, or (for `POST /sync/push`) does not match `PushRequestLenient`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_request:
              value:
                type: urn:kotobaya:problem:invalid_request
                title: Invalid request
                status: 400
                code: invalid_request
                detail: The body does not match PushRequestLenient.
                errors:
                - pointer: /ops
                  code: out_of_range
                  detail: ops must contain 1 to 500 items.
                request_id: 01931f43-aaaa-7000-8000-00000000r030
    Unauthenticated:
      description: Missing, unknown, expired or revoked credential; or wrong login or pairing data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: urn:kotobaya:problem:unauthenticated
                title: Authentication required
                status: 401
                code: unauthenticated
                detail: The token is unknown, expired or revoked.
                request_id: 01931f43-aaaa-7000-8000-00000000r002
            invalid_credentials:
              value:
                type: urn:kotobaya:problem:invalid_credentials
                title: Invalid credentials
                status: 401
                code: invalid_credentials
                detail: Wrong password or code.
                request_id: 01931f43-aaaa-7000-8000-00000000r003
            totp_required:
              value:
                type: urn:kotobaya:problem:totp_required
                title: TOTP code required
                status: 401
                code: totp_required
                detail: Send totp_code.
                request_id: 01931f43-aaaa-7000-8000-00000000r004
            invalid_pairing_code:
              value:
                type: urn:kotobaya:problem:invalid_pairing_code
                title: Invalid pairing code
                status: 401
                code: invalid_pairing_code
                detail: The code is unknown, expired or already used.
                request_id: 01931f43-aaaa-7000-8000-00000000r005
    Forbidden:
      description: The credential is valid but may not do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            insufficient_scope:
              value:
                type: urn:kotobaya:problem:insufficient_scope
                title: Insufficient scope
                status: 403
                code: insufficient_scope
                detail: This operation needs the write scope.
                required_scope: write
                request_id: 01931f43-aaaa-7000-8000-00000000r006
            device_required:
              value:
                type: urn:kotobaya:problem:device_required
                title: Device token required
                status: 403
                code: device_required
                detail: Only tokens bound to a device can push ops.
                request_id: 01931f43-aaaa-7000-8000-00000000r007
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not_found:
              value:
                type: urn:kotobaya:problem:not_found
                title: Not found
                status: 404
                code: not_found
                detail: No note with id 01931f40-1a2b-7c3d-8e4f-000000000a09.
                instance: /api/v1/notes/01931f40-1a2b-7c3d-8e4f-000000000a09
                request_id: 01931f43-aaaa-7000-8000-00000000r008
    Gone:
      description: The row is a tombstone. Repeat with `include_deleted=true` to read it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gone:
              value:
                type: urn:kotobaya:problem:gone
                title: Deleted
                status: 410
                code: gone
                detail: The note was deleted at 2026-11-10T08:00:00.000Z.
                request_id: 01931f43-aaaa-7000-8000-00000000r009
    Conflict:
      description: The request is valid but conflicts with the current state. `code` says which rule (see the error
        table).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            deck_read_only:
              value:
                type: urn:kotobaya:problem:deck_read_only
                title: Deck is read-only
                status: 409
                code: deck_read_only
                detail: Items of media and list decks are generated by the server.
                request_id: 01931f43-aaaa-7000-8000-00000000r010
            builtin_immutable:
              value:
                type: urn:kotobaya:problem:builtin_immutable
                title: Built-in cannot be changed this way
                status: 409
                code: builtin_immutable
                detail: The Default preset cannot be deleted.
                request_id: 01931f43-aaaa-7000-8000-00000000r011
            card_not_reviewable:
              value:
                type: urn:kotobaya:problem:card_not_reviewable
                title: Card cannot be reviewed
                status: 409
                code: card_not_reviewable
                detail: The card is suspended.
                request_id: 01931f43-aaaa-7000-8000-00000000r013
    AlreadyExists:
      description: A natural-key collision; `existing_id` names the row that holds the key.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            already_exists:
              value:
                type: urn:kotobaya:problem:already_exists
                title: Already exists
                status: 409
                code: already_exists
                detail: A live note already references entry 1358280.
                existing_id: 01931f40-1a2b-7c3d-8e4f-000000000a01
                request_id: 01931f43-aaaa-7000-8000-00000000r014
    ValidationFailed:
      description: The request is well-formed but invalid. `errors` lists every problem found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation_failed:
              value:
                type: urn:kotobaya:problem:validation_failed
                title: Validation failed
                status: 422
                code: validation_failed
                detail: 2 problems.
                request_id: 01931f43-aaaa-7000-8000-00000000r015
                errors:
                - pointer: /tags/0
                  code: invalid_value
                  detail: Tags must not contain whitespace.
                - pointer: /colour
                  code: unknown_field
                  detail: Unknown property.
    InvalidQuery:
      description: The card search string does not parse (or another validation error; see `code`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_query:
              value:
                type: urn:kotobaya:problem:invalid_query
                title: Invalid search query
                status: 422
                code: invalid_query
                detail: Unknown search term "lapse".
                request_id: 01931f43-aaaa-7000-8000-00000000r016
                errors:
                - pointer: /query
                  code: unknown_term
                  detail: Unknown search term "lapse".
                  position: 7
    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema:
            type: integer
            minimum: 1
          example: 600
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate_limited:
              value:
                type: urn:kotobaya:problem:rate_limited
                title: Too many attempts
                status: 429
                code: rate_limited
                detail: Try again in 600 seconds.
                request_id: 01931f43-aaaa-7000-8000-00000000r017
    PayloadTooLarge:
      description: The body exceeds a limit from `GET /meta`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            payload_too_large:
              value:
                type: urn:kotobaya:problem:payload_too_large
                title: Payload too large
                status: 413
                code: payload_too_large
                detail: A push may carry at most 1000 ops.
                request_id: 01931f43-aaaa-7000-8000-00000000r018
  schemas:
    Uuid:
      type: string
      description: UUID in canonical lowercase text (UUIDv7 for client- and server-generated row ids; a few built-in
        rows have fixed ids).
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      examples:
      - 01931f40-1a2b-7c3d-8e4f-000000000a01
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 instant; UTC with millisecond precision in responses.
      examples:
      - '2026-11-12T09:30:00.000Z'
    LocalDate:
      type: string
      format: date
      description: A study day, `YYYY-MM-DD` (see Conventions).
      examples:
      - '2026-11-12'
    EntrySeq:
      type: integer
      format: int64
      minimum: 1
      description: JMdict sequence number (`ref.dict_entry.seq`).
      examples:
      - 1358280
    BlobHash:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: Lowercase hex SHA-256 of a blob's bytes.
      examples:
      - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    Hlc:
      type: string
      pattern: ^[0-9a-f]{12}-[0-9a-f]{4}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: Hybrid logical clock value, 54 characters (SCHEMA.md section 3). Compare byte-wise.
      examples:
      - 0193a1b2c3d4-0001-01931f3e-0000-7000-8000-0000000000a1
    Scope:
      type: string
      enum:
      - read
      - write
      - review
      - import
      - admin
      description: Token scope (see Authentication and scopes).
    TokenKind:
      type: string
      enum:
      - session
      - device
      - personal
      description: Credential kind.
    NoteBaseType:
      type: string
      enum:
      - vocab
      - kanji
      - phrase
      - grammar
      - sentence
      - custom
      description: The six note types of the spec.
    WordStatusValue:
      type: string
      enum:
      - new
      - learning
      - known
      - never_forget
      - blacklisted
      - ignored
      description: Effective word status.
    DeckType:
      type: string
      enum:
      - user
      - media
      - list
      - smart
      description: Deck type (`app.deck.type`).
    MediaKind:
      type: string
      enum:
      - anime
      - novel
      - vn
      - manga
      - web
      - other
      description: Media kind.
    ConfusableStatus:
      type: string
      enum:
      - suggested
      - confirmed
      - rejected
      description: State of a confusable pair.
    ConfusableReason:
      type: string
      enum:
      - homophone
      - look_alike
      - meaning
      description: Why two notes are confusable.
    SpanOrigin:
      type: string
      enum:
      - detected
      - manual
      description: How a grammar span came to be.
    JobKind:
      type: string
      enum:
      - dict-refresh
      - media-import
      - media-parse
      - jpdb-deck-import
      - jpdb-history-import
      - fsrs-optimize
      - tts
      - deck-build
      - grammar-detect
      description: Job type slug. Payload and result schema per kind are listed on `Job`. Only public kinds; server-internal
        kinds (C-9, see `Job`) are never values of this enum and never appear in the API.
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      description: queued -> running -> succeeded | failed; queued | running -> cancelled.
    CardState:
      type: string
      enum:
      - new
      - learning
      - review
      - relearning
      description: FSRS state of the card's schedule cache.
    ReviewType:
      type: string
      enum:
      - scheduled
      - learning
      - drill
      - cram
      - manual
      description: '`scheduled`, `learning` feed FSRS; `drill`, `cram` are logged only; `manual` is a reschedule or
        reset.'
    ReviewButton:
      type: string
      enum:
      - again
      - hard
      - good
      - easy
      - nothing
      - something
      - okay
      description: Button pressed. Five-button mode uses `nothing`, `something` (both rating 1), `hard`, `okay` (rating
        3), `easy`.
    EventType:
      type: string
      enum:
      - hello
      - sync.changed
      - note.created
      - job.updated
      - device.paired
      - device.revoked
      description: Event type on `GET /events`.
    Problem:
      type: object
      description: RFC 9457 problem details with Kotobaya extension members.
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          description: '`urn:kotobaya:problem:<code>`.'
          examples:
          - urn:kotobaya:problem:not_found
        title:
          type: string
          description: Short, stable, human-readable summary of the code.
          examples:
          - Not found
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code.
          examples:
          - 404
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable machine-readable error code (error table in the API description).
          examples:
          - not_found
        detail:
          type: string
          description: Human-readable explanation of this occurrence. English; not for parsing.
          examples:
          - No note with that id.
        instance:
          type: string
          description: Request path the problem occurred on.
          examples:
          - /api/v1/notes/01931f40-1a2b-7c3d-8e4f-000000000a09
        request_id:
          type: string
          description: Id of this request in the server log (also sent as the `X-Request-Id` response header).
          examples:
          - 01931f43-aaaa-7000-8000-00000000r001
        errors:
          type: array
          description: Present for `validation_failed`, `invalid_query`, `bulk_too_large` and (optionally) `invalid_request` - one element per problem.
          items:
            $ref: '#/components/schemas/FieldError'
        required_scope:
          $ref: '#/components/schemas/Scope'
          description: Present for `insufficient_scope`.
        existing_id:
          type: string
          description: Present for `already_exists` - id of the row (or job) holding the key.
          examples:
          - 01931f40-1a2b-7c3d-8e4f-000000000a01
    FieldError:
      type: object
      description: One validation problem.
      required:
      - pointer
      - code
      - detail
      properties:
        pointer:
          type: string
          description: JSON Pointer into the request body (`/fields/meaning`), or `/<name>` for a query or path parameter.
          examples:
          - /tags/0
        code:
          type: string
          description: One of `required`, `unknown_field`, `invalid_type`, `invalid_value`, `out_of_range`, `too_long`,
            `not_found` (referenced row missing), `immutable`, `conflicting_fields`, or a search-parser code such
            as `unknown_term`.
          examples:
          - invalid_value
        detail:
          type: string
          description: Human-readable explanation.
          examples:
          - Tags must not contain whitespace.
        position:
          type: integer
          minimum: 0
          description: For search-string errors - UTF-16 offset of the error in the string.
          examples:
          - 7
    Health:
      type: object
      description: Liveness answer.
      required:
      - status
      - version
      - time
      properties:
        status:
          type: string
          enum:
          - ok
          description: Always `ok` in a 200 response.
        version:
          type: string
          description: Server build version.
          examples:
          - 0.1.0
        time:
          $ref: '#/components/schemas/Timestamp'
          description: Server clock.
    Meta:
      type: object
      description: Server information and limits.
      required:
      - api_version
      - server_version
      - core_version
      - server_device_id
      - high_water_seq
      - log_epoch
      - server_time
      - dict_release
      - limits
      properties:
        api_version:
          type: string
          enum:
          - v1
          description: API major version.
        server_version:
          type: string
          description: Server build version.
          examples:
          - 0.1.0
        core_version:
          type: string
          description: Version of the shared core the server schedules with.
          examples:
          - 0.1.0
        server_device_id:
          $ref: '#/components/schemas/Uuid'
          description: Origin device of server-built ops; always `00000000-0000-7000-8000-000000000001`.
        high_water_seq:
          type: integer
          format: int64
          minimum: 0
          description: Highest `change.seq` committed (0 = empty log); same meaning as `PushResponse.high_water_seq`.
          examples:
          - 48213
        log_epoch:
          $ref: '#/components/schemas/Uuid'
          description: Identity of the server's log (contracts/sync/SYNC.md 6.2); `high_water_seq` belongs to this epoch.
        server_time:
          $ref: '#/components/schemas/Timestamp'
          description: Server clock.
        dict_release:
          description: Current dictionary release, or null when none is loaded.
          oneOf:
          - type: object
            required:
            - id
            - version
            properties:
              id:
                type: integer
                minimum: 1
                description: Release number.
                examples:
                - 3
              version:
                type: string
                description: Human-readable version.
                examples:
                - 2026.11.0
          - type: 'null'
        limits:
          type: object
          description: Request limits enforced by this server.
          required:
          - max_push_ops
          - max_push_bytes
          - max_op_bytes
          - max_pull_ops
          - max_blob_bytes
          - max_json_bytes
          - max_page_size
          properties:
            max_push_ops:
              type: integer
              const: 500
              description: Maximum ops per `POST /sync/push`; fixed by `PushRequest.ops.maxItems`.
              examples:
              - 500
            max_push_bytes:
              type: integer
              minimum: 5120
              description: |
                Maximum body size (bytes) of `POST /sync/push`; a larger body is
                `413 payload_too_large` (the client then halves the batch, SYNC.md 5.4). Default
                8 MiB (`8388608`). Also the size a `GET /sync/pull` page SHOULD stay under (SYNC.md 6.1).
              examples:
              - 8388608
            max_op_bytes:
              type: integer
              minimum: 1024
              description: |
                Maximum size (bytes) of one op: the UTF-8 length of the op envelope serialized as
                compact JSON, as it appears in `PushRequest.ops` (SYNC.md 5.4). Default 1 MiB
                (`1048576`). Invariant: `max_op_bytes <= max_push_bytes - 4096`, so a batch holding
                one maximal op always fits in a push body. Clients MUST NOT mint a larger op
                (SYNC.md 4); a client that has not read `/meta` yet uses the default. A pushed op
                over the limit is rejected **per op** with `op_too_large` (never a whole-request
                `413`).
              examples:
              - 1048576
            max_pull_ops:
              type: integer
              const: 1000
              description: Maximum `limit` of `GET /sync/pull`; fixed by `PullResponse.ops.maxItems`.
              examples:
              - 1000
            max_blob_bytes:
              type: integer
              format: int64
              description: Maximum blob size.
              examples:
              - 2147483648
            max_json_bytes:
              type: integer
              description: Maximum size of any other JSON request body.
              examples:
              - 4194304
            max_page_size:
              type: integer
              description: Maximum `limit` of paginated lists.
              examples:
              - 500
    LoginRequest:
      type: object
      description: Login credentials.
      additionalProperties: false
      required:
      - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: The account password.
          examples:
          - correct horse battery staple
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
          description: Current TOTP code; required when TOTP is enabled.
          examples:
          - '492817'
    Principal:
      type: object
      description: The credential making the request.
      required:
      - token_id
      - kind
      - name
      - scopes
      - device_id
      - expires_at
      - totp_enabled
      properties:
        token_id:
          $ref: '#/components/schemas/Uuid'
          description: '`api_token.id`.'
        kind:
          $ref: '#/components/schemas/TokenKind'
        name:
          type: string
          description: Audit name of the token.
          examples:
          - web session 2026-11-12
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: Scopes held, in the order read, write, review, import, admin.
        device_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Device the token is bound to, or null.
        expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Expiry, or null for never.
        totp_enabled:
          type: boolean
          description: Whether the server has TOTP configured.
    Device:
      type: object
      description: A row of `app.device`.
      required:
      - id
      - name
      - kind
      - paired_at
      - last_seen_at
      - last_push_at
      - last_pull_seq
      - push_topic
      - revoked_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Device id, generated by the device.
        name:
          type: string
          minLength: 1
          description: Display name.
          examples:
          - Pixel 9
        kind:
          type: string
          enum:
          - android
          - web
          - script
          - server
          description: '`server` is the single built-in row; `script` rows come from `POST /tokens` with `with_device`.'
        paired_at:
          $ref: '#/components/schemas/Timestamp'
          description: Last successful pairing.
        last_seen_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Last authenticated request by one of its tokens.
        last_push_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Last `POST /sync/push`.
        last_pull_seq:
          type: integer
          format: int64
          minimum: 0
          description: Highest `since` the device has pulled with (sync-lag indicator).
          examples:
          - 48211
        push_topic:
          type:
          - string
          - 'null'
          description: ntfy/UnifiedPush endpoint URL for server events, or null.
          examples:
          - https://ntfy.example.net/up-kotobaya-a1b2c3
        revoked_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Set when revoked.
    DeviceList:
      type: object
      description: All devices.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
          description: Devices ordered by `paired_at`.
    DevicePatch:
      type: object
      description: Changes to a device. At least one property.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: New display name.
          examples:
          - Pixel 9 Pro
        push_topic:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2000
          description: New push endpoint (http/https URL), or null to stop push.
    Pairing:
      type: object
      description: A one-time pairing code.
      required:
      - code
      - expires_at
      - pairing_uri
      properties:
        code:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{8}$
          description: 8 characters of Crockford base32 (no I, L, O, U). Compared case-insensitively; hyphens and
            spaces typed by the user are ignored.
          examples:
          - K7Q2M9XD
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time + 10 minutes.
        pairing_uri:
          type: string
          description: '`kotobaya://pair?server=<percent-encoded public base URL including /api/v1>&code=<code>`;
            the QR code content.'
          examples:
          - kotobaya://pair?server=https%3A%2F%2Fkotobaya.example.net%2Fapi%2Fv1&code=K7Q2M9XD
    PairRequest:
      type: object
      description: Device registration.
      additionalProperties: false
      required:
      - code
      - device_id
      - name
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 16
          description: The pairing code.
          examples:
          - K7Q2M9XD
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: UUIDv7 that is the node id of the device's HLC. Generated at first launch and on every
            loss or restore of the local database (reinstall, cleared data, restored backup); reused only by the same
            intact install when re-pairing (contracts/sync/SYNC.md 3.3).
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name.
          examples:
          - Pixel 9
        kind:
          type: string
          enum:
          - android
          - script
          default: android
          description: Device kind.
        push_topic:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2000
          description: UnifiedPush endpoint, if already known.
        hlc_last:
          $ref: '#/components/schemas/Hlc'
          description: The device's persisted `sync_state.hlc_last` (SYNC.md 3.2), sent when re-pairing an existing
            `device_id`. Its device part must equal `device_id`. If it is below the greatest HLC the server has
            logged for that device, pairing fails with `422` (`hlc_regressed`) and the client must pair as a new device.
            Omitted by a fresh install.
    PairResponse:
      type: object
      description: Result of pairing.
      required:
      - token
      - token_id
      - scopes
      - device
      - server_device_id
      - high_water_seq
      properties:
        token:
          type: string
          pattern: ^kbd_[A-Za-z0-9]{40}$
          description: The device token. Shown only here.
          examples:
          - kbd_Qm3xT9LpV2rA7sWc0bYdE5fGhJ8kN1uZ4iO6aXyR
        token_id:
          $ref: '#/components/schemas/Uuid'
          description: '`api_token.id` of the new token.'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: Always `[read, write, review]`.
        device:
          $ref: '#/components/schemas/Device'
        server_device_id:
          $ref: '#/components/schemas/Uuid'
          description: The server device id.
        high_water_seq:
          type: integer
          format: int64
          minimum: 0
          description: Current sync head; a new device pulls from 0 up to at least this.
          examples:
          - 48213
    Token:
      type: object
      description: Metadata of a credential (`app.api_token`). The token string and hash are never returned.
      required:
      - id
      - name
      - kind
      - token_prefix
      - scopes
      - device_id
      - created_at
      - expires_at
      - last_used_at
      - revoked_at
      - active
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
