openapi: 3.1.0
info:
  title: Kotobaya API
  version: 1.0.0
  summary: Public REST API of the Kotobaya SRS server. Frozen contract (T004).
  license:
    name: Proprietary (personal project)
    identifier: LicenseRef-Kotobaya-Personal
  description: |
    Versioned REST/JSON interface at `/api/v1`. The web app uses nothing else; the Android app uses
    `sync`, `blobs`, `dict/release`, `devices/pair`, `devices/self` and whatever conveniences it likes.

    Implementers: this file is the contract. If something you need is missing or wrong, do not work
    around it; return `CONTRACT_CHANGE_REQUEST`. Additive changes stay in v1; breaking changes go
    to `/api/v2`.

    ## 1. Conventions

    - **JSON.** Request and response bodies are `application/json; charset=utf-8` unless stated.
      Property names are `snake_case` and equal the column names of `contracts/db/V1__init.sql`
      wherever a property mirrors a column; the column `COMMENT` is then the definition.
    - **Unknown properties.** Servers reject unknown request properties and unknown query
      parameters with `422 validation_failed`. Clients MUST ignore unknown response properties and
      MUST treat unknown enum values in responses as "other" (v1 may add both).
    - **Absent vs null.** In `PATCH` bodies an absent property means "leave unchanged"; `null` means
      "set to NULL" where the property is nullable and is a validation error otherwise.
      Responses always include every documented property; nullable ones are `null`, never absent,
      unless the property is documented as "omitted when ...".
    - **Ids.** Row ids are UUIDv7 in canonical lowercase `8-4-4-4-12` text. Uppercase ids in
      requests are rejected with `422`. "Entry" always means a JMdict sequence number (`seq`,
      JSON integer).
    - **Time.** Instants are RFC 3339 UTC strings with millisecond precision and a `Z` suffix,
      e.g. `2026-11-12T09:30:00.000Z`. Servers accept any RFC 3339 offset on input and normalise
      to UTC. A "study day" is a local date `YYYY-MM-DD` computed from the settings
      `scheduler.timezone` and `scheduler.day_rollover_hour`: study day D covers local time
      `D rollover:00` (inclusive) to `D+1 rollover:00` (exclusive).
    - **Text offsets** into sentence text are UTF-16 code units, half-open `[start, end)`.
    - **Blobs** (audio, images, uploads, snapshots) are addressed by the lowercase hex SHA-256 of
      their bytes and transferred through `/blobs/{hash}`, never inline in JSON.

    ## 2. Authentication and scopes

    Three credential kinds, all rows of `app.api_token` (stored hashed):

    | Kind | How obtained | Sent as | Scopes |
    |---|---|---|---|
    | `session` | `POST /auth/login` | cookie `kotobaya_session` (HTTP-only) | all five |
    | `device` | `POST /devices/pair` | `Authorization: Bearer kbd_...` | `read`, `write`, `review` |
    | `personal` | `POST /tokens` | `Authorization: Bearer kbp_...` | chosen at creation |

    Token strings are `<3-letter kind prefix>_<40 characters of [A-Za-z0-9]>` (`kbs_`, `kbd_`,
    `kbp_`), generated from a CSPRNG. `token_hash` = lowercase hex SHA-256 of the whole string;
    `token_prefix` = its first 8 characters. A token is valid iff `revoked_at IS NULL` and
    (`expires_at IS NULL` or `expires_at > now()`) and, when it has a `device_id`, that device is
    not revoked. Validity is checked on every request (no caching longer than 5 seconds), so
    revocation takes effect at once.

    Scopes are independent (no scope implies another):

    | Scope | Grants |
    |---|---|
    | `read` | Every `GET` of learning, media and reference data; `POST /parse`; `GET /events`; `GET /sync/pull`; exports. |
    | `write` | Create, change, delete notes, cards, decks, grammar, note types, presets, settings, word status, parse overrides, media metadata; upload blobs; `POST /sync/push` (non-review ops). |
    | `review` | `POST /review/answer`, `POST /review/undo`, `POST /drill/session`, `POST /cards/bulk/schedule`; `review.*` ops inside `POST /sync/push` (per op; without it the op is rejected with `insufficient_scope`). |
    | `import` | Start and cancel import, parse, dictionary and optimizer jobs; upload blobs. |
    | `admin` | Devices, pairing, tokens (a device's own row: `/devices/self` with `read`/`write`). |

    Each operation lists the scope it needs in its `security` requirement: the array after the
    scheme name. When two alternatives are listed for one scheme the caller needs either. A request
    with no or an invalid credential gets `401 unauthenticated`; a valid credential lacking the
    scope gets `403 insufficient_scope`. Operations with `security: []` are public.

    There are exactly two places where who may call is not just "scheme + scope", and both are
    declared in the operation, not only in prose:
    - `GET/PATCH /devices/self` (`read` / `write`, bearer only): the token must be bound to a
      device, else `403 device_required`. A device never needs `admin` to manage its own row;
      `/devices/{device_id}` is admin only.
    - `POST /ankiconnect` (`x-auth: body-key`): the token may instead be sent in the JSON body
      property `key`; the empty `{}` alternative in its `security` only signals that no header is
      needed. The scope for `key` is `x-body-key-scope`.

    **CSRF.** A request authenticated by the session cookie whose method is not `GET` or `HEAD`
    MUST carry the header `X-Kotobaya-Csrf: 1`; otherwise `403 csrf_required`. The cookie is set
    with `HttpOnly; Secure; SameSite=Strict; Path=/api`. The server sends no CORS headers (the web
    app is served from the same origin). If both a cookie and an `Authorization` header are
    present, the header wins and the cookie is ignored.

    **Audit.** Every request is logged with `token.id` and `token.name` (structured server log;
    there is no audit table or endpoint in v1). Ops record the token in `change.token_id`.

    ## 3. Writes are sync ops

    Learning data is only ever changed by applying sync ops (`contracts/sync`). Every REST
    operation that changes learning data is a convenience wrapper: the server builds the op(s)
    named in the operation's `x-emits-ops`, applies them through the same op-apply path as
    `POST /sync/push` in one transaction, and they then appear in `GET /sync/pull` for every
    device. Op names are those of `contracts/db/SCHEMA.md` section 4; `contracts/sync` is
    authoritative for names and payloads.

    For an op the server builds on behalf of a REST call:

    - `op_id` is a fresh UUIDv7; origin `device_id` is the **server device**
      `00000000-0000-7000-8000-000000000001` (also for session and device tokens: only one party
      ever generates HLCs for a given device id); `hlc` comes from the server's HLC clock;
      `change.token_id` is the calling token.
    - A property absent from a `PATCH` body produces no register write. A property present with
      the value the row already has still produces a write (it bumps the register's clock).
    - If a call changes nothing (documented per operation, e.g. deleting an already deleted
      note), no op is emitted and the response is still successful.
    - **Never an invalid op (C-6).** If a request would make the server build an op that fails
      its schema or an op-level rule in `contracts/sync` - a tag containing ECMA-262 whitespace
      (e.g. U+3000 or U+00A0), U+0000 in any string (field values and open JSON objects
      included), an integer above its op maximum (`2147483647` for int4 columns) or an instant
      after `9999-12-31T23:59:59.999Z` - the call is `422 validation_failed` with a field error
      at that request property, code `invalid_value` (or `out_of_range` / `too_long` where the
      operation's own request bound fails first). Nothing is emitted; never a `500`.
      SYNC.md 2.1 "Storable values" and "Input that would mint an invalid op".
    - Responses to mutating calls carry the header `Kotobaya-Seq`: the `change.seq` of the last op
      the call emitted. A client holding a local replica knows it has seen the effect once its
      pull cursor is at or past that value. The header is absent when no op was emitted.

    **Idempotent creation.** Create bodies accept an optional client-generated `id` (UUIDv7).
    Re-sending a create with an `id` that already exists returns the existing resource with
    status `200` instead of `201` and emits nothing, whatever the rest of the body says. Clients
    that may retry MUST send `id`. When `id` is omitted the server generates one. `POST /review/answer`
    requires `id` (a duplicate review would corrupt scheduling); `POST /media/import` takes the same
    optional idempotency id as `media_id`.

    The existence check and the emit are **one transaction that takes advisory lock `7033001`
    before the check** and holds it until commit (the lock `POST /sync/push` takes per op,
    SYNC.md 5.2): check whether `id` exists; if not, mint, apply and log the op(s) - for
    `createNote` the `note.created` and every `card.created` - then commit. Without the lock two
    concurrent retries of the same create both pass the check; the second `note.created` is a
    no-op on the row (SYNC.md 7.2) but its `card.created` ops carry fresh card ids, so the note
    would get duplicate cards. The same holds for every other id-idempotent call
    (`POST /review/answer`, `POST /review/undo`, `POST /media/import`), and a pushed op that
    creates the same id races safely because it takes the same lock.

    **Tombstones and merges.** Deleted learning rows are tombstones (`deleted_at` set). `GET` by
    id of a deleted row returns `410 gone` unless `include_deleted=true`; lists omit deleted rows
    unless `include_deleted=true`. A note or card that lost a merge (`merged_into_id` set) is
    answered with its survivor: `GET`, `PATCH` and review calls addressed to the loser's id act on
    the survivor and the response body is the survivor (its `id` differs from the requested id;
    the response has `Content-Location` with the survivor's URL).

    ## 4. Pagination

    List operations that take `limit` and `cursor` return `{"items": [...], "next_cursor": ...}`.
    `next_cursor` is an opaque string, or `null` on the last page. Pass it back unchanged as
    `cursor` together with the same other parameters; changing any other parameter while passing
    a cursor is `422 validation_failed` (`pointer` `/cursor`). `limit` defaults to 50, maximum 500.
    Order is stable and documented per operation; rows created while paging may or may not appear.

    **Cursor semantics (keyset, no snapshot).** A cursor encodes the sort-key values and the `id`
    of the last row returned; the next page is the rows strictly after that tuple in the current
    order, evaluated against the data at the time of that request. The order is not snapshotted.
    Consequently, while a client pages through a list sorted by a mutable key (`due_at`,
    `updated_at`, `lapses`, ...):
    - a row whose key changes so that it moves from after the cursor to before it is **skipped**;
    - a row whose key changes so that it moves from before the cursor to after it is **returned
      again** (with its new values);
    - a row deleted while paging disappears; one created may or may not appear.
    Rows that do not change are returned exactly once. Clients MUST de-duplicate by `id` (last
    occurrence wins). A client that needs an exact set (bulk actions, exports) uses an `id`-sorted
    list where offered, `POST /cards/bulk` with `query`, or `GET /export`. Lists sorted by an
    immutable key (`id`, `created_at`) have no skips or repeats.
    An empty result is `{"items": [], "next_cursor": null}` with status `200`.

    ## 5. Errors

    Every non-2xx response has the body `application/problem+json` (RFC 9457), schema `Problem`.
    `code` is the stable machine-readable identifier; `type` is `urn:kotobaya:problem:<code>`.

    | Status | `code` | When |
    |---|---|---|
    | 400 | `invalid_request` | Body is not valid JSON, wrong content type framing, malformed header; `POST /sync/push` body not valid against `PushRequestLenient`. |
    | 401 | `unauthenticated` | No credential, or it is unknown, expired or revoked. |
    | 401 | `invalid_credentials` | Wrong password or TOTP code (`POST /auth/login`). |
    | 401 | `totp_required` | TOTP is enabled and `totp_code` was not sent. |
    | 401 | `invalid_pairing_code` | Pairing code unknown, expired or already used. |
    | 403 | `insufficient_scope` | Credential lacks the scope; `required_scope` names it. |
    | 403 | `csrf_required` | Cookie-authenticated write without `X-Kotobaya-Csrf`. |
    | 403 | `device_required` | `POST /sync/push` or `/devices/self` with a credential that has no `device_id`. |
    | 404 | `not_found` | No such resource (also: id of another resource kind). |
    | 409 | `already_exists` | Natural-key collision; `existing_id` names the holder. |
    | 409 | `builtin_immutable` | Deleting a built-in note type or the Default preset, or removing a built-in field. |
    | 409 | `in_use` | Deleting a note type that live notes use. |
    | 409 | `deck_read_only` | Changing items or deleting a `media`/`list` deck through deck endpoints. |
    | 409 | `not_applicable` | The resource kind does not support the operation (e.g. items of a smart deck). |
    | 409 | `card_not_reviewable` | Card is suspended. |
    | 409 | `job_not_cancellable` | Job already finished. |
    | 410 | `gone` | Tombstoned row requested without `include_deleted=true`. |
    | 413 | `payload_too_large` | Body over the limit in `GET /meta`. On `POST /sync/push` only for the whole batch (the client halves it); one op over `max_op_bytes` is a per-op `op_too_large` result instead. |
    | 415 | `unsupported_media_type` | Wrong `Content-Type`. |
    | 422 | `validation_failed` | Well-formed but invalid; `errors[]` lists each problem. |
    | 422 | `invalid_query` | Card search string does not parse; `errors[0].position` is the UTF-16 offset. |
    | 422 | `bulk_too_large` | Bulk selector matched more than 5000 cards. |
    | 422 | `hash_mismatch` | Uploaded bytes do not hash to the `{hash}` in the path. |
    | 429 | `rate_limited` | Too many login or pairing attempts; see `Retry-After`. |
    | 500 | `internal` | Bug. Safe to retry idempotent calls. |
    | 503 | `unavailable` | Database or object store unreachable. Retry with backoff. |

    Check order: 401, then 403, then 404/410, then 415/400, then 422, then 409.

    ## 6. Events

    `GET /events` is a server-sent events stream; see that operation. Event payload schemas are
    `Event*` in components.
  contact:
    name: Kotobaya
    url: https://kotobaya.invalid/api/docs
servers:
  - url: /api/v1
    description: Same origin as the web app (reached over the VPN).
tags:
  - {name: meta, description: Health and server information.}
  - {name: auth, description: Web session login.}
  - {name: devices, description: Paired devices and pairing.}
  - {name: tokens, description: Personal access tokens and credential listing.}
  - {name: settings, description: 'Synced user settings (`app.settings`).'}
  - {name: presets, description: 'Scheduling presets (`app.fsrs_params`).'}
  - {name: note-types, description: Note types and card templates.}
  - {name: dictionary, description: 'Reference data (`ref.*`), read-only.'}
  - {name: notes, description: Notes.}
  - {name: cards, description: Cards and the card search language.}
  - {name: review, description: 'Online reviewing (the server schedules with the shared core).'}
  - {name: decks, description: Decks and deck items.}
  - {name: media, description: 'Media library, import, sentences, coverage.'}
  - {name: words, description: 'Word status, hot words, leeches, confusables.'}
  - {name: grammar, description: Grammar library and spans.}
  - {name: stats, description: Statistics.}
  - {name: parsing, description: Ad-hoc parsing and parse overrides.}
  - {name: jobs, description: Background jobs.}
  - {name: blobs, description: Content-addressed binary objects.}
  - {name: sync, description: Operation-log sync.}
  - {name: export, description: Full export.}
  - {name: events, description: Server-sent events.}
  - {name: compat, description: Compatibility endpoints.}
paths:
  /health:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness and readiness probe.
      description: |
        Public. `200` when the API can reach Postgres, `503` (problem `unavailable`) otherwise.
        Does not check the object store or the worker.
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              examples: {default: {$ref: '#/components/examples/Health'}}
        default: {$ref: '#/components/responses/Problem'}
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Server versions, limits and sync head.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: Server information.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Meta'}
              examples: {default: {$ref: '#/components/examples/Meta'}}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Password login; sets the session cookie.
      description: |
        Public. Verifies the password (and TOTP code when TOTP is enabled) against the hash and
        secret the server reads from its environment (Kubernetes Secret; there is no user table).
        On success inserts an `api_token` row of kind `session` (name `web session <ISO date>`,
        all five scopes, `expires_at` = now + 30 days) and sets
        `Set-Cookie: kotobaya_session=<token>; Path=/api; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000`.
        The token string is never returned in the body.

        Edge cases:
        - Wrong password, or wrong `totp_code`: `401 invalid_credentials` (same response for both).
        - TOTP enabled and `totp_code` absent: `401 totp_required` (password is not checked first,
          so the response does not reveal whether the password was right).
        - TOTP codes are 6 digits, 30 s step, accepted for the current and the previous step; a
          code is accepted once.
        - More than 5 failures from one client address in 15 minutes: `429 rate_limited` with
          `Retry-After`, also for correct credentials, until the window passes.
        - Already logged in: a new session is created; the old one stays valid until it expires
          or is logged out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            examples:
              password: {summary: Password only, value: {password: correct horse battery staple}}
              totp: {summary: With TOTP, value: {password: correct horse battery staple, totp_code: '492817'}}
      responses:
        '200':
          description: Logged in. The session cookie is set.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema: {type: string}
              example: kotobaya_session=kbs_4f9aQ2mX7LrT0bVnC8sDyE1uGhJkW3pZ6iOAxYzR; Path=/api; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
              examples: {default: {$ref: '#/components/examples/PrincipalSession'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session and clear the cookie.
      description: |
        Sets `revoked_at` on the calling session token and clears the cookie
        (`Set-Cookie: kotobaya_session=; Path=/api; Max-Age=0`). Called with a bearer token of
        kind `device` or `personal` it revokes nothing and returns `422 validation_failed`
        (revoke those with `DELETE /tokens/{id}` or `DELETE /devices/{id}`).
      security:
        - sessionCookie: [read]
      responses:
        '204': {description: Logged out.}
        default: {$ref: '#/components/responses/Problem'}
  /auth/session:
    get:
      operationId: getPrincipal
      tags: [auth]
      summary: Who am I - the credential making this request.
      description: Works for every credential kind. Needs no particular scope, only a valid credential.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        '200':
          description: The calling credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
              examples:
                session: {$ref: '#/components/examples/PrincipalSession'}
                device: {$ref: '#/components/examples/PrincipalDevice'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- devices
  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List devices, including revoked ones and the built-in server device.
      description: Not paginated (a handful of rows). Ordered by `paired_at` ascending, then `id`.
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      responses:
        '200':
          description: All devices.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceList'}
              examples: {default: {$ref: '#/components/examples/DeviceList'}}
        default: {$ref: '#/components/responses/Problem'}
  /devices/pairings:
    post:
      operationId: createPairing
      tags: [devices]
      summary: Create a one-time pairing code (shown as a QR code by the web app).
      description: |
        Returns a code valid for 10 minutes and usable once. Pairing codes are held by the server
        (in memory is acceptable in v1: a restart invalidates outstanding codes; the response to
        `POST /devices/pair` is then `401 invalid_pairing_code` and the user creates a new code).
        Any number of codes may be outstanding. The QR code encodes `pairing_uri` verbatim.
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      responses:
        '201':
          description: Pairing code created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pairing'}
              examples: {default: {$ref: '#/components/examples/Pairing'}}
        default: {$ref: '#/components/responses/Problem'}
  /devices/pair:
    post:
      operationId: pairDevice
      tags: [devices]
      summary: Exchange a pairing code for a long-lived device token.
      description: |
        Public (the code is the credential). In one transaction: consumes the code, upserts the
        `device` row with the client-generated `device_id`, revokes every earlier token of that
        device, inserts an `api_token` of kind `device` (name = device name, scopes
        `read`, `write`, `review`, no expiry) and returns the token string - the only time it is
        ever shown. Emits the event `device.paired`.

        Edge cases:
        - **Device id reuse** (contracts/sync/SYNC.md 3.3). A device id is the node id of that
          replica's HLC, so it may be reused only by the same install with its local database
          intact (its `hlc_last` never went backwards). Clients MUST mint a new UUIDv7
          `device_id` on first launch, after a reinstall, after clearing app data and after
          restoring the local database from a backup, and MUST send their existing id only when
          re-pairing an intact install (typically after the device was revoked, or its token
          was lost). The server cannot detect every violation; it checks what it can (next item).
        - **`hlc_last` check** (optional field). A client re-pairing an existing `device_id`
          SHOULD send its persisted `sync_state.hlc_last`. Inside the pairing transaction, if
          `hlc_last` is present and is below (byte-wise, SYNC.md 3.1) the greatest `change.hlc`
          logged with `device_id` = this device, the local database went backwards (typically
          an Android Auto Backup restore, or a copied database) and reusing the id could repeat
          HLCs: `422 validation_failed` with `errors[0].pointer = /hlc_last`,
          `errors[0].code = hlc_regressed`. The transaction is rolled back, so the code is
          **not** consumed; the client mints a new UUIDv7 `device_id`, resets its replica state
          as for a new device, and pairs again with the same code. `hlc_last` whose device part
          is not `device_id` is also `422 validation_failed` (`code = invalid_value`). Equal to
          the greatest logged HLC is fine (it is the last op the device minted). Absent, or a
          `device_id` that has never logged an op: no check. The server reads the maximum under
          advisory lock `7033001`, so a concurrent push cannot slip between the check and the commit.
        - `device_id` already exists and the request re-pairs that intact install: the row is
          reused, `name`, `kind`, `push_topic` are overwritten, `revoked_at` is cleared,
          `paired_at` is set to now. Ops the device pushed earlier stay; its unpushed outbox can
          now be pushed.
        - `device_id` is the server device id: `422 validation_failed`.
        - Both checks above run before the code is consumed; on `422` the code stays valid.
        - Code unknown, expired or used: `401 invalid_pairing_code`. More than 10 failures from
          one client address in 15 minutes: `429 rate_limited`.
        - Two requests race with one code: exactly one succeeds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairRequest'}
            examples:
              default:
                value:
                  code: K7Q2M9XD
                  device_id: 01931f3e-0000-7000-8000-0000000000a1
                  name: Pixel 9
                  kind: android
                  push_topic: https://ntfy.example.net/up-kotobaya-a1b2c3
              repair:
                summary: Re-pairing an intact install after its device was revoked
                value:
                  code: K7Q2M9XD
                  device_id: 01931f3e-0000-7000-8000-0000000000a1
                  name: Pixel 9
                  kind: android
                  hlc_last: 0193a1b2c3d4-0001-01931f3e-0000-7000-8000-0000000000a1
      responses:
        '201':
          description: Paired. Store `token` securely; it cannot be retrieved again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairResponse'}
              examples: {default: {$ref: '#/components/examples/PairResponse'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422':
          description: Invalid body, the server device id, or `hlc_last` below what this device id has already logged.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                hlc_regressed:
                  value:
                    type: urn:kotobaya:problem:validation_failed
                    title: Validation failed
                    status: 422
                    code: validation_failed
                    detail: This device's local database is older than its synced history; pair as a new device.
                    request_id: 01931f43-aaaa-7000-8000-00000000r031
                    errors:
                    - pointer: /hlc_last
                      code: hlc_regressed
                      detail: hlc_last 0193a1b2c3d4-0001-… is below 0193a1b2c9f0-0000-…, the latest op logged for this device.
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
  /devices/self:
    get:
      operationId: getOwnDevice
      tags: [devices]
      summary: The device the calling token is bound to.
      description: |
        For tokens bound to a device (`device` tokens, and `personal` tokens created with
        `with_device`). Any other credential (session cookie, personal token without a device)
        gets `403 device_required`. Needs only `read`, so a phone can read its own row without the
        `admin` scope. A revoked device's tokens are invalid, so this never returns a revoked row.
        `self` is a literal path segment and takes precedence over `/devices/{device_id}`.
      security:
        - bearerAuth: [read]
      responses:
        '200':
          description: The caller's device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
              examples: {default: {$ref: '#/components/examples/Device'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateOwnDevice
      tags: [devices]
      summary: Rename the caller's device or change its push topic.
      description: |
        Same body and effect as `PATCH /devices/{device_id}`, applied to the device the calling
        token is bound to; this is how the phone registers its UnifiedPush endpoint. Needs only
        `write`. Credentials not bound to a device get `403 device_required`. Direct write to the
        system table `device` (not learning data, no op).
      x-emits-ops: []
      security:
        - bearerAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevicePatch'}
            examples:
              push: {value: {push_topic: 'https://ntfy.example.net/up-kotobaya-a1b2c3'}}
              rename: {value: {name: Pixel 9 Pro}}
      responses:
        '200':
          description: The updated device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
              examples: {default: {$ref: '#/components/examples/Device'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /devices/{device_id}:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    get:
      operationId: getDevice
      tags: [devices]
      summary: One device.
      description: Admin only. A device reads its own row through `GET /devices/self`.
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
              examples: {default: {$ref: '#/components/examples/Device'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateDevice
      tags: [devices]
      summary: Rename a device or change its push topic.
      description: |
        Direct write to the system table `device` (not learning data, no op). Admin only; a device
        changes its own row through `PATCH /devices/self`. The server device and revoked devices cannot be patched:
        `409 not_applicable`.
      x-emits-ops: []
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevicePatch'}
            examples:
              rename: {value: {name: Pixel 9 Pro}}
              push: {value: {push_topic: 'https://ntfy.example.net/up-kotobaya-a1b2c3'}}
              no_push: {summary: Stop push, value: {push_topic: null}}
      responses:
        '200':
          description: The updated device.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
              examples: {default: {$ref: '#/components/examples/Device'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a device and all its tokens.
      description: |
        Sets `device.revoked_at` and `api_token.revoked_at` for every token with this `device_id`
        in one transaction. The row is kept (ops reference it). Ops already accepted stay; ops
        the device has not pushed yet are lost unless the same intact install is paired again
        with the same `device_id` (`POST /devices/pair`). Idempotent: revoking a revoked device returns `204`. The server device
        cannot be revoked: `409 not_applicable`. Emits the event `device.revoked`.
      x-emits-ops: []
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      responses:
        '204': {description: Revoked.}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- tokens
  /tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: List credentials of every kind (never the token strings or hashes).
      description: |
        Not paginated. Ordered by `created_at` descending, then `id`. Includes expired and revoked
        rows; filter with `kind` and `active`.
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      parameters:
        - name: kind
          in: query
          description: Only tokens of this kind.
          schema: {$ref: '#/components/schemas/TokenKind'}
          example: personal
        - name: active
          in: query
          description: '`true` = only currently valid tokens; `false` = only expired or revoked; absent = all.'
          schema: {type: boolean}
          example: true
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenList'}
              examples: {default: {$ref: '#/components/examples/TokenList'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a personal access token.
      description: |
        Returns the token string once. `scopes` must be non-empty, without duplicates.
        `expires_at`, when given, must be in the future. With `with_device: true` the server also
        creates a `device` row of kind `script` (server-generated id, same name) and binds the
        token to it, which allows the token to use `POST /sync/push`; revoking the token does not
        revoke that device, revoking the device revokes the token. Names need not be unique.
      x-emits-ops: []
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenCreate'}
            examples:
              script: {value: {name: coverage-script, scopes: [read], expires_at: '2027-11-12T00:00:00.000Z'}}
              importer: {value: {name: nightly-import, scopes: [read, import]}}
      responses:
        '201':
          description: Created. `token` is shown only now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenCreated'}
              examples: {default: {$ref: '#/components/examples/TokenCreated'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /tokens/{token_id}:
    parameters:
      - {$ref: '#/components/parameters/TokenId'}
    get:
      operationId: getToken
      tags: [tokens]
      summary: One credential.
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      responses:
        '200':
          description: The token (metadata only).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Token'}
              examples: {default: {$ref: '#/components/examples/Token'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke a credential of any kind.
      description: |
        Sets `revoked_at`. Idempotent (`204` if already revoked or expired). Rows are kept for the
        audit trail. A caller may revoke the token it is using; the response is still `204` and
        the next request fails with `401`.
      x-emits-ops: []
      security:
        - bearerAuth: [admin]
        - sessionCookie: [admin]
      responses:
        '204': {description: Revoked.}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- settings
  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: All stored settings.
      description: |
        Returns one entry per `app.settings` row whose value is not JSON `null`, ordered by `key`.
        Keys never written are absent: their defaults live in the shared core, not on the server.
        Well-known keys are listed in `contracts/db/SCHEMA.md` section 6; unknown keys are stored
        and returned untouched.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: Stored settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingList'}
              examples: {default: {$ref: '#/components/examples/SettingList'}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Set one or more settings.
      description: |
        Server emits one `settings.set` op per key in `values`, in ascending key order, all in one
        transaction. A JSON `null` value resets the key to its default (the row is kept with value
        `null` so the reset wins against older writes). Keys must match
        `^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$`. Values of well-known keys are validated against
        the types in SCHEMA.md section 6 (`422` with `pointer` `/values/<key>`); values of unknown
        keys are accepted as any JSON. An empty `values` object is `422`.
        The response is the full list as `GET /settings` returns it after the change.
      x-emits-ops: [settings.set]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettingsPatch'}
            examples:
              set: {value: {values: {scheduler.timezone: Asia/Tokyo, scheduler.new_per_day: 15}}}
              reset: {summary: Reset to default, value: {values: {scheduler.leech_threshold: null}}}
      responses:
        '200':
          description: All stored settings after the change.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingList'}
              examples: {default: {$ref: '#/components/examples/SettingList'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- presets
  /presets:
    get:
      operationId: listPresets
      tags: [presets]
      summary: List scheduling presets.
      description: Not paginated. Ordered by `created_at`, then `id` (the Default preset first).
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: Presets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresetList'}
              examples: {default: {$ref: '#/components/examples/PresetList'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createPreset
      tags: [presets]
      summary: Create a preset.
      description: |
        Server emits `fsrs_params.created`. Omitted properties take the column defaults. Weights
        cannot be set through the API; they are published by the optimizer job.
      x-emits-ops: [fsrs_params.created]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresetCreate'}
            examples:
              default: {value: {name: Kanji, desired_retention: 0.85, learning_steps_s: [60, 600, 3600]}}
      responses:
        '200':
          description: A preset with this `id` already existed; returned unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preset'}
              examples: {default: {$ref: '#/components/examples/Preset'}}
        '201':
          description: Created.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preset'}
              examples: {default: {$ref: '#/components/examples/Preset'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /presets/{preset_id}:
    parameters:
      - {$ref: '#/components/parameters/PresetId'}
    get:
      operationId: getPreset
      tags: [presets]
      summary: One preset.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: The preset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preset'}
              examples: {default: {$ref: '#/components/examples/Preset'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updatePreset
      tags: [presets]
      summary: Change preset options.
      description: |
        Server emits one `fsrs_params.updated` carrying the registers present in the body. Changing
        any option makes every card cache on the preset stale; replicas recompute (SCHEMA.md 4.2).
        Patching a deleted preset: `410 gone`.
      x-emits-ops: [fsrs_params.updated]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresetPatch'}
            examples:
              retention: {value: {desired_retention: 0.88}}
              easy_days: {summary: Light Sundays, value: {easy_days: [1, 1, 1, 1, 1, 1, 0.5]}}
      responses:
        '200':
          description: The updated preset.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preset'}
              examples: {default: {$ref: '#/components/examples/Preset'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deletePreset
      tags: [presets]
      summary: Delete a preset.
      description: |
        Server emits `fsrs_params.deleted`. Cards pointing at a deleted preset are scheduled with
        the Default preset (their `preset_id` is not rewritten). The Default preset
        (`00000000-0000-7000-8000-000000000010`) cannot be deleted: `409 builtin_immutable`.
        Already deleted: `204`, no op.
      x-emits-ops: [fsrs_params.deleted]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Deleted.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /presets/{preset_id}/optimize:
    parameters:
      - {$ref: '#/components/parameters/PresetId'}
    post:
      operationId: optimizePreset
      tags: [presets]
      summary: Queue an FSRS optimizer run for this preset.
      description: |
        Enqueues a job of kind `fsrs-optimize` (payload `JobPayloadFsrsOptimize`, dedupe key
        `fsrs-optimize:<preset id>`). If a queued or running job with that key exists it is
        returned with `200` instead of creating another. When the job succeeds the worker
        publishes the weights: the server emits `fsrs_params.published` (not this request).
        The weekly schedule enqueues the same job for every live preset.
      x-emits-ops: []
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      responses:
        '200':
          description: An equivalent job is already queued or running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobOptimize'}}
        '202':
          description: Job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobOptimize'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- note types
  /note-types:
    get:
      operationId: listNoteTypes
      tags: [note-types]
      summary: List note types (built-ins and your own).
      description: Not paginated. Ordered by `builtin` descending, then `created_at`, then `id`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: Note types.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NoteTypeList'}
              examples: {default: {$ref: '#/components/examples/NoteTypeList'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createNoteType
      tags: [note-types]
      summary: Create a note type.
      description: |
        Server emits `note_type.created`. `base_type` is immutable. `fields` must be non-empty with
        unique keys; `templates` must contain at least one card kind. `builtin` is always `false`
        for created types. A `vocab` type MUST have field keys `expression`, `reading` and
        `meaning` (custom types such as a Takoboto one map their fields onto them); otherwise
        `422 validation_failed`, error `invalid_value` at `/fields`. The same holds for a
        `PATCH` that replaces a vocab type's `fields` (C-2, OPS.md `note_type.created`).
      x-emits-ops: [note_type.created]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NoteTypeCreate'}
            examples:
              default:
                value:
                  name: Takoboto Vocab
                  base_type: vocab
                  fields:
                    - {key: expression, label: Expression, kind: text}
                    - {key: reading, label: Reading, kind: text}
                    - {key: meaning, label: Meaning, kind: text}
                  templates:
                    meaning: {default: true, front: '<div class="expr">{{expression}}</div>', back: '{{meaning}}'}
                    reading: {default: true, front: null, back: null}
      responses:
        '200':
          description: A note type with this `id` already existed; returned unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NoteType'}
              examples: {default: {$ref: '#/components/examples/NoteType'}}
        '201':
          description: Created.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NoteType'}
              examples: {default: {$ref: '#/components/examples/NoteType'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /note-types/{note_type_id}:
    parameters:
      - {$ref: '#/components/parameters/NoteTypeId'}
    get:
      operationId: getNoteType
      tags: [note-types]
      summary: One note type.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: The note type.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NoteType'}
              examples: {default: {$ref: '#/components/examples/NoteType'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateNoteType
      tags: [note-types]
      summary: Edit a note type's name, fields, templates or CSS.
      description: |
        Server emits one `note_type.updated` with the registers present in the body:
        `name`, `fields` (whole array), `css`, and one `templates.<kind>` register per key of
        `templates`.

        - `fields` replaces the whole array. Existing keys may be reordered and relabelled and new
          keys added. Removing a key is allowed for your own types (note values under that key are
          kept in `note.fields`) and is `409 builtin_immutable` for built-in types.
        - `templates` is a partial map: only the kinds present are written. A kind cannot be
          removed once it exists (cards may reference it); set `default: false` to stop creating it.
        - Works on built-in types (name, templates and CSS of built-ins may be edited).
      x-emits-ops: [note_type.updated]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NoteTypePatch'}
            examples:
              template: {value: {templates: {listening: {default: true, front: null, back: null}}}}
              css: {value: {css: '.expr { font-size: 3rem; }'}}
      responses:
        '200':
          description: The updated note type.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NoteType'}
              examples: {default: {$ref: '#/components/examples/NoteType'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteNoteType
      tags: [note-types]
      summary: Delete one of your own note types.
      description: |
        Server emits `note_type.deleted`. Built-in: `409 builtin_immutable`. Any live note uses
        it: `409 in_use` (delete or leave the notes first). Already deleted: `204`, no op.

        Notes of a deleted type stay usable (SYNC.md 7.3): an offline device may still create a
        note of a type deleted elsewhere (its push is accepted), and deletion is permanent, so
        hiding such notes would lose them for good. They are listed, searched, edited (`PATCH
        /notes/{id}`) and their cards reviewed like any other; they are rendered with the type's
        last `fields`, `templates` and `css`, which `GET /note-types/{id}?include_deleted=true`
        returns. The deleted type is omitted from `GET /note-types` (without `include_deleted`)
        and `POST /notes` refuses it (a client SHOULD NOT offer it for new notes).
      x-emits-ops: [note_type.deleted]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Deleted.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- dictionary
  /dict/search:
    get:
      operationId: searchDictionary
      tags: [dictionary]
      summary: Search JMdict entries by kanji, kana, romaji or English.
      description: |
        `q` is trimmed and NFKC-normalised. Interpretation, in order:
        1. Contains kanji or kana: katakana is folded to hiragana and matched against
           `dict_entry_form.norm` - 1 or 2 characters: exact or prefix; 3 or more: substring.
        2. Otherwise (Latin letters): the server's romaji-to-kana conversion (wanakana-equivalent:
           Hepburn and common IME spellings, `nn`/`n'` for ん, doubled consonant for っ) is tried
           and, if the whole string converts, matched as in 1; the string is also matched
           case-insensitively as a substring of English glosses. Both result sets are merged.
        No deinflection: the input is matched as given (`たべた` does not find `食べる` unless a
        form of that entry contains `たべた`). Deinflection is the parser's job (`POST /parse`),
        not this search's (C-2).
        Retired entries are never returned. Order: exact form match first, then prefix, then
        the rest; inside each group `freq_rank` ascending with NULLs last, then `seq`.
        An empty or whitespace-only `q` is `422`. No match is an empty page.
        Each item carries the caller's `status` and `note_id` overlay.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: q
          in: query
          required: true
          description: Search text, 1 to 100 characters after trimming.
          schema: {type: string, minLength: 1, maxLength: 100}
          example: たべる
        - name: common_only
          in: query
          description: Only entries with `is_common = true`.
          schema: {type: boolean, default: false}
          example: false
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of matching entries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DictEntrySummaryPage'}
              examples: {default: {$ref: '#/components/examples/DictEntrySummaryPage'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /dict/entries/{seq}:
    parameters:
      - {$ref: '#/components/parameters/Seq'}
    get:
      operationId: getDictEntry
      tags: [dictionary]
      summary: One JMdict entry with frequency, pitch, kanji and your status.
      description: Retired entries are still returned (`retired` is true). Unknown `seq` is `404`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DictEntry'}
              examples: {default: {$ref: '#/components/examples/DictEntry'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dict/entries/{seq}/examples:
    parameters:
      - {$ref: '#/components/parameters/Seq'}
    get:
      operationId: listEntryExamples
      tags: [dictionary]
      summary: Example sentences for an entry, from your media and from Tatoeba.
      description: |
        `media`: up to `limit` sentences from imported media that contain the entry (resolved
        through `occurrence.sentence_ids`), sentences with the fewest unknown words first, then
        by media `created_at` descending, then sentence id. `tatoeba`: up to `limit` rows of
        `ref.example_sentence` linked to the entry, shortest text first, then id. Either list may
        be empty. Not paginated. Unknown `seq` is `404`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: limit
          in: query
          description: Maximum number of sentences per list.
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
          example: 10
      responses:
        '200':
          description: Example sentences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntryExamples'}
              examples: {default: {$ref: '#/components/examples/EntryExamples'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dict/release:
    get:
      operationId: getDictRelease
      tags: [dictionary]
      summary: The current dictionary release and its downloadable device builds.
      description: |
        The phone compares `id` with the release of its dictionary file and, when behind,
        downloads an artifact through `GET /blobs/{hash}`: a `diff` whose `from_release` equals
        its release and whose `scope` matches, else the `full` build. `404` when no release has
        been loaded yet. Package and diff formats, hashes and the full install/update algorithm:
        `contracts/db/DICT_PACKAGE.md`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: Current release.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DictRelease'}
              examples: {default: {$ref: '#/components/examples/DictRelease'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /dict/refresh:
    post:
      operationId: refreshDictionary
      tags: [dictionary]
      summary: Queue a dictionary refresh (download sources, build and load a new release).
      description: |
        Enqueues a job of kind `dict-refresh` (payload `JobPayloadDictRefresh`, dedupe key
        `dict-refresh`). An already queued or running refresh is returned with `200`.
        An absent body equals `{}`.
      x-emits-ops: []
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobPayloadDictRefresh'}
            examples:
              default: {value: {freq_lists: [jpdb, bccwj]}}
      responses:
        '200':
          description: A refresh is already queued or running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobDictRefresh'}}
        '202':
          description: Job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobDictRefresh'}}
        default: {$ref: '#/components/responses/Problem'}
  /kanji/hot:
    get:
      operationId: listHotKanji
      tags: [words]
      summary: Hot kanji - recent failures rolled up by kanji.
      description: |
        Scores come from the shared core (hot-word score summed over every live vocab note whose
        entry contains the kanji, via `ref.entry_kanji`). Highest score first, then `literal`.
        Only kanji with a score above zero. Not paginated.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: limit
          in: query
          description: Maximum number of kanji.
          schema: {type: integer, minimum: 1, maximum: 200, default: 20}
          example: 20
      responses:
        '200':
          description: Hot kanji.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HotKanjiList'}
              examples: {default: {$ref: '#/components/examples/HotKanjiList'}}
        default: {$ref: '#/components/responses/Problem'}
  /kanji/{literal}:
    parameters:
      - name: literal
        in: path
        required: true
        description: Exactly one kanji (one Unicode code point), percent-encoded UTF-8. The literal path segment `hot` is the separate operation `listHotKanji`.
        schema: {type: string, minLength: 1, maxLength: 2}
        example: 績
    get:
      operationId: getKanji
      tags: [dictionary]
      summary: One kanji from KANJIDIC2 with components and your kanji note, if any.
      description: |
        More than one code point is `422`; a character not in `ref.kanji` is `404`.
        (`maxLength: 2` because a code point outside the BMP is two UTF-16 units.)
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: The kanji.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Kanji'}
              examples: {default: {$ref: '#/components/examples/Kanji'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- notes
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List or search notes.
      description: |
        All filters combine with AND. Ordered by `created_at` descending, then `id` descending.
        Merge losers appear only with `include_deleted=true`, as tombstones with
        `merged_into_id` set. Each note embeds its live cards.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of any field value, the mnemonic or the source sentence (`note.search_text`).
          schema: {type: string, minLength: 1, maxLength: 200}
          example: 食べ
        - name: type
          in: query
          description: Only notes of this base type.
          schema: {$ref: '#/components/schemas/NoteBaseType'}
          example: vocab
        - name: note_type_id
          in: query
          description: Only notes of this note type.
          schema: {$ref: '#/components/schemas/Uuid'}
          example: 00000000-0000-7000-8000-000000000101
        - name: tag
          in: query
          description: Only notes carrying this exact tag. The virtual tag `leech` is not accepted here (use `GET /cards?query=tag:leech`).
          schema: {type: string, minLength: 1}
          example: anime
        - name: entry_seq
          in: query
          description: Only the (at most one live) note referencing this entry.
          schema: {$ref: '#/components/schemas/EntrySeq'}
          example: 1358280
        - name: kanji_literal
          in: query
          description: Only the kanji note for this kanji.
          schema: {type: string, minLength: 1, maxLength: 2}
          example: 績
        - name: grammar_point_id
          in: query
          description: Only the grammar note for this grammar point.
          schema: {$ref: '#/components/schemas/Uuid'}
          example: 01931f40-4000-7000-8000-000000000901
        - name: updated_since
          in: query
          description: Only notes with `updated_at` strictly after this instant.
          schema: {$ref: '#/components/schemas/Timestamp'}
          example: '2026-11-01T00:00:00.000Z'
        - {$ref: '#/components/parameters/IncludeDeleted'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of notes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotePage'}
              examples: {default: {$ref: '#/components/examples/NotePage'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note and its cards.
      description: |
        Server emits, in one transaction and in this order: `note.created`; one `card.created`
        per card kind (server-generated card ids; kinds = `card_kinds` if given, else the note
        type's kinds with `default: true`, in ascending kind order); `deck.item_put` if `deck_id`
        is given (item key `e:<entry_seq>` when the note has an `entry_seq`, else `n:<note id>`,
        position = current maximum position in the deck + 1024).

        Rules:
        - `note_type_id` must be a live note type. `type` is derived from it.
        - At most one of `entry_seq`, `kanji_literal`, `grammar_point_id`, and only the one that
          fits the base type (`vocab`, `kanji`, `grammar` respectively); otherwise `422`.
          `entry_seq` must exist in `ref.dict_entry` (retired entries are accepted);
          `kanji_literal` need not exist in `ref.kanji`; `grammar_point_id` must be a live
          grammar point.
        - Unknown keys in `fields` are stored as given. Missing keys mean `""`.
        - `tags`: each 1 to 64 characters, no whitespace, not `leech`; stored de-duplicated and
          sorted ascending.
        - `card_kinds` entries must be keys of the note type's `templates`; an empty array
          creates a note without cards.
        - `deck_id` must be a live deck of type `user`; otherwise `409 deck_read_only`.

        **Duplicate reference.** If a live note already references the same entry, kanji or
        grammar point, nothing is created: with `on_duplicate=error` (default) the response is
        `409 already_exists` with `existing_id`; with `on_duplicate=return_existing` it is `200`
        with the existing note, unchanged (if `deck_id` was given the `deck.item_put` is still
        emitted). REST never creates a duplicate on purpose; duplicates created offline are
        merged by the op-apply path (SCHEMA.md 4.2).

        **Idempotency.** An `id` that already exists (live, deleted or merged) returns that note
        (or its survivor) with `200` and emits nothing.
      x-emits-ops: [note.created, card.created, deck.item_put]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      parameters:
        - name: on_duplicate
          in: query
          description: What to do when a live note already references the same entry, kanji or grammar point.
          schema: {type: string, enum: [error, return_existing], default: error}
          example: return_existing
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NoteCreate'}
            examples:
              vocab:
                summary: Vocab note mined from a sentence
                value:
                  id: 01931f40-1a2b-7c3d-8e4f-000000000a01
                  note_type_id: 00000000-0000-7000-8000-000000000101
                  entry_seq: 1358280
                  fields: {sentence: パンを食べる}
                  tags: [anime, frieren]
                  source_sentence: パンを食べる
                  source_sentence_id: 01931f40-5000-7000-8000-000000000701
                  source_media_id: 01931f40-3000-7000-8000-000000000e01
                  origin: reader
              custom:
                summary: Custom note, explicit card kinds
                value:
                  note_type_id: 00000000-0000-7000-8000-000000000106
                  fields: {front: 四字熟語, back: four-character idiom}
                  card_kinds: [basic]
      responses:
        '200':
          description: Nothing created - the `id` already existed, or `on_duplicate=return_existing` matched. Body is the existing note.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
              examples: {default: {$ref: '#/components/examples/Note'}}
        '201':
          description: Created.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
              examples: {default: {$ref: '#/components/examples/Note'}}
        '409': {$ref: '#/components/responses/AlreadyExists'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /notes/{note_id}:
    parameters:
      - {$ref: '#/components/parameters/NoteId'}
    get:
      operationId: getNote
      tags: [notes]
      summary: One note with its live cards.
      description: |
        If the id belongs to a merge loser the survivor is returned (status `200`,
        `Content-Location: /api/v1/notes/<survivor id>`), with or without `include_deleted`.
        A deleted, unmerged note is `410 gone` unless `include_deleted=true`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: The note (or its merge survivor).
          headers: {Content-Location: {$ref: '#/components/headers/ContentLocation'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
              examples: {default: {$ref: '#/components/examples/Note'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Edit a note's fields, tags, mnemonic, source sentence or dictionary match.
      description: |
        Server emits one `note.updated` carrying exactly the registers the body touches:

        | Body property | Register(s) written |
        |---|---|
        | `fields.<key>` | `fields.<key>` for each key present (`""` clears the field) |
        | `tags` | `tags` (whole set) |
        | `add_tags` / `remove_tags` | `tags`: current set plus/minus the given tags, computed by the server at apply time |
        | `mnemonic` | `mnemonic` |
        | any of `source_sentence`, `source_sentence_id`, `source_media_id` | `source_sentence` (one register covering all three; the ones not sent are written as `""` / `null`) |
        | `entry_seq` | `entry_seq` (vocab notes only; `null` un-matches) |

        `tags` together with `add_tags`/`remove_tags` is `422`. An empty body is `422`.
        If the merged set (current tags plus `add_tags`, minus `remove_tags`) would exceed 200
        tags (the op limit, `contracts/sync/common.schema.json#/$defs/tags`), the response is
        `422 validation_failed` with an error `{pointer: /add_tags, code: out_of_range}` and
        nothing is emitted (C-2).
        `note_type_id`, `kanji_literal`, `grammar_point_id` and `origin` are immutable (sending
        them is `422`).

        **Re-match collision.** Setting `entry_seq` to an entry already held by another live note
        is allowed: the op-apply path merges this note into that one (`note.merged`, plus
        `card.created`/`card.merged` as needed, all emitted by the server as a consequence) and
        the response is the survivor.

        **Merged or deleted target.** A merge loser's id acts on the survivor. A deleted,
        unmerged note is `410 gone`.
      x-emits-ops: [note.updated, note.merged, card.created, card.merged]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotePatch'}
            examples:
              field: {summary: Edit one field, value: {fields: {meaning: to eat}}}
              tags: {summary: Add a tag, value: {add_tags: [frieren]}}
              rematch: {summary: Re-match to another entry, value: {entry_seq: 1358290}}
      responses:
        '200':
          description: The updated note (or the survivor after a merge).
          headers:
            Kotobaya-Seq: {$ref: '#/components/headers/Seq'}
            Content-Location: {$ref: '#/components/headers/ContentLocation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
              examples: {default: {$ref: '#/components/examples/Note'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note (permanent tombstone; hides all its cards).
      description: |
        Server emits `note.deleted`. Cards are hidden through the note's tombstone; no
        `card.deleted` ops are emitted. Reviews stay in the log. Word status `auto_status` is
        re-derived. Already deleted, or the id of a merge loser (deleting a duplicate never
        deletes the survivor): `204`, no op.
      x-emits-ops: [note.deleted]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Deleted.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- cards
  /cards:
    get:
      operationId: listCards
      tags: [cards]
      summary: Find cards with the card search language.
      description: |
        `query` is a string in the card search language, parsed by the shared core
        (e.g. `deck:"Frieren" is:due tag:leech lapses>3 kanji:績 rated:7:1 kind:reading`).
        Absent or empty = all live cards. A string that does not parse is `422 invalid_query`
        with the UTF-16 offset of the error in `errors[0].position`. Cards of deleted notes,
        deleted cards and merge losers never match. Each card embeds a `note` summary.
        `is:due` and similar relative terms are evaluated at request time for the current study
        day.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: query
          in: query
          description: Card search string (grammar owned by the shared core). Maximum 2000 characters.
          schema: {type: string, maxLength: 2000}
          example: deck:"Frieren" is:due lapses>3
        - name: sort
          in: query
          description: Sort key; a leading `-` means descending. Ties are broken by card `id` ascending. NULL values sort last in either direction.
          schema:
            type: string
            enum: [created_at, -created_at, due_at, -due_at, updated_at, -updated_at, lapses, -lapses, difficulty, -difficulty, stability, -stability, last_review_at, -last_review_at]
            default: -created_at
          example: due_at
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of cards.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardPage'}
              examples: {default: {$ref: '#/components/examples/CardPage'}}
        '422': {$ref: '#/components/responses/InvalidQuery'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCard
      tags: [cards]
      summary: Add an optional card kind to an existing note.
      description: |
        Server emits `card.created`. `kind` must be a key of the note type's `templates`.
        If the note already has a live card of that kind it is returned with `200` and nothing
        is emitted (REST never creates a duplicate `(note, kind)`). A merge loser's `note_id`
        acts on the survivor. A deleted note is `410 gone`.
      x-emits-ops: [card.created]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardCreate'}
            examples:
              default: {value: {note_id: 01931f40-1a2b-7c3d-8e4f-000000000a01, kind: listening}}
      responses:
        '200':
          description: The card already existed (same `id`, or same note and kind).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Card'}
              examples: {default: {$ref: '#/components/examples/Card'}}
        '201':
          description: Created.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Card'}
              examples: {default: {$ref: '#/components/examples/Card'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /cards/bulk:
    post:
      operationId: bulkCards
      tags: [cards]
      summary: Apply one action to many cards (suspend, tag, move, delete, ...).
      description: |
        Select cards with exactly one of `card_ids` (1 to 5000 ids) or `query` (card search
        string). Unknown, deleted and merged-away ids in `card_ids` are skipped and counted in
        `skipped` (merge losers are **not** redirected in bulk). A selector matching more than
        5000 cards is `422 bulk_too_large`; nothing is applied. Matching zero cards is a
        successful no-op. All ops of one call are applied in one transaction, ordered by card id.

        | `action.type` | Required params | Server emits, per matched card unless noted |
        |---|---|---|
        | `suspend` | - | `card.suspended` |
        | `unsuspend` | - | `card.unsuspended` |
        | `bury` | `until` (optional; default = start of the next study day) | `card.buried` |
        | `unbury` | - | `card.unburied` |
        | `flag` | `flags` (0-7; 0 clears) | `card.flag_set` |
        | `set_preset` | `preset_id` (live preset) | `card.preset_set` |
        | `add_tags`, `remove_tags` | `tags` (non-empty) | one `note.updated` (register `tags`) per **distinct note** of the matched cards |
        | `move` | `to_deck_id` (live `user` deck), optional `from_deck_id` (live `user` deck) | per distinct note: `deck.item_put` into `to_deck_id` (key `e:<seq>` or `n:<note id>`, appended in card-id order at max position + 1024 each) and, with `from_deck_id`, `deck.item_removed` there if the item exists |
        | `delete` | - | `card.deleted` |

        Cards already in the target state still get an op (it bumps the clock) except: `delete`
        on a deleted card, and tag actions that would not change a note's tag set - those are
        counted in `skipped`. An `add_tags` that would give any matched note more than 200 tags
        is `422 validation_failed` (error `out_of_range` at `/action/tags`); nothing is applied
        (C-2). Params not listed for the action type are `422`.
        A `to_deck_id`/`from_deck_id` that is not a live `user` deck is `409 deck_read_only`.
        With `dry_run: true` nothing is emitted and the counts say what would happen.
        Repeating a call is safe: register actions converge.

        Reschedule and reset write review history (`review.logged`) and therefore need the
        `review` scope; they are the separate operation `POST /cards/bulk/schedule`.
      x-emits-ops: [card.suspended, card.unsuspended, card.buried, card.unburied, card.flag_set, card.preset_set, card.deleted, note.updated, deck.item_put, deck.item_removed]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardBulkRequest'}
            examples:
              suspend_leeches: {summary: Suspend all leeches, value: {query: 'tag:leech', action: {type: suspend}}}
              tag: {summary: Tag two cards' notes, value: {card_ids: [01931f40-1a2b-7c3d-8e4f-000000000c01, 01931f40-1a2b-7c3d-8e4f-000000000c02], action: {type: add_tags, tags: [review-later]}}}
              move: {summary: Move to another deck, value: {query: 'deck:"Inbox"', action: {type: move, to_deck_id: 01931f40-2000-7000-8000-000000000d01, from_deck_id: 01931f40-2000-7000-8000-000000000d02}}}
      responses:
        '200':
          description: What was (or with `dry_run` would be) done.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardBulkResult'}
              examples: {default: {$ref: '#/components/examples/CardBulkResult'}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /cards/bulk/schedule:
    post:
      operationId: bulkScheduleCards
      tags: [cards]
      summary: Reschedule or reset many cards (manual review-log rows).
      description: |
        Same selector, limits, ordering, transaction and `dry_run` rules as `POST /cards/bulk`.
        Needs the `review` scope, like every other way of writing `review_log` (`POST /sync/push`
        needs `review` for `review.*` ops; `POST /review/answer`).

        | `action.type` | Required params | Server emits, per matched card |
        |---|---|---|
        | `reschedule` | `due_at` | `review.logged` with `review_type = manual`, `manual_action = set_due`, `manual_due_at = due_at` |
        | `reset` | - | `review.logged` with `review_type = manual`, `manual_action = reset` |

        - `reset` of a card in state `new` is skipped (counted in `skipped`).
        - `reschedule` is `422` for the whole call if any matched card is `new` (a new card has no
          memory state to keep); nothing is applied.
        - Suspended cards are processed (the manual row changes the schedule cache; the card
          stays suspended).
        - Repeating a call adds another manual row per card with the same effect on the
          schedule (manual rows are not deduplicated). Each manual row can be undone with
          `POST /review/undo` by its id (`GET /cards/{card_id}/reviews`).
      x-emits-ops: [review.logged]
      security:
        - bearerAuth: [review]
        - sessionCookie: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardBulkScheduleRequest'}
            examples:
              reschedule: {summary: Reschedule (dry run), value: {query: 'is:due kind:reading', action: {type: reschedule, due_at: '2026-11-20T19:00:00.000Z'}, dry_run: true}}
              reset: {summary: Reset two cards, value: {card_ids: [01931f40-1a2b-7c3d-8e4f-000000000c01, 01931f40-1a2b-7c3d-8e4f-000000000c02], action: {type: reset}}}
      responses:
        '200':
          description: What was (or with `dry_run` would be) done.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CardBulkResult'}
              examples: {default: {$ref: '#/components/examples/CardBulkResult'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /cards/{card_id}:
    parameters:
      - {$ref: '#/components/parameters/CardId'}
    get:
      operationId: getCard
      tags: [cards]
      summary: One card with its note summary.
      description: A merge loser's id returns the survivor (`Content-Location` set). Deleted card, or card of a deleted note - `410 gone` unless `include_deleted=true`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: The card (or its merge survivor).
          headers: {Content-Location: {$ref: '#/components/headers/ContentLocation'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Card'}
              examples: {default: {$ref: '#/components/examples/Card'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateCard
      tags: [cards]
      summary: Suspend, bury, flag or re-preset one card.
      description: |
        Server emits one op per property present, in this order: `suspended` →
        `card.suspended` (true) or `card.unsuspended` (false); `buried_until` → `card.buried`
        (an instant) or `card.unburied` (`null`); `flags` → `card.flag_set`; `preset_id` →
        `card.preset_set` (must be a live preset). An empty body is `422`. A merge loser's id
        acts on the survivor. Schedule properties cannot be patched (use `POST /cards/bulk/schedule`
        `reschedule`/`reset` or review the card).
      x-emits-ops: [card.suspended, card.unsuspended, card.buried, card.unburied, card.flag_set, card.preset_set]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CardPatch'}
            examples:
              suspend: {value: {suspended: true}}
              bury: {value: {buried_until: '2026-11-13T19:00:00.000Z'}}
              flag: {value: {flags: 2}}
      responses:
        '200':
          description: The updated card.
          headers:
            Kotobaya-Seq: {$ref: '#/components/headers/Seq'}
            Content-Location: {$ref: '#/components/headers/ContentLocation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Card'}
              examples: {default: {$ref: '#/components/examples/Card'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteCard
      tags: [cards]
      summary: Delete one card (permanent tombstone); the note and its other cards stay.
      description: Server emits `card.deleted`. Already deleted or a merge loser - `204`, no op.
      x-emits-ops: [card.deleted]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Deleted.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /cards/{card_id}/reviews:
    parameters:
      - {$ref: '#/components/parameters/CardId'}
    get:
      operationId: listCardReviews
      tags: [cards]
      summary: Review history of a card (its whole replay set plus drills and crams).
      description: |
        Rows of `review_log` whose `card_id` is this card or any card merged into it, every
        `review_type`, newest first by `(reviewed_at, hlc, id)` descending - the reverse of the
        replay order (SYNC.md 9.1), so a late or re-minted review (SYNC.md 10.4) sits where it was
        answered, not where it was logged. Undone rows are included
        (`undone_at` set) so the history is complete. A merge loser's id resolves to the
        survivor. Works for deleted cards (history is never deleted).
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of review log rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewPage'}
              examples: {default: {$ref: '#/components/examples/ReviewPage'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- review
  /review/queue:
    get:
      operationId: getReviewQueue
      tags: [review]
      summary: The next cards to review, built by the shared core's queue builder.
      description: |
        For online clients (web, scripts). The server runs the same queue builder the phone runs
        locally, at request time, over the server's replica: daily limits (global and per deck),
        deck priority order, sibling burying, interleaving and the per-session new-card cap all
        come from the core. The response is a prefix of today's queue: the first `limit` cards
        in the order they should be shown. It is **not** a reservation: fetch again after
        answering (each answer can change what comes next - learning steps, sibling burying).
        Suspended, buried, deleted and merged-away cards never appear. Empty `items` with all
        counts zero means done for the study day.

        Each item carries everything needed to render and grade the card: the card with its note
        summary, the dictionary entry (when the note references one that exists), the example
        sentence chosen for rotating-example cards, the `review_type` an answer will be logged
        with, and a preview of the next due time per rating. Grammar cards also carry
        `grammar_sentence` (C-15): the rotated example sentence and span, chosen by the core
        picker with the rules on `GrammarCardSentence` (drill sessions use the same rules).
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: limit
          in: query
          description: Maximum number of cards to return.
          schema: {type: integer, minimum: 1, maximum: 200, default: 20}
          example: 20
        - name: deck_id
          in: query
          description: Restrict new cards to this deck and reviews to cards whose note or entry is an item of it. Must be a live deck (`404` otherwise).
          schema: {$ref: '#/components/schemas/Uuid'}
          example: 01931f40-2000-7000-8000-000000000d01
        - name: kinds
          in: query
          description: Which queue sections to include, comma-separated. Default all three.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: {type: string, enum: [new, learning, review]}
            default: [new, learning, review]
          example: [learning, review]
      responses:
        '200':
          description: The queue prefix and today's remaining counts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewQueue'}
              examples: {default: {$ref: '#/components/examples/ReviewQueue'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /review/answer:
    post:
      operationId: answerReview
      tags: [review]
      summary: Grade a card.
      description: |
        Server emits `review.logged` and recomputes the card's schedule cache with the shared
        core. `mode` decides the review type:

        - `schedule` (default): `review_type` = `learning` if the card's state is `new`,
          `learning` or `relearning` at apply time, else `scheduled`. Feeds FSRS. Reviewing a
          card that is not due yet is allowed (FSRS accounts for the short interval).
        - `drill`, `cram`: logged with that `review_type`; the schedule does not change.

        Rules:
        - `rating` is the FSRS rating 1-4. `button`, when sent, must map to `rating`
          (`again`, `nothing`, `something` → 1; `hard` → 2; `good`, `okay` → 3; `easy` → 4);
          otherwise `422`. Clients in five-button mode MUST send `button`.
        - `reviewed_at` defaults to the server's now. Past values are accepted (late
          submission) within these bounds, each `422 validation_failed` with
          `errors[0].pointer = /reviewed_at`:
          - more than 5 minutes after the server's now (`code = in_future`);
          - before `FLOOR` = 2020-01-01T00:00:00Z (`code = before_floor`);
          - before `min(card.created_at, now) − 24 h` (`code = before_card`), where `card` is the
            card the review is logged on (the survivor, for a merge loser's id) and `created_at`
            is `wall(hlc)` of the `card.created` op that inserted the row (SYNC.md 7.2, 7.5).
          The op the server mints is exempt from the push-time clock checks (SYNC.md 3.4), so
          these are the only bounds a REST review gets; they reproduce the device guards
          (G1, and G2's implied `reviewed_at >= card.created_at − 24 h`) and the lower bound
          Re-mint uses (SYNC.md 10.4 step 4). The `min` with now keeps a card created by a
          device up to 24 h ahead reviewable at once. The bound uses the replicated
          `created_at`, which comes from the creating device's clock; SYNC.md 3.4 records
          that a pushed review is not checked against it (known issue) - this REST check does
          not change that.
        - `utc_offset_min` SHOULD be sent by browsers (`-new Date().getTimezoneOffset()`); when
          absent it is stored as NULL.
        - `duration_ms` above 600000 is clamped to 600000.
        - `id` is **required**: the client-generated UUIDv7 `review_log.id`, minted once when the
          answer is given and reused unchanged on every retry. Re-sending an existing `id` returns
          the stored review and the card's current state with `200` and emits nothing - whatever
          the rest of the body. This is what makes a retry after a lost response or a `5xx` safe
          (no second `review.logged`, no double FSRS update). An `id` that exists as a review of a
          different card is still answered with the stored review (the body is ignored).
        - Card suspended and `mode = schedule`: `409 card_not_reviewable`. Buried cards may be
          answered. Deleted card or note: `410 gone`. A merge loser's id is answered against the
          survivor (`review.card_id` in the response is the survivor's id).
      x-emits-ops: [review.logged]
      security:
        - bearerAuth: [review]
        - sessionCookie: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewAnswerRequest'}
            examples:
              good:
                summary: Good, four-button mode
                value:
                  id: 01931f41-0000-7000-8000-000000000f01
                  card_id: 01931f40-1a2b-7c3d-8e4f-000000000c01
                  rating: 3
                  button: good
                  duration_ms: 4200
                  utc_offset_min: 540
              something:
                summary: '"Something" in five-button mode'
                value: {id: 01931f41-0000-7000-8000-000000000f02, card_id: 01931f40-1a2b-7c3d-8e4f-000000000c01, rating: 1, button: something, duration_ms: 9100, utc_offset_min: 540}
              drill:
                summary: Drill answer (schedule untouched)
                value: {id: 01931f41-0000-7000-8000-000000000f03, card_id: 01931f40-1a2b-7c3d-8e4f-000000000c01, rating: 3, mode: drill}
      responses:
        '200':
          description: The logged review and the card after it.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewResult'}
              examples: {default: {$ref: '#/components/examples/ReviewResult'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /review/undo:
    post:
      operationId: undoReview
      tags: [review]
      summary: Undo a review.
      description: |
        Server emits `review.undone` for the review named by `review_id` and recomputes the card.

        - `review_id` is **required** (any review, whichever device logged it, `manual` rows
          included). There is no implicit "undo my last review": that would not be idempotent
          (a retry after a lost response would undo the review before it). The web app keeps the
          `id` it sent to `POST /review/answer` and passes it here.
        - Target already undone: `200` with the current state, no op (an undo cannot be undone).
          Hence retries are safe.
        - Unknown `review_id`: `404 not_found`.
      x-emits-ops: [review.undone]
      security:
        - bearerAuth: [review]
        - sessionCookie: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewUndoRequest'}
            examples:
              explicit: {summary: Undo a specific review, value: {review_id: 01931f41-0000-7000-8000-000000000f01}}
      responses:
        '200':
          description: The undone review and the card after recomputation.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewResult'}
              examples: {default: {$ref: '#/components/examples/ReviewResultUndone'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /drill/session:
    post:
      operationId: createDrillSession
      tags: [review]
      summary: Build an extra-practice session that does not touch scheduling.
      description: |
        Returns an ordered list of cards to drill. Nothing is stored and no op is emitted: the
        session exists only in the response (`id` is a fresh UUIDv7 for client-side bookkeeping).
        The client shows the items and posts each answer to `POST /review/answer` with
        `mode` = the session's `mode` (`drill` or `cram`).

        `source` selects the cards:
        - `hot_words`: live cards of the current hot words, hottest first.
        - `leeches`: live cards with `lapses >= scheduler.leech_threshold`, most lapses first.
        - `confusables`: cards of confirmed confusable pairs, partners adjacent. With
          `entry_seq`, only pairs involving that entry's note.
        - `query`: cards matching `query` (card search string; required), in `-lapses` order.
        - `cards`: exactly `card_ids` (required, 1 to 500), in the given order; unknown, deleted
          and merged-away ids are dropped silently.
        Suspended cards are included (drilling a suspended leech is the point); deleted ones
        never. An empty `items` list is a normal `200`.
      x-emits-ops: []
      security:
        - bearerAuth: [review]
        - sessionCookie: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DrillSessionRequest'}
            examples:
              hot: {summary: Drill hot words, value: {source: hot_words, limit: 20}}
              pair: {summary: Drill confusables of one word, value: {source: confusables, entry_seq: 1358280}}
              cram: {summary: Cram a deck, value: {source: query, query: 'deck:"Frieren"', mode: cram, limit: 50}}
      responses:
        '200':
          description: The drill session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrillSession'}
              examples: {default: {$ref: '#/components/examples/DrillSession'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- decks
  /deck-lists:
    get:
      operationId: listDeckLists
      tags: [decks]
      summary: Generated lists (JLPT, frequency bands) that can be enabled as `list` decks.
      description: |
        The catalogue is computed by the server from the current dictionary release: `jlpt-n5` ...
        `jlpt-n1` and, per loaded frequency list, `freq-<list id>-<N>` for N in 1000, 2000, 5000,
        10000, 20000. `deck_id` is set when a live deck for the key exists. Not paginated;
        ordered by `list_key`. Empty when no dictionary release is loaded.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: Available lists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeckListCatalogue'}
              examples: {default: {$ref: '#/components/examples/DeckListCatalogue'}}
        default: {$ref: '#/components/responses/Problem'}
  /decks:
    get:
      operationId: listDecks
      tags: [decks]
      summary: List decks.
      description: Not paginated. Ordered by `(priority, id)` ascending - the order new cards are drawn in.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: type
          in: query
          description: Only decks of this type.
          schema: {$ref: '#/components/schemas/DeckType'}
          example: media
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: Decks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeckList'}
              examples: {default: {$ref: '#/components/examples/DeckList'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createDeck
      tags: [decks]
      summary: Create a user or smart deck, or enable a generated list.
      description: |
        Server emits `deck.created` (origin: server device, which is what makes `list` decks
        legal here).

        - `type: user` - `name` required. Starts empty.
        - `type: smart` - `name` and `query` required; `query` must parse (`422 invalid_query`).
        - `type: list` - `list_key` required and must be in `GET /deck-lists` (`422` otherwise);
          `name` defaults to the catalogue title. Under the op-apply lock: if a live deck with
          that `list_key` exists it is returned with `200` and nothing is emitted (a sent `id`
          is then ignored). Otherwise the deck is created and a job of kind `deck-build` is
          queued that builds the item snapshot and makes the server emit
          `deck.content_published`; until then the deck has `content_version = 0` and no items.
        - `type: media` is `422`: media decks are created only by import jobs.

        Properties that do not belong to the type (`query` on a user deck, ...) are `422`.
      x-emits-ops: [deck.created]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeckCreate'}
            examples:
              user: {summary: Hand-built deck, value: {id: 01931f40-2000-7000-8000-000000000d02, type: user, name: Inbox, priority: 10}}
              smart: {summary: Saved search, value: {type: smart, name: Leeches, query: 'tag:leech'}}
              list: {summary: Enable JLPT N3, value: {type: list, list_key: jlpt-n3, new_cards_per_day: 5}}
      responses:
        '200':
          description: The deck already existed (same `id`, or same `list_key`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deck'}
              examples: {default: {$ref: '#/components/examples/Deck'}}
        '201':
          description: Created.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deck'}
              examples: {default: {$ref: '#/components/examples/Deck'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /decks/{deck_id}:
    parameters:
      - {$ref: '#/components/parameters/DeckId'}
    get:
      operationId: getDeck
      tags: [decks]
      summary: One deck.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: The deck.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deck'}
              examples: {default: {$ref: '#/components/examples/Deck'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateDeck
      tags: [decks]
      summary: Rename, reprioritise, enable/disable, set limits or settings.
      description: |
        Server emits one `deck.updated` with the registers present: `name`, `priority`,
        `enabled`, `new_cards_per_day`, `reviews_per_day`, `query` (smart decks only, must
        parse), and one `settings.<key>` per key of `settings` (partial map; a `null` value
        removes the key). Works for every deck type. `type`, `media_id`, `list_key` are
        immutable (`422`). An empty body is `422`.
      x-emits-ops: [deck.updated]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeckPatch'}
            examples:
              priority: {value: {priority: 0, new_cards_per_day: 10}}
              settings: {value: {settings: {order: global_frequency, add_kanji: before}}}
              disable: {value: {enabled: false}}
      responses:
        '200':
          description: The updated deck.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Deck'}
              examples: {default: {$ref: '#/components/examples/Deck'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteDeck
      tags: [decks]
      summary: Delete a user, smart or list deck. Notes and cards are untouched.
      description: |
        Server emits `deck.deleted`. A `media` deck is `409 deck_read_only`: delete the media
        (`DELETE /media/{media_id}`), which tombstones its deck. A deleted `list` deck can be
        enabled again later (a new deck with a new id). Already deleted: `204`, no op.
      x-emits-ops: [deck.deleted]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Deleted.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /decks/{deck_id}/items:
    parameters:
      - {$ref: '#/components/parameters/DeckId'}
    get:
      operationId: listDeckItems
      tags: [decks]
      summary: Items of a deck with dictionary summary and word status.
      description: |
        Live items only. For a media deck this is the media's vocabulary list: `status=new` with
        `sort=occurrence_count` gives "unknown words by in-deck frequency, global rank beside
        them". An item whose `note_id` is a merge loser is reported with the survivor's id.
        Items whose entry is missing from the dictionary have `entry: null`. Smart decks have no
        items: `409 not_applicable` (use `GET /cards?query=`). Deleted deck: `410 gone`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: status
          in: query
          description: Only items whose effective word status is one of these (comma-separated). Items without an `entry_seq` have no status and match only when this parameter is absent.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/WordStatusValue'}
          example: [new, learning]
        - name: sort
          in: query
          description: '`position` = the deck''s new-card order (ties by `item_key`); `occurrence_count` = most frequent in this deck first; `freq_rank` = globally most frequent first (NULLs last). Ties by `item_key`.'
          schema: {type: string, enum: [position, occurrence_count, freq_rank], default: position}
          example: occurrence_count
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of deck items.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeckItemPage'}
              examples: {default: {$ref: '#/components/examples/DeckItemPage'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: addDeckItems
      tags: [decks]
      summary: Add several items to a user deck.
      description: |
        Server emits one `deck.item_put` per element, in array order, in one transaction.
        Each element names exactly one of `entry_seq` or `note_id`. A `note_id` whose note has
        an `entry_seq` is stored in entry form (`e:<seq>`); a merge loser's id is resolved to the
        survivor first. Elements without `position` are appended after the current maximum,
        1024 apart, in array order. An element already present (live or removed) is put again
        (the put clears a removal and moves it). Duplicates inside the array: the last wins.
        1 to 1000 elements. Not a `user` deck: `409 deck_read_only`. Unknown entry or note: `422`
        naming the element; nothing is applied.
      x-emits-ops: [deck.item_put]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeckItemsAdd'}
            examples:
              default: {value: {items: [{entry_seq: 1358280}, {entry_seq: 1002430, position: 2048}, {note_id: 01931f40-1a2b-7c3d-8e4f-000000000a02}]}}
      responses:
        '200':
          description: The items as stored, in request order (after de-duplication).
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeckItemList'}
              examples: {default: {$ref: '#/components/examples/DeckItemList'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /decks/{deck_id}/items/{item_key}:
    parameters:
      - {$ref: '#/components/parameters/DeckId'}
      - name: item_key
        in: path
        required: true
        description: '`e:<entry_seq>` or `n:<note uuid, lowercase>`. The colon need not be percent-encoded.'
        schema: {type: string, pattern: '^(e:[1-9][0-9]*|n:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'}
        example: e:1358280
    put:
      operationId: putDeckItem
      tags: [decks]
      summary: Add one item to a user deck, or move it.
      description: |
        Server emits `deck.item_put`. Without a body, or without `position`: a new item is
        appended (maximum position + 1024); an existing live item keeps its position.
        An `n:<id>` key whose note has an `entry_seq` is `422` (use the `e:` form); the note or
        entry must exist. Not a `user` deck: `409 deck_read_only`.
      x-emits-ops: [deck.item_put]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeckItemPut'}
            examples:
              append: {summary: Append, value: {}}
              move: {summary: Move to a position, value: {position: 512}}
      responses:
        '200':
          description: The item as stored.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeckItem'}
              examples: {default: {$ref: '#/components/examples/DeckItem'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeDeckItem
      tags: [decks]
      summary: Remove one item from a user deck (reversible by putting it again).
      description: |
        Server emits `deck.item_removed`. Item absent or already removed: `204`, no op.
        Not a `user` deck: `409 deck_read_only`.
      x-emits-ops: [deck.item_removed]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Removed.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /decks/{deck_id}/coverage:
    parameters:
      - {$ref: '#/components/parameters/DeckId'}
    get:
      operationId: getDeckCoverage
      tags: [decks]
      summary: Coverage of a deck's items by your word statuses.
      description: |
        Computed at request time from live `deck_item` rows that have an `entry_seq` and
        `word_status`. For `media` decks the result equals `GET /media/{id}/coverage` without
        `segment_id` (including `segments`, `curve` and token numbers). For `user` and `list`
        decks token numbers count each item once (`occurrence_count` is 0, treated as 1),
        `segments` is empty and `difficulty` is null. Smart decks: `409 not_applicable`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/CoverageHide'}
      responses:
        '200':
          description: Coverage numbers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Coverage'}
              examples: {default: {$ref: '#/components/examples/Coverage'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- media
  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: List the media library.
      description: Ordered by `created_at` descending, then `id` descending.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: kind
          in: query
          description: Only media of this kind.
          schema: {$ref: '#/components/schemas/MediaKind'}
          example: anime
        - name: q
          in: query
          description: Case-insensitive substring of the title.
          schema: {type: string, minLength: 1, maxLength: 200}
          example: フリーレン
        - {$ref: '#/components/parameters/IncludeDeleted'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of media.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaPage'}
              examples: {default: {$ref: '#/components/examples/MediaPage'}}
        default: {$ref: '#/components/responses/Problem'}
  /media/import:
    post:
      operationId: importMedia
      tags: [media]
      summary: Import your own file(s), a URL or pasted text as media (worker job).
      description: |
        Enqueues a job of kind `media-import` and returns it with `202`. Files are uploaded first
        with `PUT /blobs/{hash}` (kind `upload`) and referenced by hash; there is no multipart
        variant.

        - `source: file` - `files` required (1 to 500). Each file becomes one segment in array
          order (an EPUB becomes one segment per chapter, in book order). Every `blob_hash` must
          exist (`422` naming the element otherwise).
        - `source: url` - `url` required (http/https); fetched by the worker with readability
          extraction; one segment.
        - `source: paste` - `text` required (1 to 1,000,000 characters); one segment.
        - New media: `title` and `kind` required. The server pre-allocates `media_id` (returned
          in `job.payload.media_id`); the job creates the `media` row, its deck (`deck.id` =
          `media_id`) and all content, emitting as server ops `media.created`, `deck.created`,
          `media.content_published`, `deck.content_published`. `GET /media/{media_id}` is `404`
          until the job has created the row.
        - Existing media: pass `media_id` (must be live, with `source` equal to this request's);
          the new segments are appended after the existing ones and a new content version is
          published. `title`/`kind`/`deck` must then be absent.
        - Dedupe key `media-import:<media_id>`: a second import into the same media while one is
          queued or running is `409 already_exists` (`existing_id` = the job id).
        - **Idempotent retry: `import_id`.** Optional client-generated UUIDv7, minted once per
          user action and reused on every retry; it becomes the job's `id`, and for new media
          also the new `media_id` (and so the deck id). If a job with this id already exists
          (any status), or - for new media - a `media` row with this id exists (live or deleted),
          the server enqueues nothing and answers `200` with that job (or, if the job row is
          gone, the most recent `media-import` job for that media; `404` if none), whatever the
          rest of the body says. Without `import_id` a retry after a lost `202` imports twice
          (a second media and deck); clients that may retry MUST send it. An `import_id` used by
          a job of another kind is `409 already_exists` (`existing_id` = that job).
        - **Execution (C-11).** The worker builds snapshot archives and hands them to the server
          through the internal `media-publish` job; the server creates the rows and mints the
          ops in one transaction (`contracts/db/MEDIA_PIPELINE.md` 3). A failed or cancelled
          first import leaves no media.
        - **`parse_status` (C-11).** Appending to an existing media emits, with the job insert,
          `media.content_published` with `parse_status = parsing` (same version and hash) unless
          the media is already `parsing` (MEDIA_PIPELINE.md 4). New media: no op in the request.
      x-emits-ops: [media.content_published]
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaImportRequest'}
            examples:
              subtitles:
                summary: Two subtitle files
                value:
                  title: 葬送のフリーレン
                  kind: anime
                  source: file
                  files:
                    - {blob_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, filename: ep01.srt, title: 第1話}
                    - {blob_hash: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae, filename: ep02.srt, title: 第2話}
                  deck: {priority: 5, new_cards_per_day: 10}
              url: {summary: A web article, value: {import_id: 01931f43-0000-7000-8000-000000000e02, title: NHK記事, kind: web, source: url, url: 'https://www3.nhk.or.jp/news/easy/example.html'}}
              append: {summary: Add an episode to existing media, value: {media_id: 01931f40-3000-7000-8000-000000000e01, source: file, files: [{blob_hash: fcde2b2edba56bf408601fb721fe9b5c338d10ee429ea04fae5511b68fbf8fb9, filename: ep03.srt}]}}
      responses:
        '200':
          description: Retry with a known `import_id` - the existing job; nothing was enqueued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobMediaImport'}}
        '202':
          description: Import job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobMediaImport'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AlreadyExists'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /media/import/jpdb:
    post:
      operationId: importJpdbDeck
      tags: [media]
      summary: Import a pre-parsed jpdb media deck (vocabulary with occurrence counts).
      description: |
        Enqueues a job of kind `jpdb-deck-import` (dedupe key `jpdb-deck-import:<jpdb_id>`) and
        returns it with `202`. If a live media with this `jpdb_id` exists the job updates it
        (same `media_id`, new content version); otherwise `media_id` is pre-allocated as in
        `POST /media/import`. The job emits, as server ops, `media.created` and `deck.created`
        (first import only), `media.content_published`, `deck.content_published`. The result has
        one segment of kind `whole` and no sentences. Vocabulary that maps to no JMdict entry is
        listed in the job result (`unmapped`), never silently dropped.
        An equivalent queued or running job is returned with `200`.

        **C-11.** Execution through the internal `media-publish` job as for `importMedia`
        (`contracts/db/MEDIA_PIPELINE.md` 3). For a known `jpdb_id` the request emits
        `media.content_published` (`parse_status = parsing`) with the job insert, unless the
        media is already `parsing` (MEDIA_PIPELINE.md 4). Stored mapping corrections
        (`putJpdbVocabResolution`) are applied before automatic mapping; vocabulary the automatic
        mapper cannot map enters the review queue (`listJpdbVocab`; MEDIA_PIPELINE.md 5).
        `remap_only` is server-set (mapping-correction re-publish jobs); clients must not send it
        (`422`).
      x-emits-ops: [media.content_published]
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JpdbDeckImportRequest'}
            examples:
              default: {value: {jpdb_id: anime/5370, kind: anime, deck: {priority: 5}}}
      responses:
        '200':
          description: An equivalent job is already queued or running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobJpdbDeck'}}
        '202':
          description: Import job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobJpdbDeck'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /import/jpdb/history:
    post:
      operationId: importJpdbHistory
      tags: [media]
      summary: Import jpdb review history and word statuses from a jpdb export file.
      description: |
        Upload the export JSON with `PUT /blobs/{hash}` (kind `upload`), then call this.
        Enqueues a job of kind `jpdb-history-import` (dedupe key `jpdb-history-import`). The job
        emits, as server ops: `note.created` and `card.created` for vocabulary and kanji without
        a note or card, `review.logged` for every historical review (`import_source = jpdb`,
        deterministic review ids, see "Review ids", so that re-running imports nothing twice),
        and `word.status_set` (payload `origin = jpdb_import`, stored as `override_origin`) for
        known-only words. The observed export carries no never-forget or blacklist data, so
        none is written. Records that cannot be mapped are counted and listed in the job result.
        An equivalent queued or running job is returned with `200`. Mapping rules follow
        ADR-008 and ADR-009 (C-4).

        **Export arrays (C-2, C-4; spikes/jpdb-map/REPORT.md "Export structure").** The export
        is one object whose array members are read as follows; any other member (top level, row
        or event) is ignored, a missing or non-array member counts as empty, and `from_anki` is
        accepted with any value (`true` included) and ignored.
        | Array | Row | Becomes |
        |---|---|---|
        | `cards_vocabulary_jp_en` | `vid`, `spelling`, `reading`, `reviews[]` | vocab note (built-in Vocab type `00000000-0000-7000-8000-000000000101`, `entry_seq` = the mapped JMdict seq, `origin = jpdb_import`) with exactly one card, kind `meaning` (JP → EN) |
        | `cards_vocabulary_en_jp` | same | nothing: counted `vocabulary_en_jp_ignored`, its events `reviews_skipped`; no note, card, status or review (ADR-009(1): no production cards) |
        | `cards_kanji_char_keyword` | `character`, `reviews[]`, optional `keyword` | kanji note, card kind `keyword` (kanji → keyword) |
        | `cards_kanji_keyword_char` | `character`, `reviews[]`, optional `keyword` | kanji note, card kind `writing` (keyword → kanji), created **suspended** |

        Tolerated drift: a row whose `reviews` is missing or not an array has zero events; a
        vocab row with a missing or non-integer `vid` is mapped by text only and, if unmapped,
        listed with `jpdb_vid = 0`; a missing `spelling` / `reading` reads as `""`. An element of
        `reviews[]` that is not an object with an integer `timestamp` and a string `grade` is
        *malformed* (counted `reviews_unknown_grade`).

        **Vocab rows and groups.** Each `cards_vocabulary_jp_en` row is mapped to a JMdict seq
        (vid lookup first; spikes/jpdb-map/REPORT.md "Mapping") or listed under `unmapped`.
        Mapped rows are grouped by seq: rows sharing a seq (about 260 vids repeat in 2-3 rows
        with different spellings; two vids mapping to one seq are also one group) form **one
        group** = one note and one `meaning` card, whose history is the union of the rows'
        events in ascending `timestamp` order (ties: array order, row order, element order).
        Within a group, an event with the same `timestamp` and `grade` as an earlier one is an
        **exact duplicate**: dropped and counted `reviews_duplicate_dropped` (malformed events
        are never duplicates). The group's kept, well-formed events decide its fate:
        - all of them are `known` and there is at least one: **status-only** (ADR-009(3)). No
          note or card. If `import_word_status`, one `word.status_set` status `known`, `origin =
          jpdb_import` for the seq, unless the word already has a live override (any status,
          any origin; then nothing is written, so a re-run never overwrites the user's choice).
          Every row of the group counts `vocabulary_status_only`.
        - otherwise (at least one non-`known` event, or no well-formed events at all):
          **carded**. Every row counts `vocabulary_carded`. The group maps to the live note with
          that `entry_seq` if one exists (`notes_existing`, once per seq), else `note.created`
          (`notes_created`). The job then ensures a live card of kind `meaning` on it
          (`card.created`, `cards_created`, only if none exists) - only that kind, never the
          Vocab type's other default kinds (`reading`, `production`); existing cards of other
          kinds are left alone and get no history. A `known` event of a carded group writes
          nothing (FSRS schedules from the reviews; no override).
        So `notes_created + notes_existing` = distinct seqs of carded groups, and `cards_created
        <= notes_created + notes_existing` (about equal to `notes_created`).

        **Kanji rows and groups.** A row whose `character` is exactly one Unicode code point is
        mapped; any other is listed under `kanji_unmapped`. Mapped rows are grouped by
        (`character`, card kind); a group's events are merged and de-duplicated exactly as for
        vocab. The character maps to the live note with that `kanji_literal` if one exists
        (counted `kanji_notes_existing`, once per character), else to a new note:
        `note.created` with `note_type_id` = the built-in Kanji type
        (`00000000-0000-7000-8000-000000000102`, base type `kanji`), `kanji_literal` =
        `character`, `fields` = `{"literal": character}` plus `"keyword": <text>` when a row of
        that character carries a `keyword` member that is a non-empty string after trimming
        (ADR-009(4); the first such row in array order `cards_kanji_char_keyword`,
        `cards_kanji_keyword_char`, then row order; the observed export has no `keyword` member,
        so it is normally absent and the renderer fills it from `ref.kanji`; user-editable
        either way). `readings` and `notes` are never written. An existing note's fields are
        never changed. `origin = jpdb_import`. Both arrays naming the same character share one
        note. The job then ensures a live card of the group's kind (`keyword` or `writing`) -
        only that kind, never the note type's other default kinds. A card is created **with
        `suspended = true` in its `card.created` payload** (no separate `card.suspended` op;
        counted `kanji_cards_suspended`) when its kind is `writing` (ADR-009(1): preserved with
        its history, never shown unless the user unsuspends it) or when the group is
        known-only (all kept well-formed events `known`, at least one; ADR-009(3)). A card that
        already exists keeps its `suspended` state (a re-run never re-suspends a card the user
        unsuspended). Every mapped kanji row counts `kanji_carded`, known-only ones included
        (kanji have no word status). A character missing from `ref.kanji` is still imported.

        **Grades** (each kept, well-formed event of a carded vocab group or a kanji group;
        `timestamp` is Unix seconds UTC → `reviewed_at` = timestamp × 1000, `utc_offset_min =
        null`, `duration_ms = null`, `review_type = scheduled`, `import_source = jpdb`; grades
        match exactly, case-sensitive):
        | `grade` | Effect |
        |---|---|
        | `nothing` | `review.logged` rating 1, button `nothing` |
        | `something` | rating 1, button `something` |
        | `hard` | rating 2, button `hard` (FSRS Hard; ADR-008) |
        | `okay` | rating 3, button `okay` |
        | `easy` | rating 4, button `easy` |
        | `pass` | rating 3, button `null` |
        | `fail` | rating 1, button `null` |
        | `unknown` | no review; the card's creation is all it means. Counted `status_events_unknown` |
        | `known` | no review. Status-only vocab group: the word status above. Carded vocab group or any kanji group: nothing (a known-only kanji card is created suspended). Counted `status_events_known` |
        | anything else | nothing; counted `reviews_unknown_grade` |

        **Review ids.** Each rating event gets `id` = a UUIDv7 whose 48-bit timestamp is
        `reviewed_at` and whose other bits come from `h = SHA-256(UTF-8(name))`, `name =
        "jpdb-review/v1|" + key + "|" + timestamp + "|" + grade + "|" + occ`: `key` is `"v" +
        vid` (decimal, the event's own row's vid; `"v0"` if absent) for vocab, `"k:keyword:" +
        character` or `"k:writing:" + character` for kanji; `timestamp` is the export's decimal
        seconds; `occ` is the 0-based index of the event among the group's kept events with the
        same `timestamp`, in group order. Bytes: `b[0..5]` = `reviewed_at` big-endian, `b[6] =
        0x70 | (h[0] & 0x0F)`, `b[7] = h[1]`, `b[8] = 0x80 | (h[2] & 0x3F)`, `b[9..15] =
        h[3..9]`. A rating event whose id already exists in `review_log` (any state, undone
        included) is not emitted again (`reviews_already_imported`). Rating ops of one card are
        emitted in group order, after the card's `card.created` (if any).

        **`import_reviews = false`**: nothing but word statuses is written. Rows are bucketed by
        the same rules (`*_carded` then means "would get a note and card"); `notes_created`,
        `notes_existing`, `cards_created`, `kanji_notes_*`, `kanji_cards_*` are 0; rating
        events count as `reviews_skipped`; status, duplicate and unknown-grade events as usual.
        **`import_word_status = false`**: no `word.status_set`; bucketing is unchanged.

        **Counting.** Every input record - each row of the four arrays and each element of its
        `reviews[]` - is counted in exactly one bucket of `JobResultJpdbHistory` (its description
        gives the three sums that must hold and the order in which an event's bucket is
        decided).

        **Review id collisions (C-9).** The id formula can give two rating events of different
        cards the same id: one `vid` in two rows mapped by text to two different seqs (or two
        rows without a `vid`, both keyed `"v0"`), with equal `timestamp`, `grade` and `occ`.
        Only one review can hold an id. The event that finds its id already held by a review
        of a *different live card* (in `review_log`, or emitted earlier in this run; vocab
        groups are applied in order of their first row in the export, kanji groups after
        them; the holder's card is resolved through `merged_into_id` first) is not emitted,
        is counted `reviews_already_imported` (bucket 8), and is also counted
        `reviews_id_collisions`. A holder whose card or note is deleted is not a collision (the event is
        simply already imported). On a re-run the original holder keeps the id, so the count
        is stable. Expected 0 on real exports.

        **Execution (C-9).** The job runs in two halves joined by the server-internal job kind
        `jpdb-history-apply` (rules for internal jobs: `Job`). Only the parent
        (`jpdb-history-import`) is ever visible in the API.
        1. The worker claims the parent, reads the blob and plans (mapping, groups, buckets,
           review ids; nothing written). It reports parent `progress` in [0, 0.2].
        2. If a `jpdb-history-apply` row with `payload.parent_job_id` = the parent's id has
           already `succeeded` (an earlier attempt of this parent got that far), the worker
           ends the parent `succeeded` with that row's `result` and stops. Otherwise it
           inserts the child in one statement: `id` = new UUIDv7, `kind =
           'jpdb-history-apply'`, `payload = {"parent_job_id": "<parent id>", "plan": <plan>}`
           (`plan` = the worker's `ImportPlan.to_json()`, version 1, defined in
           `worker/.../jpdb_history/plan.py`; an internal format shared only by worker and
           server, which must reject an unknown `version` by failing the child), `dedupe_key
           = 'jpdb-history-apply:<parent id>'`, `max_attempts = 1`, `ON CONFLICT DO
           NOTHING`; then it reads the queued or running row holding that dedupe key (a child
           left by an earlier attempt of the parent is reused, not duplicated).
        3. The server's runner (the only claimer of the kind) claims the child with `SKIP
           LOCKED`. Before the first batch and between batches it checks that the parent is
           still `running`; if not, it stops and ends the child `cancelled`. It applies the
           plan through OpApply as server ops (idempotent: a re-run writes only what is
           missing), heartbeats the child, and writes the parent's `progress` (in [0.2,
           0.99)) and `progress_message` with `WHERE status = 'running'`, sending the
           parent's `job.updated`. It ends the child `succeeded` with the full
           `JobResultJpdbHistory` as `result`, `failed` with `error`, or `cancelled`; in
           every case it removes `plan` from the child's payload.
        4. The worker waits for the child (polling, heartbeating the parent, honouring parent
           cancellation) and ends the parent: child `succeeded` → parent `succeeded`, `result`
           = the child's `result`, `progress = 1`; child `failed` → the parent attempt fails
           with the child's `error` (retried per `max_attempts`; a retry plans again and makes
           a new child); child `cancelled` → the parent is already `cancelled`, nothing to do.
        A child that is `running` with a `heartbeat_at` older than 5 minutes (server restart)
        is re-queued by the server runner whatever its `attempts`. A parent whose worker died
        is re-queued by the usual stale rule and, at step 2, reuses the child. The parent's
        `result` is null until it ends (partial counts are not reported on cancel).
      x-emits-ops: []
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JpdbHistoryImportRequest'}
            examples:
              default: {value: {blob_hash: 4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a}}
      responses:
        '200':
          description: An import is already queued or running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobJpdbHistory'}}
        '202':
          description: Import job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobJpdbHistory'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /import/jpdb/vocab:
    get:
      operationId: listJpdbVocab
      tags: [media]
      summary: The jpdb mapping review queue - jpdb vocabulary that did not map to a JMdict entry.
      description: |
        Lists `app.jpdb_vocab` rows (C-11, `contracts/db/MEDIA_PIPELINE.md` 5): jpdb vocabulary
        that a jpdb deck import could not map automatically, with the user's resolution.
        Ordered by `occurrence_total` descending, then `jpdb_vid` ascending (keyset cursor over
        that order; totals change when decks are re-imported, so a page boundary may skip or
        repeat a row).
        - `status=unresolved` (default) is the review queue: only rows with at least one live
          media (`occurrence_total > 0`).
        - `status=mapped` / `ignored` / `all` also list rows whose media were all deleted
          (`occurrence_total = 0`, `media = []`), so a correction can still be cleared.
        Resolve one with `putJpdbVocabResolution`; candidates come from `searchDictionary`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: status
          in: query
          description: Which rows. Default `unresolved`.
          schema:
            type: string
            enum: [unresolved, mapped, ignored, all]
            default: unresolved
          example: unresolved
        - name: media_id
          in: query
          description: Only vocabulary occurring in this (live) media.
          schema: {$ref: '#/components/schemas/Uuid'}
          example: 0193a1b2-0008-7000-8000-000000000001
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of jpdb vocabulary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JpdbVocabPage'}
              examples: {default: {$ref: '#/components/examples/JpdbVocabPage'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /import/jpdb/vocab/{jpdb_vid}/resolution:
    parameters:
      - name: jpdb_vid
        in: path
        required: true
        description: jpdb vocabulary id (a row of the review queue).
        schema: {type: integer, format: int64, minimum: 1}
        example: 9300003
    put:
      operationId: putJpdbVocabResolution
      tags: [media]
      summary: Map a jpdb vocabulary item to a JMdict entry, or ignore it.
      description: |
        Stores the correction (server-only import configuration, not an op; C-11,
        `contracts/db/MEDIA_PIPELINE.md` 5.4) and re-publishes every live jpdb media that
        contains the vid from the importer's cache: per media one `jpdb-deck-import` job with
        `remap_only: true` (dedupe key `jpdb-deck-remap:<media_id>`; a remap already waiting for
        that media is reused and listed instead). For each job actually enqueued the server
        emits `media.content_published` (`parse_status = parsing`) unless the media is already
        `parsing`.
        - `resolution: mapped` requires `entry_seq`, a non-retired dictionary entry (`422`,
          pointer `/entry_seq`, otherwise); `ignored` must not carry `entry_seq` (`422`).
        - Unknown vid (never seen unmapped) - `404`.
        - Same resolution as stored - `200` with `jobs: []`, nothing written.
        Corrections persist across re-imports and apply to every jpdb deck containing the vid.
      x-emits-ops: [media.content_published]
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JpdbVocabResolutionPut'}
            examples:
              mapped: {value: {resolution: mapped, entry_seq: 1612400}}
              ignored: {value: {resolution: ignored}}
      responses:
        '200':
          description: The row as stored and the re-publish jobs.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JpdbVocabResolutionResult'}
              examples: {default: {$ref: '#/components/examples/JpdbVocabResolutionResult'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: clearJpdbVocabResolution
      tags: [media]
      summary: Clear a correction - the vocabulary item goes back to the review queue.
      description: |
        Sets the row back to `unresolved` and re-publishes affected media exactly like
        `putJpdbVocabResolution` (C-11). Already unresolved - `200` with `jobs: []`. Unknown
        vid - `404`.
      x-emits-ops: [media.content_published]
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      responses:
        '200':
          description: The row as stored and the re-publish jobs.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JpdbVocabResolutionResult'}
              examples: {default: {$ref: '#/components/examples/JpdbVocabResolutionCleared'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /media/{media_id}:
    parameters:
      - {$ref: '#/components/parameters/MediaId'}
    get:
      operationId: getMedia
      tags: [media]
      summary: One media with its segments.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: The media.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Media'}
              examples: {default: {$ref: '#/components/examples/Media'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMedia
      tags: [media]
      summary: Change a media's title, kind or cover.
      description: |
        Server emits one `media.updated` with the registers present (`title`, `kind`,
        `cover_blob_hash`). `cover_blob_hash` must be an existing blob of kind `image`, or `null`
        to remove the cover. The media deck's name is not changed (patch the deck). Empty body:
        `422`.
      x-emits-ops: [media.updated]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaPatch'}
            examples:
              default: {value: {title: 葬送のフリーレン (S1), kind: anime}}
      responses:
        '200':
          description: The updated media.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Media'}
              examples: {default: {$ref: '#/components/examples/Media'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a media, its deck and its parsed content.
      description: |
        Server emits `media.deleted` and, as a consequence in the same transaction,
        `deck.deleted` for the media deck; then hard-deletes the media's segments, sentences,
        occurrences and detected grammar spans (SCHEMA.md 4.3). Notes mined from it, manual
        spans and reviews stay. Queued or running jobs for the media are cancelled. Already
        deleted: `204`, no op.
      x-emits-ops: [media.deleted, deck.deleted]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Deleted.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /media/{media_id}/reparse:
    parameters:
      - {$ref: '#/components/parameters/MediaId'}
    post:
      operationId: reparseMedia
      tags: [media]
      summary: Re-parse a media (after parse overrides or a dictionary refresh).
      description: |
        Enqueues a job of kind `media-parse` (dedupe key `media-parse:<media_id>`); an equivalent
        queued or running job is returned with `200`. The job keeps segment and sentence ids as
        SCHEMA.md requires and makes the server emit `media.content_published` and
        `deck.content_published`. Media with `source = jpdb` has nothing to parse:
        `409 not_applicable`.
        When a job is enqueued (`202`) the request emits `media.content_published` with
        `parse_status = parsing` (same version and hash) in the same transaction, unless the
        media is already `parsing`; if the job then fails or is cancelled the server sets
        `failed` or back to `parsed` (`contracts/db/MEDIA_PIPELINE.md` 4, C-11).
      x-emits-ops: [media.content_published]
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      responses:
        '200':
          description: A parse is already queued or running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobMediaParse'}}
        '202':
          description: Parse job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobMediaParse'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
  /media/{media_id}/coverage:
    parameters:
      - {$ref: '#/components/parameters/MediaId'}
    get:
      operationId: getMediaCoverage
      tags: [media]
      summary: Coverage of a media (or one segment) by your word statuses.
      description: |
        Computed at request time from `occurrence`, `media_segment` and `word_status`, so it
        always reflects the current statuses. Definitions are on the `Coverage` schema. With
        `segment_id` the numbers cover only that segment and `segments` has that one element.
        Media with `content_version = 0` (not parsed yet) returns all-zero numbers.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: segment_id
          in: query
          description: Restrict to one segment of this media (`404` if it is not one).
          schema: {$ref: '#/components/schemas/Uuid'}
          example: 01931f40-3100-7000-8000-000000000e11
        - {$ref: '#/components/parameters/CoverageHide'}
      responses:
        '200':
          description: Coverage numbers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Coverage'}
              examples: {default: {$ref: '#/components/examples/Coverage'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
  /media/{media_id}/sentences:
    parameters:
      - {$ref: '#/components/parameters/MediaId'}
    get:
      operationId: listMediaSentences
      tags: [media]
      summary: Sentences of a media, optionally only i+1 sentences.
      description: |
        Same as `GET /sentences` with `media_id` fixed. Ordered by segment `ordinal`, then
        sentence `ordinal`. jpdb-imported media have no sentences (empty page).
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/SentenceFilter'}
        - {$ref: '#/components/parameters/SentenceSegment'}
        - {$ref: '#/components/parameters/SentenceQ'}
        - {$ref: '#/components/parameters/SentenceEntry'}
        - {$ref: '#/components/parameters/SentenceGrammar'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of sentences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SentencePage'}
              examples: {default: {$ref: '#/components/examples/SentencePage'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
  /sentences:
    get:
      operationId: listSentences
      tags: [media]
      summary: Search sentences across all media.
      description: |
        All filters combine with AND. Ordered by media `created_at` descending, media id, segment
        `ordinal`, sentence `ordinal`. Sentences of deleted media do not exist any more and are
        never returned. LLM-generated sentences (`origin = generated`) are included and must be
        labelled by clients. Each sentence carries its live grammar spans (detected and manual).
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: media_id
          in: query
          description: Only sentences of this media.
          schema: {$ref: '#/components/schemas/Uuid'}
          example: 01931f40-3000-7000-8000-000000000e01
        - {$ref: '#/components/parameters/SentenceFilter'}
        - {$ref: '#/components/parameters/SentenceSegment'}
        - {$ref: '#/components/parameters/SentenceQ'}
        - {$ref: '#/components/parameters/SentenceEntry'}
        - {$ref: '#/components/parameters/SentenceGrammar'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of sentences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SentencePage'}
              examples: {default: {$ref: '#/components/examples/SentencePage'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /sentences/{sentence_id}:
    parameters:
      - name: sentence_id
        in: path
        required: true
        description: Sentence id.
        schema: {$ref: '#/components/schemas/Uuid'}
        example: 01931f40-5000-7000-8000-000000000701
    get:
      operationId: getSentence
      tags: [media]
      summary: One sentence with tokens and grammar spans.
      description: '`404` when the sentence does not exist (never imported, or purged with its media or by a re-parse).'
      security:
