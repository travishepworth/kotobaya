    JobPayloadGrammarDetect:
      type: object
      description: |
        Payload of a `grammar-detect` job (C-13). `{}` = fan-out: enqueue one per-media job for
        every eligible media. `{"media_id": …}` = re-detect that one media. Enqueued by the
        server (fan-out) and the worker (per-media), never through the API.
      additionalProperties: false
      properties:
        media_id:
          $ref: '#/components/schemas/Uuid'
          description: Media to re-detect. Absent = fan-out over all eligible media.
          examples:
          - 01931f40-4000-7000-8000-000000000501
    JobPayloadFsrsOptimize:
      type: object
      description: Payload of an `fsrs-optimize` job.
      additionalProperties: false
      required:
      - preset_id
      properties:
        preset_id:
          $ref: '#/components/schemas/Uuid'
          description: Preset to optimize.
    JobPayloadDeckBuild:
