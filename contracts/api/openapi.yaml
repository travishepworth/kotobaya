  /words/{seq}/status:
    parameters:
      - {$ref: '#/components/parameters/Seq'}
    get:
      operationId: getWordStatus
      tags: [words]
      summary: Word status of one entry.
      description: An entry without a `word_status` row is reported as `status = new` with every other property null. The entry need not exist in the dictionary.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: The word status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WordStatus'}
              examples: {default: {$ref: '#/components/examples/WordStatus'}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: setWordStatus
      tags: [words]
      summary: Set an explicit status override (known, never-forget, blacklisted, ignored).
      description: |
        Server emits `word.status_set` with payload `origin = manual` (stored as `override_origin`). `new` and `learning`
        cannot be set (they are derived): to return to the derived status use `DELETE`.
        The entry need not exist in the dictionary and need not have a note. Setting the status
        it already has still emits (bumps the clock).
      x-emits-ops: [word.status_set]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WordStatusSet'}
            examples:
              never_forget: {value: {status: never_forget}}
              blacklist: {value: {status: blacklisted}}
      responses:
        '200':
          description: The word status after the change.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WordStatus'}
              examples: {default: {$ref: '#/components/examples/WordStatus'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: clearWordStatus
      tags: [words]
      summary: Clear the override; the status falls back to the derived one.
      description: |
        Server emits `word.status_cleared`. No override present (or no row): `200` with the
        current status, no op.
      x-emits-ops: [word.status_cleared]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '200':
          description: The word status after the change.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WordStatus'}
              examples: {default: {$ref: '#/components/examples/WordStatusCleared'}}
        default: {$ref: '#/components/responses/Problem'}
