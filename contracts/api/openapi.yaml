      description: Payload of `hello`.
      required:
      - high_water_seq
      - log_epoch
      - server_time
      properties:
        high_water_seq:
          type: integer
          format: int64
          minimum: 0
          description: Current sync head (as `PullResponse.high_water_seq`).
        log_epoch:
          $ref: '#/components/schemas/Uuid'
          description: Current log identity (contracts/sync/SYNC.md 6.2).
        server_time:
          $ref: '#/components/schemas/Timestamp'
          description: Server wall clock.
    EventSyncChanged:
      type: object
      description: Payload of `sync.changed`.
      required:
      - high_water_seq
      properties:
        high_water_seq:
          type: integer
          format: int64
          minimum: 1
          description: New sync head.
    EventNoteCreated:
      type: object
      description: Payload of `note.created`.
      required:
      - note_id
      - origin_device_id
      - origin
      - seq
      properties:
        note_id:
          $ref: '#/components/schemas/Uuid'
          description: The new note (may already be a merge loser; `GET /notes/{id}` answers with the survivor).
        origin_device_id:
          $ref: '#/components/schemas/Uuid'
          description: Device whose op created it.
        origin:
          type: string
          description: The note's `origin`.
          examples:
          - takoboto
        seq:
          type: integer
          format: int64
          minimum: 1
          description: '`change.seq` of the creating op.'
    EventDevice:
      type: object
      description: Payload of `device.paired` and `device.revoked`.
      required:
      - device_id
      - name
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: The device.
        name:
          type: string
          description: Its name.
    AnkiConnectRequest:
      type: object
      description: AnkiConnect request envelope.
      required:
      - action
      additionalProperties: true
      properties:
        action:
          type: string
          description: 'Supported: `version`, `deckNames`, `modelNames`, `modelFieldNames`, `addNote`, `canAddNotes`,
            `findNotes`, `storeMediaFile`. Any other value yields error `unsupported action`.'
          examples:
          - addNote
        version:
          type: integer
          description: Protocol version the client speaks; the server always answers in the version 6 shape.
          examples:
          - 6
        params:
          type: object
          additionalProperties: true
          description: Action parameters (table on `POST /ankiconnect`).
        key:
          type: string
          description: A personal access token with the `write` scope, when no other credential is sent.
    AnkiConnectResponse:
      type: object
      description: AnkiConnect response envelope; exactly one of the two is non-null (both null never happens; `result`
        may legitimately be `false`, `0` or an empty array).
      required:
      - result
      - error
      properties:
        result:
          description: Action result (type by action), or null on error.
        error:
          type:
          - string
          - 'null'
          description: Error message, or null on success.
