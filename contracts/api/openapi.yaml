    Preset:
      type: object
      description: A scheduling preset (`app.fsrs_params`).
      required:
      - id
      - name
      - desired_retention
      - maximum_interval_days
      - learning_steps_s
      - relearning_steps_s
      - fuzz
      - easy_days
      - fsrs_version
      - weights
      - weights_version
      - optimized_at
      - optimizer_stats
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Preset id. `00000000-0000-7000-8000-000000000010` is the Default preset.
        name:
          type: string
          minLength: 1
          description: Display name.
          examples:
          - Default
        desired_retention:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          description: Target recall probability.
          examples:
          - 0.9
        maximum_interval_days:
          type: integer
          minimum: 1
          description: Cap on scheduled intervals.
          examples:
          - 36500
        learning_steps_s:
          type: array
          items:
            type: integer
            minimum: 1
          description: Learning steps in seconds, in order; empty = none.
          examples:
          - - 60
            - 600
        relearning_steps_s:
          type: array
          items:
            type: integer
            minimum: 1
          description: Relearning steps in seconds.
          examples:
          - - 600
        fuzz:
          type: boolean
          description: Whether interval fuzz and load balancing are applied.
        easy_days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: number
            minimum: 0
            maximum: 1
          description: Load multiplier per ISO weekday, element 0 = Monday ... 6 = Sunday (the SQL array index 1..7).
            1 = normal, 0 = minimum.
          examples:
          - - 1
            - 1
            - 1
            - 1
            - 1
            - 1
            - 0.5
        fsrs_version:
          type:
          - string
          - 'null'
          description: FSRS version of `weights`; null together with `weights`.
          examples:
          - '6'
        weights:
          type:
          - array
          - 'null'
          items:
            type: number
          description: Optimized FSRS weights, or null = the core's defaults.
        weights_version:
          type: integer
          minimum: 0
          description: Incremented by each optimizer publication; 0 = never optimized.
          examples:
          - 3
        optimized_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When weights were last published.
        optimizer_stats:
          type:
          - object
          - 'null'
          description: 'Metrics of the last optimizer run: `{"review_count", "log_loss", "rmse_bins"}`.'
          additionalProperties: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Last change.
        deleted_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Tombstone.
