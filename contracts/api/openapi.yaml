  # ---------------------------------------------------------------- jobs
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List background jobs (imports, parses, optimizer runs, ...).
      description: Ordered by `created_at` descending, then `id` descending. Jobs are kept for at least 30 days after finishing.
        Server-internal jobs (kind not in `JobKind`, C-9, see `Job`) are never listed.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: kind
          in: query
          description: Only jobs of this kind.
          schema: {$ref: '#/components/schemas/JobKind'}
          example: media-import
        - name: status
          in: query
          description: Only jobs in one of these states (comma-separated).
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/JobStatus'}
          example: [queued, running]
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of jobs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
              examples: {default: {$ref: '#/components/examples/JobPage'}}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    get:
      operationId: getJob
      tags: [jobs]
      summary: One job with progress, result or error.
      description: The id of a server-internal job (kind not in `JobKind`, C-9, see `Job`) answers `404 not_found`, as if it
        did not exist.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobMediaImport'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /jobs/{job_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/JobId'}
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a queued or running job.
      description: |
        Sets `status = cancelled`, `finished_at = now`. A running job's worker notices at its
        next heartbeat (within 30 s) and stops; content it already published stays published.
        Already cancelled: `200`, unchanged. Succeeded or failed: `409 job_not_cancellable`.
        A server-internal job's id (C-9, see `Job`) answers `404 not_found`; cancel its parent
        instead, which also stops the child.
      x-emits-ops: []
      security:
        - bearerAuth: [import]
        - sessionCookie: [import]
      responses:
        '200':
          description: The cancelled job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobCancelled'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Problem'}
  /tts:
    post:
      operationId: synthesizeSpeech
      tags: [jobs]
      summary: Synthesize Japanese speech (VOICEVOX) into an audio blob.
      description: |
        Enqueues a job of kind `tts` (dedupe key `tts:<sha256 of voice + NUL + text>`); an
        equivalent queued or running job is returned with `200`. On success
        `job.result.blob_hash` names an audio blob (kind `audio`, origin `tts`). The caller then
        puts `[sound:<hash>]` into a note field with `PATCH /notes/{id}`; this call changes no
        note.
      x-emits-ops: []
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TtsRequest'}
            examples:
              default: {value: {text: パンを食べる}}
      responses:
        '200':
          description: An equivalent job is already queued or running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobTts'}}
        '202':
          description: Job queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              examples: {default: {$ref: '#/components/examples/JobTts'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- blobs
  /blobs/query:
    post:
      operationId: queryBlobs
      tags: [blobs]
      summary: Ask which of a set of blobs the server already has.
      description: Lets a client skip uploads. 1 to 1000 hashes; duplicates are ignored. `present` and `missing` partition the distinct input, each sorted ascending.
      x-emits-ops: []
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlobQuery'}
            examples:
              default: {value: {hashes: [9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08, 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae]}}
      responses:
        '200':
          description: Which hashes exist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlobQueryResult'}
              examples: {default: {$ref: '#/components/examples/BlobQueryResult'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /blobs/{hash}:
    parameters:
      - {$ref: '#/components/parameters/BlobHash'}
    get:
      operationId: getBlob
      tags: [blobs]
      summary: Download a blob.
      description: |
        Returns the bytes with the stored `Content-Type`, `Content-Length`,
        `ETag: "<hash>"` and `Cache-Control: private, max-age=31536000, immutable`. Supports
        single-range `Range` requests (`206`) and `If-None-Match` (`304`). `HEAD` behaves the
        same without a body (not listed separately). The server may answer `302` to a
        short-lived pre-signed object-store URL; clients MUST follow redirects and MUST NOT
        forward the `Authorization` header to the redirect target.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: The blob's bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
              example: (binary)
        '206':
          description: The requested byte range.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
              example: (binary)
        '302':
          description: Redirect to a pre-signed object-store URL valid for at least 60 seconds.
          headers:
            Location:
              description: Pre-signed URL.
              schema: {type: string, format: uri}
              example: https://s3.kotobaya.example/kotobaya/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08?X-Amz-Signature=abc
        '304': {description: Not modified (`If-None-Match` matched).}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: putBlob
      tags: [blobs]
      summary: Upload a blob under its SHA-256.
      description: |
        The body is the raw bytes; `Content-Type` is stored as the blob's content type
        (`application/octet-stream` when the caller does not know better). The server hashes the
        bytes while storing; a mismatch with `{hash}` is `422 hash_mismatch` and nothing is
        kept. Uploading a hash that exists is a no-op returning `200` with the stored metadata
        (the new body is discarded, `kind` and content type are not changed). Maximum size
        `limits.max_blob_bytes` from `GET /meta` (`413`). `origin` is always `upload`.
        Direct write to the system table `blob`; no op. Needs `write` or `import`.
      x-emits-ops: []
      security:
        - bearerAuth: [write]
        - bearerAuth: [import]
        - sessionCookie: [write]
      parameters:
        - name: kind
          in: query
          required: true
          description: What the blob is - `audio` or `image` for card and media assets, `upload` for a raw import file. (`snapshot` blobs are produced only by server jobs.)
          schema: {type: string, enum: [audio, image, upload]}
          example: audio
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
            example: (binary)
      responses:
        '200':
          description: The blob already existed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Blob'}
              examples: {default: {$ref: '#/components/examples/Blob'}}
        '201':
          description: Stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Blob'}
              examples: {default: {$ref: '#/components/examples/Blob'}}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- sync
  /sync/push:
    post:
      operationId: syncPush
      tags: [sync]
      summary: Push a batch of locally minted operations.
      description: |
        **Bodies.** The request body is exactly `contracts/sync/batch.schema.json#/$defs/PushRequest`
        and the `200` body is exactly `#/$defs/PushResponse`; this operation adds no wrapper and
        no fields of its own. `contracts/sync/SYNC.md` sections 5.1-5.4 own the semantics (per-op
        procedure, result statuses `accepted` / `duplicate` / `rejected`, rejection codes,
        `high_water_seq`, `server_time` as `instant_ms`, `log_epoch`, `durable_seq`); this
        operation defines only the HTTP framing, auth and status codes. Where this text and
        SYNC.md disagree, SYNC.md wins.

        **What the server validates as a whole.** The server validates the body against
        `#/$defs/PushRequestLenient` **only** (a JSON object with `ops`: 1-500 objects, each with
        a UUID `op_id`). If that fails the whole request is `400 invalid_request` and nothing is
        applied (`errors[]` points at the offending part). The schema `PushRequest` is what a
        correct client sends; the server never rejects a whole request because an op fails it.

        **Duplicate keys (C-2, SYNC.md 5.2 "Parsing the body").** The server parses the body with
        a syntax-only, duplicate-tolerant JSON parse. A key repeated in the top-level body
        object, an element whose `op_id` member is repeated, or two elements with the same
        `op_id` and different contents fail `PushRequestLenient` (`400 invalid_request`). A key
        repeated anywhere inside one element of `ops` is NOT a 400: that op is `rejected` with
        `schema_invalid`, decided before `op_too_large` (its canonical size is undefined).
        Clients MUST send each op exactly as `CanonicalJson.encode` / `OpCodec.encode` produce
        it, which never contains a duplicate key.

        **Everything else is per op** (SYNC.md 5.2, 5.3), in array order, and reported as a
        `rejected` result while the remaining ops are still processed: an op over
        `limits.max_op_bytes` (`op_too_large`, checked first; SYNC.md 5.4), unknown op type or
        version (`unsupported_op`), an op invalid against `op.schema.json` (`schema_invalid`),
        an op whose `device_id` is not the caller's device (`device_mismatch`), server-only ops
        (`server_only`), missing references (`unknown_reference`), a wrong device clock
        (`clock_ahead`, `clock_behind`; SYNC.md 3.4 and 10.4), `invalid_value`,
        `invalid_target`, `immutable`. This API adds one code to SYNC.md's open set:
        `insufficient_scope` - an op of type `review.*` pushed by a token without the `review`
        scope; checked right after `device_mismatch` (SYNC.md 5.3 order). Clients treat unknown codes as permanent rejections (SYNC.md 5.3).

        **Request-level errors** (nothing applied, rows stay `pending`, SYNC.md 5.4):
        - `401 unauthenticated`; `403 insufficient_scope` (no `write`); `403 device_required`
          (the token is not bound to a device: only `device` tokens and `personal` tokens created
          with `with_device` may push; session cookies have no device).
        - `400 invalid_request`: not JSON, or `PushRequestLenient` fails (empty `ops`, more than
          500 ops, an op without a valid `op_id`, ...).
        - `413 payload_too_large`: body over `limits.max_push_bytes` (`GET /meta`, default 8 MiB).
          This is about the batch, never about one op: a single op over `limits.max_op_bytes`
          (default 1 MiB, at most `max_push_bytes - 4096`) is a per-op `op_too_large` result in
          a `200`. On a `413` the client does not back off (SYNC.md 5.4): it halves the batch
          (the first `ceil(n/2)` ops, still in ascending `hlc`) and pushes again at once, down to
          a single op. If a single op still gets `413` (the server's limits are inconsistent or
          the client's view of them is stale), the client marks that row rejected with
          `op_too_large` itself and continues with the next ops; it is then an ordinary rejected
          op (SYNC.md 10).
        - `415`, `429`, `5xx` as everywhere.
        There is no whole-request `409` and no whole-request `422` on this operation.

        **Status.** `200` whenever the body passed `PushRequestLenient`, even if every op was
        rejected. `results` has exactly one entry per pushed op, in request order. Ops the server
        emits as consequences (`note.merged`, `card.merged`, ...) are not in `results`; they
        arrive through `GET /sync/pull`.

        **Retry.** On no response, `5xx` or `429` the client re-sends the same ops (SYNC.md 5.4);
        ops already committed come back as `duplicate` with their original `seq`. Before using a
        response the client compares `log_epoch` and `high_water_seq` with its stored state
        (SYNC.md 6.2, log reset) and checks `server_time` against its own clock (SYNC.md 3.4).

        Side effects: updates `device.last_push_at` and `last_seen_at`; emits the event
        `sync.changed` when at least one op was accepted.
      x-emits-ops: []
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../sync/batch.schema.json#/$defs/PushRequest'}
            examples:
              default:
                summary: A new note, its cards, an edit, a suspend and a review (contracts/sync/examples/batches/push-request.json)
                x-example-source: '../sync/examples/batches/push-request.json'
                value:
                  {
                    "ops": [
                      {
                        "op_id": "0193a1b2-00ff-7005-8000-000000000004",
