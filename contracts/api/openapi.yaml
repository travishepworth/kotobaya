    NoteSummary:
      type: object
      description: The parts of a note needed to render and identify a card.
      required:
      - id
      - note_type_id
      - type
      - entry_seq
      - kanji_literal
      - grammar_point_id
      - fields
      - tags
      - mnemonic
      - source_sentence
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Note id.
        note_type_id:
          $ref: '#/components/schemas/Uuid'
          description: Note type.
        type:
          $ref: '#/components/schemas/NoteBaseType'
        entry_seq:
          oneOf:
          - $ref: '#/components/schemas/EntrySeq'
          - type: 'null'
          description: Referenced entry (vocab only).
        kanji_literal:
          type:
          - string
          - 'null'
          description: Referenced kanji (kanji notes only).
        grammar_point_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Referenced grammar point (grammar notes only).
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field values (HTML fragments) by field key.
        tags:
          type: array
          items:
            type: string
          description: Tags, sorted ascending.
        mnemonic:
          type: string
          description: Mnemonic (Markdown); empty if none.
        source_sentence:
          type: string
          description: Sentence the note was mined from; empty if none.
    Note:
      type: object
      description: A note (`app.note`) with its live cards.
      required:
      - id
      - note_type_id
      - type
      - language
      - entry_seq
      - kanji_literal
      - grammar_point_id
      - fields
      - tags
      - mnemonic
      - source_sentence
      - source_sentence_id
      - source_media_id
      - origin
      - created_by_device_id
      - created_at
      - updated_at
      - deleted_at
      - merged_into_id
      - cards
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Note id.
        note_type_id:
          $ref: '#/components/schemas/Uuid'
          description: Note type. Immutable.
        type:
          $ref: '#/components/schemas/NoteBaseType'
          description: Equals the note type's `base_type`.
        language:
          type: string
          description: BCP 47; always `ja` in v1.
          examples:
          - ja
        entry_seq:
          oneOf:
          - $ref: '#/components/schemas/EntrySeq'
          - type: 'null'
          description: Dictionary entry (vocab notes); null when unmatched.
        kanji_literal:
          type:
          - string
          - 'null'
          description: Kanji (kanji notes).
          examples:
          - 績
        grammar_point_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Grammar point (grammar notes).
        fields:
          type: object
          additionalProperties:
            type: string
          description: 'Field values by key: HTML fragments; audio as `[sound:<sha256>]`, images as `<img src="blob:<sha256>">`.
            For referenced notes an empty or missing field means "render from the dictionary".'
        tags:
          type: array
          items:
            type: string
          description: Tags, de-duplicated, sorted ascending. `leech` is never stored.
        mnemonic:
          type: string
          description: Mnemonic (Markdown); empty if none.
        source_sentence:
          type: string
          description: Sentence the note was mined from, by value; empty if none.
        source_sentence_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Soft reference to the sentence; may dangle.
        source_media_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Soft reference to the media; may dangle.
        origin:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: 'How the note was created: `manual`, `takoboto`, `yomitan`, `ankiconnect`, `share`, `reader`,
            `deck`, `jpdb_import`, `api`, `auto_kanji`, ... (open set).'
          examples:
          - reader
        created_by_device_id:
          $ref: '#/components/schemas/Uuid'
          description: Origin device of the creating op.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Last change.
        deleted_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Tombstone.
        merged_into_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Set on a merge loser - the survivor's id. Only visible with `include_deleted=true` in lists.
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          description: Live cards of the note, ordered by kind. Their `note` property is omitted.
    NotePage:
      type: object
      description: A page of notes.
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'
          description: Notes, newest first.
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor of the next page, or null.
    NoteCreate:
      type: object
      description: New note.
      additionalProperties: false
      required:
      - note_type_id
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Optional client-generated UUIDv7 (idempotent creation).
        note_type_id:
          $ref: '#/components/schemas/Uuid'
          description: A live note type.
        entry_seq:
          $ref: '#/components/schemas/EntrySeq'
          description: Dictionary entry; vocab types only.
        kanji_literal:
          type: string
          minLength: 1
          maxLength: 2
          description: One kanji (one code point); kanji types only.
          examples:
          - 績
        grammar_point_id:
          $ref: '#/components/schemas/Uuid'
          description: A live grammar point; grammar types only.
        fields:
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 100000
          default: {}
          description: Field values by key.
        tags:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: ^\S{1,64}$
          default: []
          description: Tags.
        mnemonic:
          type: string
          maxLength: 10000
          default: ''
          description: Mnemonic (Markdown).
        source_sentence:
          type: string
          maxLength: 10000
          default: ''
          description: Sentence the note was mined from.
        source_sentence_id:
          $ref: '#/components/schemas/Uuid'
          description: Soft reference to the sentence.
        source_media_id:
          $ref: '#/components/schemas/Uuid'
          description: Soft reference to the media.
        origin:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 40
          default: api
          description: How the note was created.
        card_kinds:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]*$
          description: Card kinds to create. Default - the note type's default kinds.
        deck_id:
          $ref: '#/components/schemas/Uuid'
          description: Also add the note (or its entry) to this user deck.
    NotePatch:
      type: object
      description: Changes to a note. At least one property. See the register table on `PATCH /notes/{note_id}`.
      additionalProperties: false
      minProperties: 1
      properties:
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            maxLength: 100000
          description: Field values to set (partial map); `""` clears a field.
        tags:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: ^\S{1,64}$
          description: The whole new tag set.
        add_tags:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: ^\S{1,64}$
          description: Tags to add to the current set. If the merged set would exceed 200 tags the request is
            `422 validation_failed`, error code `out_of_range` at `/add_tags` (C-2).
        remove_tags:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: ^\S{1,64}$
          description: Tags to remove from the current set; absent ones are ignored.
        mnemonic:
          type: string
          maxLength: 10000
          description: Mnemonic (Markdown).
        source_sentence:
          type: string
          maxLength: 10000
          description: Source sentence.
        source_sentence_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Soft reference to the sentence.
        source_media_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Soft reference to the media.
        entry_seq:
          oneOf:
          - $ref: '#/components/schemas/EntrySeq'
          - type: 'null'
          description: Re-match to another entry, or null to un-match (vocab notes only).
    Card:
      type: object
      description: A card (`app.card`). The schedule properties are a cache computed from the review log.
      required:
      - id
      - note_id
      - kind
      - preset_id
      - suspended
      - buried_until
      - flags
      - state
      - step
      - stability
      - difficulty
      - due_at
      - interval_days
      - last_review_at
      - reps
      - lapses
      - leech
      - created_at
      - updated_at
      - deleted_at
      - merged_into_id
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Card id.
        note_id:
          $ref: '#/components/schemas/Uuid'
          description: Owning note.
        kind:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Card kind - a key of the note type's `templates`.
          examples:
          - meaning
        preset_id:
          $ref: '#/components/schemas/Uuid'
          description: Scheduling preset. If it is deleted, the Default preset schedules the card.
        suspended:
          type: boolean
          description: Suspended cards are never queued but keep their schedule.
        buried_until:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Manual bury - hidden while now is before this instant. Sibling burying is not stored.
        flags:
          type: integer
