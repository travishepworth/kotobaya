  /confusables/{note_a_id}/{note_b_id}/{reason}:
    parameters:
      - name: note_a_id
        in: path
        required: true
        description: One note of the pair. The two ids may be given in either order; the server stores the smaller first.
        schema: {$ref: '#/components/schemas/Uuid'}
        example: 01931f40-1a2b-7c3d-8e4f-000000000a01
      - name: note_b_id
        in: path
        required: true
        description: The other note. Must differ from `note_a_id` (`422`).
        schema: {$ref: '#/components/schemas/Uuid'}
        example: 01931f40-1a2b-7c3d-8e4f-000000000a02
      - name: reason
        in: path
        required: true
        description: Why the two are confusable.
        schema: {$ref: '#/components/schemas/ConfusableReason'}
        example: look_alike
    put:
      operationId: setConfusable
      tags: [words]
      summary: Confirm or reject a suggested pair, or record a pair yourself.
      description: |
        Server emits `confusable.confirmed` or `confusable.rejected`. If the pair does not exist
        yet the op creates it (a hand-made pair is simply a confirmed one). Both notes must
        exist; merge losers are resolved to survivors first, and if both resolve to the same
        note the call is `422`. A user decision always beats a suggestion; between decisions the
        later clock wins. Rejected pairs are kept so they are not suggested again.
      x-emits-ops: [confusable.confirmed, confusable.rejected]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfusableSet'}
            examples:
              confirm: {value: {status: confirmed}}
              reject: {value: {status: rejected}}
      responses:
        '200':
          description: The pair as stored.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Confusable'}
              examples: {default: {$ref: '#/components/examples/Confusable'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- grammar
  /grammar:
    get:
      operationId: listGrammarPoints
      tags: [grammar]
      summary: List or search the grammar library.
      description: Ordered by `jlpt` descending with NULLs last (easiest first), then `title`, then `id`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of title, pattern or meaning.
          schema: {type: string, minLength: 1, maxLength: 200}
          example: ざるを得ない
        - name: jlpt
          in: query
          description: Only points of this N-level.
          schema: {type: integer, minimum: 1, maximum: 5}
          example: 2
        - name: is_stub
          in: query
          description: Only stubs (`true`) or only filled-in points (`false`).
          schema: {type: boolean}
          example: false
        - {$ref: '#/components/parameters/IncludeDeleted'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of grammar points.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrammarPointPage'}
              examples: {default: {$ref: '#/components/examples/GrammarPointPage'}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createGrammarPoint
      tags: [grammar]
      summary: Create a grammar point.
      description: |
        Server emits `grammar.created`. Only `title` is required. Each `detection_rules[].rule`
        must parse in the token-pattern language (`422` with the rule's pointer otherwise).
        `related_ids` are soft references and are not checked. Creating the point does not create
        a grammar note or card: do that with `POST /notes` (`grammar_point_id`). Non-empty
        `detection_rules` make the server enqueue re-detection of all media (a `grammar-detect`
        job, C-13; see `Job`); media parse and import jobs also detect. Deleting a point with
        non-empty rules enqueues it too.
      x-emits-ops: [grammar.created]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrammarPointCreate'}
            examples:
              default:
                value:
                  id: 01931f40-4000-7000-8000-000000000901
                  title: ざるを得ない
                  pattern: 〜ざるを得ない
                  meaning: cannot help but; have no choice but to
                  jlpt: 2
                  detection_rules: [{rule: '[verb:未然形] ざる を 得 ない', draft: false}]
      responses:
        '200':
          description: A grammar point with this `id` already existed; returned unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrammarPoint'}
              examples: {default: {$ref: '#/components/examples/GrammarPoint'}}
        '201':
          description: Created.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrammarPoint'}
              examples: {default: {$ref: '#/components/examples/GrammarPoint'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /grammar/{grammar_point_id}:
    parameters:
      - {$ref: '#/components/parameters/GrammarPointId'}
    get:
      operationId: getGrammarPoint
      tags: [grammar]
      summary: One grammar point.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/IncludeDeleted'}
      responses:
        '200':
          description: The grammar point.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrammarPoint'}
              examples: {default: {$ref: '#/components/examples/GrammarPoint'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateGrammarPoint
      tags: [grammar]
      summary: Edit a grammar point.
      description: |
        Server emits one `grammar.updated` with the registers present: `title`, `pattern`,
        `meaning`, `explanation`, `notes`, `jlpt`, `detection_rules` (whole array), `related_ids`
        (whole array), `links` (whole array), `is_stub`. Editing any text property of a stub does
        not clear `is_stub` by itself; send `is_stub: false`. Empty body: `422`.
        A winning `detection_rules` write makes the server enqueue re-detection of all media
        (a `grammar-detect` job, C-13; see `Job`), in the transaction that applies the op.
      x-emits-ops: [grammar.updated]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrammarPointPatch'}
            examples:
              fill_in: {value: {explanation: 'Formal. Attaches to the 未然形; する becomes せざる.', is_stub: false}}
      responses:
        '200':
          description: The updated grammar point.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrammarPoint'}
              examples: {default: {$ref: '#/components/examples/GrammarPoint'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteGrammarPoint
      tags: [grammar]
      summary: Delete a grammar point.
      description: |
        Server emits `grammar.deleted`. Its grammar note (if any) is not deleted and keeps
        working from its own fields; spans stay and are hidden by readers. Already deleted:
        `204`, no op.
      x-emits-ops: [grammar.deleted]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Deleted.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /grammar/{grammar_point_id}/rules/test:
    parameters:
      - {$ref: '#/components/parameters/GrammarPointId'}
    post:
      operationId: testGrammarRules
      tags: [grammar]
      summary: Run detection rules against your sentences without saving anything.
      description: |
        Evaluates `rules` (default: the point's stored `detection_rules`) over stored sentence
        tokens and returns up to `limit` matching sentences with the matched spans, scanning
        media newest first, sentences in order. Read-only: no spans are written, no op is
        emitted. A rule that does not parse is `422` with its pointer. The scan stops after
        `limit` matches or 200,000 sentences, whichever comes first; `scanned` and `truncated`
        say how far it got.
      x-emits-ops: []
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrammarRuleTestRequest'}
            examples:
              draft: {summary: Try a draft rule on one media, value: {rules: [{rule: '[verb:未然形] ざる を 得 ない', draft: true}], media_id: 01931f40-3000-7000-8000-000000000e01, limit: 20}}
      responses:
        '200':
          description: Matches.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrammarRuleTestResult'}
              examples: {default: {$ref: '#/components/examples/GrammarRuleTestResult'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /grammar/{grammar_point_id}/examples:
    parameters:
      - {$ref: '#/components/parameters/GrammarPointId'}
    get:
      operationId: listGrammarExamples
      tags: [grammar]
      summary: Sentences where the grammar point was seen (detected or highlighted by hand).
      description: |
        Sentences having at least one live span for this point. Spans whose sentence no longer
        exists are skipped. Ordered: manual spans first, then `i+0` sentences (no unknown
        words), then by unknown-word count ascending, then sentence id. Each sentence's
        `grammar_spans` lists all its spans; those of this point are the examples.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: origin
          in: query
          description: Only sentences having a span of this origin for the point.
          schema: {$ref: '#/components/schemas/SpanOrigin'}
          example: manual
        - {$ref: '#/components/parameters/SentenceFilter'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of sentences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SentencePage'}
              examples: {default: {$ref: '#/components/examples/SentencePage'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
  /grammar/{grammar_point_id}/spans/{sentence_id}/{start_offset}/{end_offset}:
    parameters:
      - {$ref: '#/components/parameters/GrammarPointId'}
      - name: sentence_id
        in: path
        required: true
        description: Sentence the span is in. Soft reference - it need not exist on the server (it may have been purged).
        schema: {$ref: '#/components/schemas/Uuid'}
        example: 01931f40-5000-7000-8000-000000000701
      - name: start_offset
        in: path
        required: true
        description: UTF-16 code-unit offset into the sentence text, inclusive.
        schema: {type: integer, minimum: 0}
        example: 3
      - name: end_offset
        in: path
        required: true
        description: UTF-16 code-unit offset, exclusive. Must be greater than `start_offset` (`422`).
        schema: {type: integer, minimum: 1}
        example: 9
    put:
      operationId: putGrammarSpan
      tags: [grammar]
      summary: Highlight a span of a sentence as an example of this grammar point ("I saw something weird").
      description: |
        Server emits `grammar.span_put` for the manual span
        `(sentence_id, grammar_point_id, start_offset, end_offset, manual)`. Putting a span that
        exists (live or removed) is fine: it becomes live. If the sentence exists, `end_offset`
        beyond its text length is `422` and `media_id` is filled in from the sentence; if it
        does not exist the span is stored as given with the body's `media_id` (or null). The
        grammar point must be live (`410` if deleted). To create a new point from a highlight,
        call `POST /grammar` first, then this.
      x-emits-ops: [grammar.span_put]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrammarSpanPut'}
            examples:
              default: {value: {}}
              hint: {summary: With a media hint for a sentence the server may not have, value: {media_id: 01931f40-3000-7000-8000-000000000e01}}
      responses:
        '200':
          description: The span as stored.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrammarSpan'}
              examples: {default: {$ref: '#/components/examples/GrammarSpan'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeGrammarSpan
      tags: [grammar]
      summary: Remove a manual span (reversible by putting it again).
      description: |
        Server emits `grammar.span_removed`. No live manual span with this key: `204`, no op.
        Detected spans cannot be removed this way (they are rebuilt by parse jobs; fix the rule
        instead).
      x-emits-ops: [grammar.span_removed]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      responses:
        '204':
          description: Removed.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- stats
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Today's counts for home screens (due, new, done, time).
      description: Computed at request time for the current study day with the core's queue builder, so the numbers equal what `GET /review/queue` would serve.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      responses:
        '200':
          description: Today's summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsSummary'}
              examples: {default: {$ref: '#/components/examples/StatsSummary'}}
        default: {$ref: '#/components/responses/Problem'}
  /stats/heatmap:
    get:
      operationId: getStatsHeatmap
      tags: [stats]
      summary: Reviews per study day.
      description: |
        One element per study day in `[from, to]` that has at least one review; days without
        reviews are omitted. Counts exclude undone and `manual` rows. A review's study day is
        computed from `reviewed_at` with the row's `utc_offset_min` (falling back to
        `scheduler.timezone` when NULL) and `scheduler.day_rollover_hour`. `from` after `to` is
        `422`; the range may span at most 3660 days.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/StatsFrom'}
        - {$ref: '#/components/parameters/StatsTo'}
      responses:
        '200':
          description: Per-day review counts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsHeatmap'}
              examples: {default: {$ref: '#/components/examples/StatsHeatmap'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /stats/retention:
    get:
      operationId: getStatsRetention
      tags: [stats]
      summary: Retention (share of reviews not rated Again), grouped.
      description: |
        Over `scheduled` reviews (not `learning`, `drill`, `cram`, `manual`; not undone) whose
        study day is in `[from, to]`. `retention` = passed / total where passed = rating 2-4.
        Groups with zero reviews are omitted. `young` = interval before the review under 21
        days, `mature` = 21 days or more.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/StatsFrom'}
        - {$ref: '#/components/parameters/StatsTo'}
        - name: group_by
          in: query
          description: Grouping key. `card_kind` groups by `(note type base_type, card kind)`; `day`, `week` (ISO, Monday start) and `month` group by study day.
          schema: {type: string, enum: [card_kind, day, week, month], default: card_kind}
          example: card_kind
      responses:
        '200':
          description: Retention per group and overall.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsRetention'}
              examples: {default: {$ref: '#/components/examples/StatsRetention'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /stats/forecast:
    get:
      operationId: getStatsForecast
      tags: [stats]
      summary: Due forecast per study day, plus the next 24 hours by hour.
      description: |
        `days[0]` is the current study day and includes overdue cards. Counts live, unsuspended
        cards by `due_at`; no simulation of future reviews. `hours` has 24 elements starting at
        the current clock hour (UTC instants), cards due in each hour; overdue cards are in
        `hours[0]`. New cards are not forecast.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: days
          in: query
          description: Number of study days to forecast, starting today.
          schema: {type: integer, minimum: 1, maximum: 365, default: 30}
          example: 30
      responses:
        '200':
          description: The forecast.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsForecast'}
              examples: {default: {$ref: '#/components/examples/StatsForecast'}}
        default: {$ref: '#/components/responses/Problem'}
  /stats/known-words:
    get:
      operationId: getStatsKnownWords
      tags: [stats]
      summary: Known words over time.
      description: |
        `current` counts `word_status` rows by effective status now. `series` is a best-effort
        reconstruction: for each period end, the number of entries whose vocab note had reached
        the core's "known" threshold by then according to the review log, plus overrides by
        their `updated_at`. Only the latest point is guaranteed to equal `current.known +
        current.never_forget`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/StatsFrom'}
        - {$ref: '#/components/parameters/StatsTo'}
        - name: interval
          in: query
          description: Spacing of the series points.
          schema: {type: string, enum: [day, week, month], default: week}
          example: week
      responses:
        '200':
          description: Known-word counts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsKnownWords'}
              examples: {default: {$ref: '#/components/examples/StatsKnownWords'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /stats/calibration:
    get:
      operationId: getStatsCalibration
      tags: [stats]
      summary: FSRS calibration - predicted versus actual recall.
      description: |
        Over `scheduled` reviews (not undone) in `[from, to]`: each review's predicted
        retrievability (from the replay state just before it) is put into one of 20 equal bins
        over [0, 1]; a bin reports the mean prediction, the actual pass rate and the count.
        Empty bins are omitted. Optional `preset_id` restricts to cards on that preset.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - {$ref: '#/components/parameters/StatsFrom'}
        - {$ref: '#/components/parameters/StatsTo'}
        - name: preset_id
          in: query
          description: Only reviews of cards currently on this preset.
          schema: {$ref: '#/components/schemas/Uuid'}
          example: 00000000-0000-7000-8000-000000000010
      responses:
        '200':
          description: Calibration bins.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsCalibration'}
              examples: {default: {$ref: '#/components/examples/StatsCalibration'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- parsing
  /parse:
    post:
      operationId: parseText
      tags: [parsing]
      summary: Parse text - tokens, matched entries and their known status.
      description: |
        Runs the same pipeline as media parsing (normalise, Sudachi, deinflect, match JMdict,
        apply global parse overrides) synchronously and stores nothing. The text is split into
        sentences; token offsets are relative to each sentence's `text`. `entries` holds one
        summary (with your `status` and `note_id`) per distinct `seq` among the tokens.
        Text of 1 to 20,000 characters (code points); longer is `413 payload_too_large`.
        Tokens, sentence splitting and override application: `contracts/api/PARSER.md` (C-12).
        The server forwards the text to the worker parse service (`contracts/api/worker-parse.yaml`,
        `PARSER_URL`, timeout `PARSER_TIMEOUT_MS`, default 10 s) and passes its sentences through
        unchanged. If the parser is not configured, unreachable, times out, is busy or starting,
        or answers with anything but `200`/`413`: `503 unavailable` (`Retry-After: 5` when busy or
        starting).
      x-emits-ops: []
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParseRequest'}
            examples:
              default: {value: {text: パンを食べる。}}
      responses:
        '200':
          description: Parse result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParseResult'}
              examples: {default: {$ref: '#/components/examples/ParseResult'}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Problem'}
  /parse-overrides:
    get:
      operationId: listParseOverrides
      tags: [parsing]
      summary: List your tokenisation corrections.
      description: Ordered by `updated_at` descending, then `id`.
      security:
        - bearerAuth: [read]
        - sessionCookie: [read]
      parameters:
        - name: media_id
          in: query
          description: Only overrides scoped to this media (including sentence-scoped ones inside it).
          schema: {$ref: '#/components/schemas/Uuid'}
          example: 01931f40-3000-7000-8000-000000000e01
        - name: scope
          in: query
          description: Only overrides of this scope.
          schema: {type: string, enum: [global, media, sentence]}
          example: global
        - {$ref: '#/components/parameters/IncludeDeleted'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: One page of overrides.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParseOverridePage'}
              examples: {default: {$ref: '#/components/examples/ParseOverridePage'}}
        default: {$ref: '#/components/responses/Problem'}
  /parse-overrides/{override_id}:
    parameters:
      - name: override_id
        in: path
        required: true
        description: Override id (client-generated UUIDv7).
        schema: {$ref: '#/components/schemas/Uuid'}
        example: 01931f40-6000-7000-8000-000000000801
    put:
      operationId: putParseOverride
      tags: [parsing]
      summary: Create or replace a tokenisation correction.
      description: |
        Server emits `parse_override.put` (whole-row last-writer-wins). The token surfaces must
        concatenate exactly to `match_text` (`422` otherwise). `sentence_id` requires
        `media_id`. Scope references are soft and not checked. Putting a deleted id is
        `410 gone` (deletes are permanent; use a new id). Overrides take effect at the next
        parse of the affected media (`POST /media/{id}/reparse`) and immediately in
        `POST /parse` (global ones).
      x-emits-ops: [parse_override.put]
      security:
        - bearerAuth: [write]
        - sessionCookie: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParseOverridePut'}
            examples:
              default:
                value:
                  media_id: 01931f40-3000-7000-8000-000000000e01
                  match_text: 食べかけ
                  tokens: [{surface: 食べ, lemma: 食べる, seq: 1358280}, {surface: かけ, lemma: かける, seq: 1207610}]
                  note: split compound
      responses:
        '200':
          description: The override as stored.
          headers: {Kotobaya-Seq: {$ref: '#/components/headers/Seq'}}
          content:
