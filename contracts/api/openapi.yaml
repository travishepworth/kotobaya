            rejected (`422`), the same rule as `SentenceToken.reading`. Default - derived (PARSER.md 4.4).
          examples:
          - たべ
        class:
          type: string
          enum:
          - content
          - particle
          - auxiliary
          - name
          - other
          description: Optional (C-12). Coverage class for the resulting token, e.g. `name` to hide a name the
            parser missed. Default - derived from the token's POS and `seq` (PARSER.md 2).
          examples:
