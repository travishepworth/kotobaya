      description: Payload of a `deck-build` job (builds the item snapshot of a list deck).
      additionalProperties: false
      required:
      - deck_id
      properties:
        deck_id:
          $ref: '#/components/schemas/Uuid'
          description: The list deck.
    JobResultDictRefresh:
      type: object
      description: Result of a dictionary refresh.
      required:
      - release_id
      - version
      - entries
      - retired
      properties:
        release_id:
          type:
          - integer
          - 'null'
          description: New release id; null when nothing changed and `force` was false.
        version:
          type:
          - string
          - 'null'
          description: New release version.
        entries:
          type: integer
          minimum: 0
          description: Live entries in the current release.
        retired:
          type: integer
          minimum: 0
          description: Entries retired by this release.
    JobResultMedia:
      type: object
      description: Result of a media import, jpdb deck import or parse.
      required:
      - media_id
      - content_version
      - segments
      - sentences
      - tokens
      - unmapped_tokens
      - unique_entries
      - unmapped
      properties:
        media_id:
          $ref: '#/components/schemas/Uuid'
          description: The media.
        content_version:
          type: integer
          minimum: 1
          description: Content version published by this job.
        segments:
          type: integer
          minimum: 0
          description: Segments now in the media.
        sentences:
          type: integer
          minimum: 0
          description: Sentences now in the media.
        tokens:
          type: integer
          minimum: 0
          description: Word tokens.
        unmapped_tokens:
          type: integer
          minimum: 0
          description: Tokens that matched no entry.
        unique_entries:
          type: integer
          minimum: 0
          description: Distinct entries (= deck items).
        unmapped:
          type: array
          description: jpdb deck import only - vocabulary that maps to no JMdict entry and has no stored correction
            (`listJpdbVocab` status `unresolved`), by `occurrence_count` descending then `jpdb_vid`; empty otherwise.
            Items the user marked `ignored` are not listed but their tokens still count in `unmapped_tokens`. Nothing
            is dropped silently (C-11).
          items:
            type: object
            required:
            - jpdb_vid
            - spelling
            - reading
            - occurrence_count
            properties:
              jpdb_vid:
                type: integer
                description: jpdb vocabulary id.
              spelling:
                type: string
                description: Spelling as jpdb gives it.
              reading:
                type: string
                description: Reading as jpdb gives it.
              occurrence_count:
                type: integer
                minimum: 0
                description: Occurrences in the deck.
        parser_version:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional (C-12). The parser build that produced the published tokens (PARSER.md 6). Absent
            until the media content archive header carries it (follow-up for SNAPSHOT.md); always absent for jpdb
            imports.
          examples:
          - kp1;sudachi=full-20250825;dict=2026-11-01.1;worker=0.4.0
    JpdbVocabResolution:
      type: string
      enum: [unresolved, mapped, ignored]
      description: unresolved = in the review queue; mapped = imports map the vid to `entry_seq`; ignored = imports
        keep it unmapped and out of `JobResultMedia.unmapped`.
    JpdbVocabMedia:
      type: object
      description: One live media whose jpdb deck contains the vid.
      required: [media_id, title, occurrence_count]
      properties:
        media_id:
          $ref: '#/components/schemas/Uuid'
          description: The media.
        title:
          type: string
          description: Its title.
        occurrence_count:
          type: integer
          minimum: 0
          description: Occurrences of the vid in that media's jpdb deck, as of its latest import.
    JpdbVocab:
      type: object
      description: A jpdb vocabulary item that the automatic mapper could not map (`app.jpdb_vocab`, C-11).
      required: [jpdb_vid, spelling, reading, resolution, entry_seq, occurrence_total, media, first_seen_at, resolved_at]
      properties:
        jpdb_vid:
          type: integer
          format: int64
          minimum: 1
          description: jpdb vocabulary id.
        spelling:
          type: string
          description: Spelling as jpdb gives it (latest import).
        reading:
          type: string
          description: Reading as jpdb gives it (latest import).
        resolution:
          $ref: '#/components/schemas/JpdbVocabResolution'
        entry_seq:
          oneOf:
          - $ref: '#/components/schemas/EntrySeq'
          - type: 'null'
          description: The JMdict entry it is mapped to; set iff `resolution` is `mapped`.
        occurrence_total:
          type: integer
          minimum: 0
          description: Sum of `media[].occurrence_count` (live media only).
        media:
          type: array
          items:
            $ref: '#/components/schemas/JpdbVocabMedia'
          description: Live media containing it, by `occurrence_count` descending then `media_id`.
        first_seen_at:
          $ref: '#/components/schemas/Timestamp'
          description: When an import first reported it.
        resolved_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When the current resolution was set; null iff unresolved.
    JpdbVocabPage:
      type: object
      description: A page of jpdb vocabulary.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JpdbVocab'
          description: Rows, by `occurrence_total` descending then `jpdb_vid`.
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor of the next page, or null.
    JpdbVocabResolutionPut:
      type: object
      description: A correction. `entry_seq` is required for `mapped` and forbidden for `ignored` (`422`).
      additionalProperties: false
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [mapped, ignored]
          description: What imports do with the vid.
        entry_seq:
          $ref: '#/components/schemas/EntrySeq'
          description: The JMdict entry (`mapped` only); must exist and not be retired.
    JpdbVocabResolutionResult:
      type: object
      description: Outcome of setting or clearing a correction.
      required: [vocab, jobs]
      properties:
        vocab:
          $ref: '#/components/schemas/JpdbVocab'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
          description: One `jpdb-deck-import` re-publish job (`remap_only`) per affected live media - newly enqueued
            or already waiting; empty when nothing changed or no live media contains the vid.
    JobResultJpdbHistory:
      type: object
      description: |-
        Result of a jpdb history import. Every input record is counted in exactly one bucket
        (C-2, C-4; mapping rules on `importJpdbHistory`):
        - rows of the vocab arrays: `vocabulary_total = vocabulary_carded + vocabulary_status_only
          + vocabulary_en_jp_ignored + len(unmapped)`;
        - rows of the kanji arrays: `kanji_total = kanji_carded + len(kanji_unmapped)`;
        - review events of all four arrays: `reviews_total = reviews_imported + reviews_already_imported
          + reviews_skipped + reviews_unknown_grade + status_events_unknown + status_events_known
          + reviews_duplicate_dropped`.
        An event's bucket is the first that applies: (1) its row is a `cards_vocabulary_en_jp` row
        or is unmapped → `reviews_skipped`; (2) malformed → `reviews_unknown_grade`; (3) exact
        duplicate within its group → `reviews_duplicate_dropped`; (4) grade `unknown` →
        `status_events_unknown`; (5) grade `known` → `status_events_known` (whether or not it set a
        word status); (6) any other non-rating grade → `reviews_unknown_grade`; (7) rating with
        `import_reviews = false` → `reviews_skipped`; (8) rating whose review id already exists →
        `reviews_already_imported`; (9) else `reviews_imported`.
        `reviews_id_collisions` (C-9) is not a bucket: it counts the subset of bucket (8) whose id is
        held by a review of a different live card (see "Review id collisions" on
        `importJpdbHistory`), so `reviews_id_collisions <= reviews_already_imported` and the sums
        above are unchanged.
        Rows count rows, not distinct words: rows that repeat a vid are each counted in
        `vocabulary_total` and in their group's bucket (`unmapped` lists each row). `notes_*`,
        `cards_created`, `kanji_notes_*`, `kanji_cards_*` and `word_statuses_set` count what was
        written, not input records. With `import_reviews = true`: `notes_created + notes_existing`
        = distinct seqs of carded vocab groups; `cards_created <= notes_created + notes_existing`;
        `word_statuses_set <=` distinct seqs of status-only groups; `kanji_notes_created +
        kanji_notes_existing` = distinct characters of mapped kanji rows; `kanji_cards_suspended
        <= kanji_cards_created`. An export without kanji arrays reports the kanji counts as 0.
      required:
      - vocabulary_total
      - notes_created
      - notes_existing
      - cards_created
      - reviews_total
      - reviews_imported
      - reviews_already_imported
      - reviews_skipped
      - word_statuses_set
      - unmapped
      - vocabulary_carded
      - vocabulary_status_only
      - kanji_total
      - kanji_carded
      - kanji_notes_created
      - kanji_notes_existing
      - kanji_cards_created
      - kanji_unmapped
      - reviews_unknown_grade
      - status_events_unknown
      - status_events_known
      - reviews_duplicate_dropped
      - vocabulary_en_jp_ignored
      - kanji_cards_suspended
      - reviews_id_collisions
      properties:
        vocabulary_total:
          type: integer
          minimum: 0
          description: Vocabulary records in the export (rows of `cards_vocabulary_jp_en` and `cards_vocabulary_en_jp`).
        vocabulary_carded:
          type: integer
          minimum: 0
          description: Mapped `cards_vocabulary_jp_en` rows whose group (rows sharing the mapped seq) is carded - it
            has at least one kept non-`known` event, or no well-formed events; the group's note has a `meaning`
            card after the run (unless `import_reviews` is false). One note and one card per group, not per row.
        vocabulary_status_only:
          type: integer
          minimum: 0
          description: Mapped `cards_vocabulary_jp_en` rows whose group's kept well-formed events are all `known`
            (at least one); the word gets status `known` (unless it already has an override or
            `import_word_status` is false), no note or card.
        vocabulary_en_jp_ignored:
          type: integer
          minimum: 0
          description: Rows of `cards_vocabulary_en_jp` (C-4). Never mapped, never listed in `unmapped`; no note,
            card, status or review; their events count as `reviews_skipped`. Added by C-4.
          examples:
          - 0
        kanji_total:
          type: integer
          minimum: 0
          description: Kanji records in the export (rows of `cards_kanji_char_keyword` and `cards_kanji_keyword_char`).
        kanji_carded:
          type: integer
          minimum: 0
          description: Kanji rows mapped to a kanji note and a card of kind `keyword` (char → keyword) or `writing`
            (keyword → char), known-only rows included. `writing` cards and known-only cards are created suspended.
        kanji_notes_created:
          type: integer
          minimum: 0
          description: Kanji notes created (one per character, shared by both arrays).
        kanji_notes_existing:
          type: integer
          minimum: 0
          description: Distinct characters that already had a live kanji note.
        kanji_cards_created:
          type: integer
          minimum: 0
          description: Kanji cards created (one per (character, kind) without a live card), suspended ones included.
        kanji_cards_suspended:
          type: integer
          minimum: 0
          description: Of `kanji_cards_created`, those created with `suspended = true` - every created `writing`
            card plus created `keyword` cards of known-only groups. Existing cards are never counted or changed.
            Added by C-4.
          examples:
          - 874
        reviews_id_collisions:
          type: integer
          minimum: 0
          description: Of `reviews_already_imported`, the rating events not emitted because their review id is held
            by a review of a different live card (one vid text-mapped to two seqs, or two vid-less rows, with
            identical `timestamp`, `grade` and `occ`; see "Review id collisions" on `importJpdbHistory`). Counted so
            they are not silently dropped; not a separate bucket, the sums are unchanged. Expected 0. Added by C-9.
          examples:
          - 0
        kanji_unmapped:
          type: array
          description: Kanji rows whose `character` is not exactly one Unicode code point. Their events count as
            `reviews_skipped`.
          items:
            type: object
            required:
            - character
            - card_kind
            - review_count
            properties:
              character:
                type: string
                description: The `character` value as given.
              card_kind:
                type: string
                enum:
                - keyword
                - writing
                description: '`keyword` for `cards_kanji_char_keyword`, `writing` for `cards_kanji_keyword_char`.'
              review_count:
                type: integer
                minimum: 0
                description: Events this record had.
        reviews_unknown_grade:
          type: integer
          minimum: 0
          description: Events of a mapped row that are malformed (not an object with an integer `timestamp` and a
            string `grade`) or whose `grade` is none of the known grades; nothing is written for them.
        status_events_unknown:
          type: integer
          minimum: 0
          description: '`unknown` events of mapped rows, duplicates excluded (card creation only, no review).'
        status_events_known:
          type: integer
          minimum: 0
          description: '`known` events of mapped rows, duplicates excluded, never a review. All of them count here: those
            of status-only vocab groups (which may set a word status), those of carded vocab groups (ignored; FSRS
            schedules from the reviews) and those of kanji groups (a known-only kanji card is created suspended).'
        reviews_duplicate_dropped:
          type: integer
          minimum: 0
          description: Events of mapped rows dropped as exact duplicates - same `timestamp` and `grade` as an earlier
            event of the same group (vocab - rows sharing a seq; kanji - rows sharing character and card kind). Any
            grade, status events included. Added by C-4.
          examples:
          - 3
        notes_created:
          type: integer
          minimum: 0
          description: Vocabulary notes created, one per carded group (distinct seq), not per row (kanji notes are
            `kanji_notes_created`).
        notes_existing:
          type: integer
          minimum: 0
          description: Carded vocabulary groups (distinct seqs) that already had a live note (kanji -
            `kanji_notes_existing`).
        cards_created:
          type: integer
          minimum: 0
          description: Vocabulary `meaning` cards created, at most one per carded group, so about equal to
            `notes_created` (kanji cards are `kanji_cards_created`).
        reviews_total:
          type: integer
          minimum: 0
          description: Review events in the export (every element of every row's `reviews[]`, all four arrays,
            status events included).
        reviews_imported:
          type: integer
          minimum: 0
          description: Reviews logged by this run.
        reviews_already_imported:
          type: integer
          minimum: 0
          description: Reviews skipped because an earlier run imported them.
        reviews_skipped:
          type: integer
          minimum: 0
          description: Events of unmapped rows (`unmapped`, `kanji_unmapped`) and of `cards_vocabulary_en_jp` rows (any
            grade), and rating events when `import_reviews` is false.
        word_statuses_set:
          type: integer
          minimum: 0
          description: Overrides written (`word.status_set` ops emitted), at most one per status-only vocab group.
        unmapped:
          type: array
          description: '`cards_vocabulary_jp_en` rows that map to no JMdict entry, one element per row.'
          items:
            type: object
            required:
            - jpdb_vid
            - spelling
            - reading
            - review_count
            properties:
              jpdb_vid:
                type: integer
                description: jpdb vocabulary id.
              spelling:
                type: string
                description: Spelling.
              reading:
                type: string
                description: Reading.
              review_count:
                type: integer
                minimum: 0
                description: Reviews this record had.
    JobResultFsrsOptimize:
      type: object
      description: Result of an optimizer run.
      required:
      - preset_id
      - published
      - weights_version
      - review_count
      - log_loss
      - rmse_bins
      properties:
        preset_id:
          $ref: '#/components/schemas/Uuid'
          description: The preset.
        published:
          type: boolean
          description: false when there were too few reviews or the new weights were not better; the preset is then
            unchanged.
        weights_version:
          type: integer
          minimum: 0
          description: The preset's `weights_version` after the run.
        review_count:
          type: integer
          minimum: 0
          description: Reviews used.
        log_loss:
          type:
          - number
          - 'null'
          description: Log loss of the new weights.
        rmse_bins:
          type:
          - number
          - 'null'
          description: RMSE (bins) of the new weights.
    JobResultTts:
      type: object
      description: Result of a TTS job.
      required:
      - blob_hash
      - content_type
      - duration_ms
      properties:
        blob_hash:
          $ref: '#/components/schemas/BlobHash'
          description: The synthesized audio.
        content_type:
          type: string
          description: Media type of the audio.
          examples:
          - audio/ogg
        duration_ms:
          type: integer
          minimum: 0
          description: Length of the audio.
    JobResultDeckBuild:
      type: object
      description: Result of a deck build.
      required:
      - deck_id
      - content_version
      - items
      properties:
        deck_id:
          $ref: '#/components/schemas/Uuid'
          description: The deck.
        content_version:
          type: integer
          minimum: 1
          description: Content version published.
        items:
          type: integer
          minimum: 0
          description: Items in the snapshot.
    JobResultGrammarDetect:
      description: Result of a `grammar-detect` job (C-13). Per-media jobs (payload has `media_id`) report
        `JobResultGrammarDetectMedia`; fan-out jobs (payload `{}`) report `JobResultGrammarDetectFanOut`.
      oneOf:
      - $ref: '#/components/schemas/JobResultGrammarDetectMedia'
      - $ref: '#/components/schemas/JobResultGrammarDetectFanOut'
    JobResultGrammarDetectMedia:
      type: object
      description: |
        Result of a per-media `grammar-detect` job. Three shapes:
        - published: `changed: true`, `content_version` = the version this job published,
          `spans`, `invalid_rules`;
        - nothing to do: `changed: false`, `content_version` = the media's current version
          (detected spans already equal the computed ones), `spans`, `invalid_rules`;
        - skipped: `changed: false`, `skipped` set, no `content_version`, `spans` or
          `invalid_rules`.
        A retry whose earlier attempt already published (MEDIA_PIPELINE.md 3.2 step 1) reports
        `changed: true` and `content_version` only.
      additionalProperties: false
      required:
      - media_id
      - changed
      properties:
        media_id:
          $ref: '#/components/schemas/Uuid'
          description: The media.
        changed:
          type: boolean
          description: True iff this job published a new content version.
        content_version:
          type: integer
          minimum: 1
          description: Published version (`changed`), else the media's current version. Absent iff `skipped`.
          examples:
          - 4
        spans:
          type: integer
          minimum: 0
          description: Detected spans the media carries after this job (manual spans not counted).
          examples:
          - 37
        invalid_rules:
          type: integer
          minimum: 0
          description: Non-draft rules of live grammar points that failed to compile and were ignored (each is
            logged with its grammar point id and rule index).
          examples:
          - 0
        skipped:
          type: string
          enum:
          - unknown_media
          - media_deleted
          - not_applicable
          - not_parsed
          description: Why nothing was detected - no such media; media tombstoned; `source = jpdb` (no
            sentences); `content_version = 0` or no segments. Present iff skipped.
    JobResultGrammarDetectFanOut:
      type: object
      description: Result of a fan-out `grammar-detect` job.
      additionalProperties: false
      required:
      - media
      - enqueued
      - rules_digest
      properties:
        media:
          type: integer
          minimum: 0
          description: Eligible media (live, `content_version > 0`, `source` not `jpdb`).
          examples:
          - 120
        enqueued:
          type: integer
          minimum: 0
          description: Per-media jobs actually inserted (`<= media`); the rest collapsed into an identical
            queued or running job (same dedupe key).
          examples:
          - 118
        rules_digest:
          type: string
          minLength: 1
          maxLength: 200
          description: Opaque worker-defined digest of the live points' detection rules read by this job; compare
            for equality only. Part of the per-media dedupe keys.
          examples:
          - 3f1c9a0e7b42d8e5
    TtsRequest:
      type: object
      description: Text to synthesize. Also the payload of `tts` jobs.
      additionalProperties: false
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Japanese text (plain, no HTML).
          examples:
          - パンを食べる
        voice:
          type: string
          maxLength: 100
          description: VOICEVOX speaker id or name. Default - the setting `tts.voice`, else the server default.
          examples:
          - '3'
    Blob:
      type: object
      description: Metadata of a blob (`app.blob`).
      required:
      - hash
      - size_bytes
      - content_type
      - kind
      - origin
      - created_at
      properties:
        hash:
          $ref: '#/components/schemas/BlobHash'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Size.
          examples:
          - 48213
        content_type:
          type: string
          description: Stored media type.
          examples:
          - audio/ogg
        kind:
          type: string
          enum:
          - audio
          - image
          - upload
          - snapshot
          description: What the blob is.
        origin:
          type: string
          enum:
          - upload
          - clip
          - tts
          - cover
          - build
          description: Where it came from.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When it was stored.
    BlobQuery:
      type: object
      description: Hashes to look up.
      additionalProperties: false
      required:
      - hashes
      properties:
        hashes:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/BlobHash'
          description: Blob hashes.
    BlobQueryResult:
      type: object
      description: Which blobs exist.
      required:
      - present
      - missing
      properties:
        present:
          type: array
          items:
            $ref: '#/components/schemas/BlobHash'
          description: Hashes the server has.
        missing:
          type: array
          items:
            $ref: '#/components/schemas/BlobHash'
          description: Hashes it does not have.
    ExportDump:
      type: object
      description: Full data dump.
      required:
      - format_version
      - exported_at
      - server_version
      - high_water_seq
      - dict_release_version
      - tables
      properties:
        format_version:
          type: integer
          enum:
          - 1
          description: Version of this dump format.
        exported_at:
          $ref: '#/components/schemas/Timestamp'
          description: Snapshot time.
        server_version:
          type: string
          description: Server build version.
          examples:
          - 0.1.0
        high_water_seq:
          type: integer
          format: int64
          minimum: 0
          description: Sync head of the snapshot.
        dict_release_version:
          type:
          - string
          - 'null'
          description: Dictionary release the entry references belong to.
        tables:
          type: object
          description: 'Rows per table, keyed by table name without schema: `note_type`, `note`, `card`, `review_log`,
            `word_status`, `deck`, `deck_item`, `confusable`, `grammar_point`, `sentence_grammar_span` (manual rows),
            `settings`, `fsrs_params`, `media`, `parse_override`; with `include=media_content` also `media_segment`,
            `sentence`, `occurrence` and the detected rows of `sentence_grammar_span`. Each row is an object keyed
            by column name. Row order: primary key ascending.'
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
    Event:
      type: object
      description: One event, as the JSON of an SSE `data:` line and as an ntfy message body.
      required:
      - type
      - at
      - data
      properties:
        type:
          $ref: '#/components/schemas/EventType'
        at:
          $ref: '#/components/schemas/Timestamp'
          description: When the event was produced.
        data:
          type: object
          additionalProperties: true
          description: Payload; schema by `type` (table on `GET /events`).
    EventHello:
