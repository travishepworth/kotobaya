        name:
          type: string
          description: Audit name.
          examples:
          - coverage-script
        kind:
          $ref: '#/components/schemas/TokenKind'
        token_prefix:
          type: string
          description: First 8 characters of the token string.
          examples:
          - kbp_Zx81
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: Scopes held.
        device_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Bound device, or null.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time.
        expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Expiry, or null for never.
        last_used_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Last authenticated request (updated at most once a minute).
        revoked_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Set when revoked.
        active:
          type: boolean
          description: Derived - valid right now (not revoked, not expired, device not revoked).
    TokenList:
      type: object
