            $ref: '#/components/schemas/CardTemplate'
        css:
          type: string
          maxLength: 100000
          description: Extra CSS.
    DictEntrySummary:
      type: object
      description: Short form of a dictionary entry with the caller's overlay.
      required:
      - seq
      - headword
      - headword_reading
      - is_common
      - glosses
      - pos
      - freq_rank
      - retired
      - status
      - note_id
      properties:
        seq:
          $ref: '#/components/schemas/EntrySeq'
        headword:
          type: string
          description: First kanji form, or first reading for kana-only entries.
          examples:
          - 食べる
        headword_reading:
          type: string
          description: First reading.
          examples:
          - たべる
        is_common:
          type: boolean
          description: JMdict "common" marker.
        glosses:
          type: array
          items:
            type: string
          description: English glosses of the first sense, in order.
          examples:
          - - to eat
        pos:
          type: array
          items:
            type: string
          description: Union of JMdict part-of-speech tags.
          examples:
          - - v1
            - vt
        freq_rank:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Rank in the primary frequency list, or null.
          examples:
          - 312
        retired:
          type: boolean
          description: The entry is no longer in JMdict.
        status:
          $ref: '#/components/schemas/WordStatusValue'
          description: Your effective word status (`new` when there is no row).
        note_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Your live vocab note for this entry, or null.
    DictEntrySummaryPage:
      type: object
      description: A page of entry summaries.
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DictEntrySummary'
          description: Entries in result order.
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor of the next page, or null.
    DictEntry:
      type: object
      description: A full JMdict entry (`ref.dict_entry` and its satellites) with the caller's overlay.
      required:
      - seq
      - language
      - headword
      - headword_reading
      - is_common
      - kanji_forms
      - readings
      - senses
      - pos
      - misc
      - freq_rank
      - retired
      - freqs
      - pitch
      - kanji
      - status
      - note_id
      properties:
        seq:
          $ref: '#/components/schemas/EntrySeq'
        language:
          type: string
          description: BCP 47 tag; always `ja` in v1.
          examples:
          - ja
        headword:
          type: string
          description: Display form.
          examples:
          - 食べる
        headword_reading:
          type: string
          description: First reading.
          examples:
          - たべる
        is_common:
          type: boolean
          description: JMdict "common" marker.
        kanji_forms:
          type: array
          description: Kanji forms in JMdict order; empty for kana-only entries.
          items:
            type: object
            required:
            - text
            - common
            - tags
            properties:
              text:
                type: string
                description: The form.
                examples:
                - 食べる
              common:
                type: boolean
                description: Common marker.
              tags:
                type: array
                items:
                  type: string
                description: JMdict ke_inf tags.
        readings:
          type: array
          description: Readings in JMdict order (at least one).
          items:
            type: object
            required:
            - text
            - common
            - tags
            - applies_to
            properties:
              text:
                type: string
                description: Kana reading.
                examples:
                - たべる
              common:
                type: boolean
                description: Common marker.
              tags:
                type: array
                items:
                  type: string
                description: JMdict re_inf tags.
              applies_to:
                type: array
                items:
                  type: string
                description: Kanji forms the reading applies to, or `["*"]`.
        senses:
          type: array
          description: Senses in JMdict order.
          items:
            type: object
            required:
            - pos
            - misc
            - field
            - dialect
            - info
            - applies_to_kanji
            - applies_to_kana
            - gloss
            - xref
            properties:
              pos:
                type: array
                items:
                  type: string
                description: Part-of-speech tags.
              misc:
                type: array
                items:
                  type: string
                description: Misc tags.
              field:
                type: array
                items:
                  type: string
                description: Field tags.
              dialect:
                type: array
                items:
                  type: string
                description: Dialect tags.
              info:
                type: array
                items:
                  type: string
                description: Sense notes.
              applies_to_kanji:
                type: array
                items:
                  type: string
                description: Kanji forms the sense is restricted to, or `["*"]`.
              applies_to_kana:
                type: array
                items:
                  type: string
                description: Readings the sense is restricted to, or `["*"]`.
              gloss:
                type: array
                description: Glosses.
                items:
                  type: object
                  required:
                  - lang
                  - text
                  properties:
                    lang:
                      type: string
                      description: ISO 639-2 code.
                      examples:
                      - eng
                    text:
                      type: string
                      description: The gloss.
                      examples:
                      - to eat
              xref:
                type: array
                items:
                  type: string
                description: Cross-references as JMdict gives them.
        pos:
          type: array
          items:
            type: string
          description: Union of part-of-speech tags over all senses.
        misc:
          type: array
          items:
            type: string
          description: Union of misc tags over all senses.
        freq_rank:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Rank in the primary frequency list.
        retired:
          type: boolean
          description: The entry is no longer in JMdict (still resolvable, excluded from search).
        freqs:
          type: array
          description: Rank per loaded frequency list, ordered by the list's priority.
          items:
            type: object
            required:
            - list_id
            - rank
            properties:
              list_id:
                type: string
                description: Frequency list slug.
                examples:
                - jpdb
              rank:
                type: integer
                minimum: 1
                description: 1 = most frequent.
                examples:
                - 312
        pitch:
          type: array
          description: Pitch accent per reading (Kanjium); empty when unknown.
          items:
            type: object
            required:
            - reading
            - positions
            properties:
              reading:
                type: string
                description: Kana reading.
                examples:
                - たべる
              positions:
                type: array
                items:
                  type: integer
                  minimum: 0
                description: Downstep mora positions, most common first; 0 = heiban.
                examples:
                - - 2
        kanji:
          type: array
          items:
            type: string
          description: Distinct kanji in the entry's kanji forms, in order of first appearance.
          examples:
          - - 食
        status:
          $ref: '#/components/schemas/WordStatusValue'
          description: Your effective word status.
        note_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Your live vocab note for this entry, or null.
    TatoebaSentence:
      type: object
      description: A Tatoeba sentence pair (`ref.example_sentence`, CC BY 2.0 FR).
      required:
      - id
      - text
      - translation
      properties:
        id:
          type: integer
          format: int64
          description: Tatoeba id of the Japanese sentence.
          examples:
          - 4751
        text:
          type: string
          description: Japanese text.
          examples:
          - 彼はパンを食べる。
        translation:
          type: string
          description: English translation; empty if none.
          examples:
          - He eats bread.
    EntryExamples:
      type: object
      description: Example sentences for an entry.
      required:
      - media
      - tatoeba
      properties:
        media:
          type: array
          items:
            $ref: '#/components/schemas/Sentence'
          description: Sentences from your media.
        tatoeba:
          type: array
          items:
            $ref: '#/components/schemas/TatoebaSentence'
          description: Tatoeba pairs.
    DictRelease:
      type: object
      description: The current dictionary release (`ref.dict_release`). The artifact formats
        (zstd SQLite package, `kotobaya-dict-diff` diff), what `blob_hash` covers and how a device
        installs or updates are defined in `contracts/db/DICT_PACKAGE.md`.
      required:
      - id
      - version
      - built_at
      - loaded_at
      - sources
      - freq_lists
      - artifacts
      properties:
        id:
          type: integer
          minimum: 1
          description: Release number; higher = newer.
          examples:
          - 3
        version:
          type: string
          description: Human-readable version.
          examples:
          - 2026.11.0
        built_at:
          $ref: '#/components/schemas/Timestamp'
          description: Build time.
        loaded_at:
          $ref: '#/components/schemas/Timestamp'
          description: When it was loaded into Postgres.
        sources:
          type: object
          description: 'Provenance per source for the attribution page: `{"jmdict": {"version", "license", "url"},
            ...}`.'
          additionalProperties: true
        freq_lists:
          type: array
          description: Loaded frequency lists by priority (0 = primary).
          items:
            type: object
            required:
            - id
            - title
            - priority
            - entry_count
            properties:
              id:
                type: string
                description: Slug.
                examples:
                - jpdb
              title:
                type: string
                description: Display title.
                examples:
                - jpdb frequency
              priority:
                type: integer
                minimum: 0
                description: 0 = primary list.
              entry_count:
                type: integer
                minimum: 0
                description: Entries ranked by the list.
        artifacts:
          type: array
          description: Downloadable device builds of this release.
          items:
            type: object
            required:
            - kind
            - scope
            - from_release
            - blob_hash
            - size_bytes
            - format_version
            - uncompressed_size_bytes
            properties:
              kind:
                type: string
                enum:
                - full
                - diff
                description: Full build or diff from an older release.
              scope:
                type: string
                enum:
                - top60k
                - all
                description: Which entries the build holds.
              from_release:
                type:
                - integer
                - 'null'
                description: For `diff` - the release id it upgrades from; null for `full`.
              blob_hash:
                $ref: '#/components/schemas/BlobHash'
              size_bytes:
                type: integer
                format: int64
                minimum: 0
                description: Size of the blob (compressed bytes, as served by `GET /blobs/{hash}`).
              format_version:
                type: integer
                minimum: 1
                description: For `full` - the package's `PRAGMA user_version`; for `diff` - the
                  `kotobaya-dict-diff` `format_version`. Currently 1. Devices skip artifacts whose
                  version they do not support (`contracts/db/DICT_PACKAGE.md` 5-6).
                examples:
                - 1
              uncompressed_size_bytes:
                type: integer
                format: int64
                minimum: 0
                description: Size after zstd decompression, for the device's free-space check.
                examples:
                - 412090368
    Kanji:
