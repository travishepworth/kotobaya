    Job:
      type: object
      description: |
        A background job (`app.job`). `payload` and `result` depend on `kind`:

        | `kind` | `payload` schema | `result` schema (when `succeeded`) |
        |---|---|---|
        | `dict-refresh` | `JobPayloadDictRefresh` | `JobResultDictRefresh` |
        | `media-import` | `MediaImportRequest` (with `media_id`) | `JobResultMedia` |
        | `media-parse` | `JobPayloadMediaParse` | `JobResultMedia` |
        | `jpdb-deck-import` | `JpdbDeckImportRequest` (with `media_id`; `remap_only` for correction re-publishes) | `JobResultMedia` |
        | `jpdb-history-import` | `JpdbHistoryImportRequest` | `JobResultJpdbHistory` |
        | `fsrs-optimize` | `JobPayloadFsrsOptimize` | `JobResultFsrsOptimize` |
        | `tts` | `TtsRequest` | `JobResultTts` |
        | `deck-build` | `JobPayloadDeckBuild` | `JobResultDeckBuild` |
        | `grammar-detect` | `JobPayloadGrammarDetect` | `JobResultGrammarDetect` |

        **`grammar-detect` (C-13).** Re-runs grammar detection over stored tokens; never
        re-parses. Not started through the API: the server enqueues a fan-out (`{}`) when a
        `detection_rules` register changes, and the fan-out enqueues one per-media job
        (`{"media_id"}`) per eligible media. A per-media job that finds new spans republishes
        the media through `media-publish` (a new `content_version`, same tokens, `parse_status`
        unchanged). It is an ordinary public job (listed, streamed, cancellable) but is never
        forwarded to ntfy. Normative protocol: `contracts/db/SCHEMA.md`, "Jobs", "`grammar-detect`".

        **Server-internal jobs (C-9).** An `app.job` row whose `kind` is not a `JobKind` value
        is *server-internal*: a hand-off between the worker and the server inside one public
        job (its *parent*). The registered internal kinds are listed in
        `contracts/db/SCHEMA.md` ("Jobs"): `jpdb-history-apply` (see `importJpdbHistory`,
        "Execution") and `media-publish` (C-11; parents `media-import`, `media-parse`,
        `jpdb-deck-import`, and `grammar-detect` (C-13); `contracts/db/MEDIA_PIPELINE.md` 3). Rules:
        - The API never exposes an internal row: `listJobs` skips it (also for `limit` and
          cursor arithmetic: pages are built from public rows only), `getJob` and `cancelJob`
          answer `404 not_found` for its id, and `streamEvents` never sends a `job.updated`
          (nor an ntfy push) whose job is internal. It is visible only through its parent:
          the parent's `status`, `progress`, `progress_message`, `result` and `error`
          reflect it as the parent kind documents.
        - An internal kind is never added to `JobKind` and never named like one; a new one is
          added to the SCHEMA.md list by a contract ticket (additive: no column or `CHECK`
          changes, `app.job.kind` already accepts any slug).
        - The worker never claims an internal kind (it claims only kinds it registered); the
          server's runner for that kind is the only claimer. Cancelling the parent cancels
          the child (the child's runner checks the parent before work and between batches).
      required:
      - id
      - kind
      - status
      - payload
      - result
      - progress
      - progress_message
      - error
      - attempts
      - max_attempts
      - created_at
      - started_at
      - finished_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Job id (server-generated UUIDv7).
        kind:
          $ref: '#/components/schemas/JobKind'
        status:
          $ref: '#/components/schemas/JobStatus'
        payload:
          type: object
          additionalProperties: true
          description: Input of the job; schema by `kind`.
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Output when `succeeded` (schema by `kind`); may hold partial counts when `failed` or `cancelled`;
            null before.
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction done; 1 when succeeded.
          examples:
          - 0.42
        progress_message:
          type:
          - string
          - 'null'
          description: Short human-readable stage, e.g. `parsing ep02.srt (2/12)`.
        error:
          type:
          - string
          - 'null'
          description: Error text of the last failed attempt.
        attempts:
          type: integer
          minimum: 0
          description: Attempts started so far.
        max_attempts:
          type: integer
          minimum: 1
          description: Attempts allowed before the job is `failed`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When it was queued.
        started_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Start of the current or last attempt.
        finished_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Set iff the status is terminal.
    JobPage:
      type: object
      description: A page of jobs.
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
          description: Jobs, newest first.
        next_cursor:
          type:
          - string
