        - sessionCookie: [read]
      responses:
        '200':
          description: The sentence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sentence'}
              examples: {default: {$ref: '#/components/examples/Sentence'}}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}

