      - title
      - item_count
      - deck_id
      properties:
        list_key:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]*$
          description: Stable slug.
          examples:
          - jlpt-n3
        title:
          type: string
          description: Display title; default deck name.
          examples:
          - JLPT N3
        item_count:
          type: integer
          minimum: 0
          description: Entries in the list for the current dictionary release.
          examples:
          - 3750
        deck_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: The live deck for this key, or null if not enabled.
    DeckListCatalogue:
      type: object
      description: Available generated lists.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeckListCatalogueEntry'
          description: Lists ordered by key.
    DeckSettings:
      type: object
      description: Open settings object of a deck; each key is its own last-writer-wins register. Unknown keys are
        preserved.
      additionalProperties: true
      properties:
        order:
          type: string
          enum:
          - deck_frequency
          - global_frequency
          - position
          - chronological
          description: New-card order inside the deck. Default `deck_frequency` for media decks, `position` otherwise.
        add_kanji:
          type: string
          enum:
          - 'off'
          - before
          - alongside
          description: Whether adding a vocab card also adds cards for its unlearned kanji.
        card_kinds:
          type: array
          items:
            type: string
          description: Card kinds to create for notes added from this deck, overriding note-type defaults.
    Deck:
      type: object
      description: A deck (`app.deck`).
      required:
      - id
      - name
      - type
      - language
      - priority
      - enabled
      - new_cards_per_day
      - reviews_per_day
      - settings
      - media_id
      - list_key
      - query
      - content_version
      - content_blob_hash
      - item_count
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Deck id; equals `media_id` for media decks.
        name:
          type: string
          minLength: 1
          description: Display name (not unique).
          examples:
          - 葬送のフリーレン
        type:
          $ref: '#/components/schemas/DeckType'
        language:
          type: string
          description: BCP 47; always `ja` in v1.
          examples:
          - ja
        priority:
          type: integer
          description: New cards are drawn from enabled decks in ascending `(priority, id)`.
          examples:
          - 5
        enabled:
          type: boolean
          description: false = supplies no new cards (coverage still shown).
        new_cards_per_day:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Per-deck daily new-card limit; null = only the global limit.
        reviews_per_day:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Per-deck daily review limit; null = only the global limit.
        settings:
          $ref: '#/components/schemas/DeckSettings'
        media_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Set iff `type` is `media`.
        list_key:
          type:
          - string
          - 'null'
          description: Set iff `type` is `list`.
          examples:
          - jlpt-n3
        query:
          type:
          - string
          - 'null'
          description: Set iff `type` is `smart` - the saved card search string.
        content_version:
          type: integer
          minimum: 0
          description: Version of the server-generated item set (media/list decks); 0 = none yet or not applicable.
        content_blob_hash:
          oneOf:
          - $ref: '#/components/schemas/BlobHash'
          - type: 'null'
          description: Snapshot blob of the items for `content_version`.
        item_count:
          type: integer
          minimum: 0
          description: Derived - number of live items (0 for smart decks).
          examples:
          - 2143
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Last change.
        deleted_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Tombstone.
    DeckList:
      type: object
      description: Decks.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
          description: Decks in new-card priority order.
    DeckCreate:
      type: object
      description: New deck. Which properties are allowed depends on `type` (see `POST /decks`).
      additionalProperties: false
      required:
      - type
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Optional client-generated UUIDv7 (idempotent creation).
        type:
          type: string
          enum:
          - user
          - smart
          - list
          description: Deck type. Media decks cannot be created here.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name; required for `user` and `smart`.
        priority:
          type: integer
          minimum: -1000000
          maximum: 1000000
          default: 0
          description: New-card priority (lower first).
        enabled:
          type: boolean
          default: true
          description: Whether the deck supplies new cards.
        new_cards_per_day:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9999
          description: Per-deck new-card limit.
        reviews_per_day:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 99999
          description: Per-deck review limit.
        settings:
          $ref: '#/components/schemas/DeckSettings'
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: '`smart` only (required) - card search string.'
        list_key:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]*$
          description: '`list` only (required) - a key from `GET /deck-lists`.'
    DeckPatch:
      type: object
      description: Changes to a deck. At least one property.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name.
        priority:
          type: integer
          minimum: -1000000
          maximum: 1000000
          description: New-card priority.
        enabled:
          type: boolean
          description: Whether the deck supplies new cards.
        new_cards_per_day:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9999
          description: Per-deck new-card limit; null removes it.
        reviews_per_day:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 99999
          description: Per-deck review limit; null removes it.
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: Smart decks only - new search string.
        settings:
          type: object
          minProperties: 1
          additionalProperties: true
          description: Settings keys to write (partial map); a null value removes the key. Known keys as in `DeckSettings`.
    DeckItem:
      type: object
      description: An item of a deck (`app.deck_item`) with dictionary summary and status.
      required:
      - deck_id
      - item_key
      - entry_seq
      - note_id
      - position
      - occurrence_count
      - added_at
      - entry
      - status
      properties:
        deck_id:
          $ref: '#/components/schemas/Uuid'
          description: The deck.
        item_key:
          type: string
          description: '`e:<entry_seq>` or `n:<note id>`.'
          examples:
          - e:1358280
        entry_seq:
          oneOf:
          - $ref: '#/components/schemas/EntrySeq'
          - type: 'null'
          description: Entry; exactly one of `entry_seq` and `note_id` is set.
        note_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Note without a dictionary entry (merge losers resolved to the survivor).
        position:
          type: integer
          format: int64
          description: Ascending new-card order; for media decks the rank by in-deck frequency.
          examples:
          - 1024
        occurrence_count:
          type: integer
          minimum: 0
          description: Occurrences in the deck's media; 0 for non-media decks.
          examples:
          - 87
        added_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the item was added.
        entry:
          oneOf:
          - $ref: '#/components/schemas/DictEntrySummary'
          - type: 'null'
          description: Dictionary summary; null for note items and entries missing from the dictionary.
        status:
          oneOf:
          - $ref: '#/components/schemas/WordStatusValue'
          - type: 'null'
          description: Effective word status of the entry; null for note items.
    DeckItemPage:
      type: object
      description: A page of deck items.
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeckItem'
          description: Items in the requested order.
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor of the next page, or null.
    DeckItemList:
      type: object
      description: Deck items (unpaginated).
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeckItem'
          description: Items.
    DeckItemPut:
      type: object
      description: Optional placement of an item.
      additionalProperties: false
      properties:
        position:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Position to store. Absent - append (new item) or keep (existing live item).
    DeckItemsAdd:
      type: object
      description: Items to add to a user deck.
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          description: Items in the order to append them.
          items:
            type: object
            description: Exactly one of `entry_seq` and `note_id`.
            additionalProperties: false
            properties:
              entry_seq:
                $ref: '#/components/schemas/EntrySeq'
                description: A dictionary entry.
              note_id:
                $ref: '#/components/schemas/Uuid'
                description: A note.
              position:
                type: integer
                format: int64
                description: Explicit position.
    CoverageCounts:
      type: object
      description: Counts split by word status.
      required:
      - total
      - known
      - learning
      - unknown
      properties:
        total:
          type: integer
          minimum: 0
          description: '`known + learning + unknown` (plus `unmapped` for token counts).'
        known:
          type: integer
          minimum: 0
          description: Status `known` or `never_forget`.
        learning:
          type: integer
          minimum: 0
          description: Status `learning`.
        unknown:
          type: integer
          minimum: 0
          description: Status `new`; also `blacklisted`/`ignored` when `ignored` is not hidden.
    Coverage:
      type: object
      description: |
        Coverage numbers. Entries are classified by effective word status after removing the
        classes named in `hide`. `unique` counts distinct entries; `tokens` weights each entry by
        its occurrence count and is the number that predicts comprehension.
      required:
      - deck_id
      - segment_id
      - hide
      - unique
      - tokens
      - ignored_count
      - curve
      - segments
      - difficulty
      - computed_at
      properties:
        deck_id:
          $ref: '#/components/schemas/Uuid'
          description: The deck measured (equals the media id for media).
        segment_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: The segment measured, or null for the whole deck or media.
        hide:
          type: array
          items:
            type: string
            enum:
            - names
            - particles
            - auxiliary
            - ignored
            - unmapped
          description: Classes that were left out.
        unique:
          $ref: '#/components/schemas/CoverageCounts'
          description: Distinct entries.
        tokens:
          type: object
          description: Occurrence-weighted counts.
          required:
          - total
          - known
          - learning
          - unknown
          - unmapped
          - known_pct
          properties:
            total:
              type: integer
              minimum: 0
              description: '`known + learning + unknown + unmapped`.'
              examples:
              - 48210
            known:
              type: integer
              minimum: 0
              description: Tokens of known entries.
              examples:
              - 41000
            learning:
              type: integer
              minimum: 0
              description: Tokens of learning entries.
              examples:
              - 2100
            unknown:
              type: integer
              minimum: 0
              description: Tokens of unknown entries.
              examples:
              - 4310
            unmapped:
              type: integer
              minimum: 0
              description: Tokens that matched no entry (0 when `unmapped` is hidden).
              examples:
              - 800
            known_pct:
              type: number
              minimum: 0
              maximum: 100
              description: '`known / total * 100`, rounded to 2 decimals; 0 when `total` is 0.'
              examples:
              - 85.04
        ignored_count:
          type: integer
          minimum: 0
          description: Distinct entries with status `blacklisted` or `ignored` (reported whether hidden or not).
          examples:
          - 12
        curve:
          type: array
          description: '"Learn the top N unknown words to reach X%": points for N = 0, 10, 20, 50, 100, 200, 500,
            1000, 2000, 5000 (those below the number of unknown entries) and a final point for all of them. Unknown
            entries are taken in descending occurrence count, ties by `seq`.'
          items:
            type: object
            required:
            - words
            - known_pct
            properties:
              words:
                type: integer
                minimum: 0
                description: Number of top unknown words learned.
                examples:
                - 100
              known_pct:
                type: number
                minimum: 0
                maximum: 100
                description: Token coverage after learning them.
                examples:
                - 89.3
        segments:
          type: array
          description: Per-segment summary in `ordinal` order (empty for non-media decks).
          items:
            type: object
            required:
            - segment_id
            - ordinal
            - title
            - unique_total
            - unique_unknown
            - token_total
            - known_pct
            properties:
              segment_id:
                $ref: '#/components/schemas/Uuid'
                description: Segment id.
              ordinal:
                type: integer
                minimum: 0
                description: 0-based order within the media.
              title:
                type: string
                description: Segment title.
                examples:
                - 第1話
              unique_total:
                type: integer
                minimum: 0
                description: Distinct entries in the segment.
              unique_unknown:
                type: integer
                minimum: 0
                description: Of those, unknown.
              token_total:
                type: integer
                minimum: 0
                description: Tokens in the segment.
              known_pct:
                type: number
                minimum: 0
                maximum: 100
                description: Token coverage of the segment.
        difficulty:
          description: Difficulty estimate relative to your other parsed media; null for non-media decks, for single
            segments and when nothing is parsed.
          oneOf:
          - type: object
            required:
            - unknown_per_1000
            - rank
            - of
            properties:
              unknown_per_1000:
                type: number
                minimum: 0
                description: Unknown tokens per 1000 tokens.
                examples:
                - 89.4
              rank:
                type: integer
                minimum: 1
                description: 1 = easiest of your media by `unknown_per_1000`.
                examples:
                - 4
              of:
                type: integer
                minimum: 1
                description: Number of media ranked.
                examples:
                - 11
          - type: 'null'
        computed_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the numbers were computed.
    MediaSegment:
      type: object
      description: An episode, chapter, volume or page (`app.media_segment`).
      required:
      - id
      - media_id
      - ordinal
      - kind
      - title
      - sentence_count
      - token_count
      - unmapped_token_count
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Segment id (stable across re-parses).
        media_id:
          $ref: '#/components/schemas/Uuid'
          description: Owning media.
        ordinal:
          type: integer
          minimum: 0
          description: 0-based order within the media.
        kind:
          type: string
          enum:
          - episode
          - chapter
          - volume
          - page
          - whole
          description: Segment kind.
        title:
          type: string
          description: Title; may be empty.
          examples:
          - 第1話
        sentence_count:
          type: integer
          minimum: 0
          description: Sentences in the segment.
        token_count:
          type: integer
          minimum: 0
          description: Word tokens in the segment.
        unmapped_token_count:
          type: integer
          minimum: 0
          description: Of those, tokens that matched no entry.
    Media:
      type: object
      description: A media (`app.media`).
      required:
      - id
      - title
      - kind
      - language
      - source
      - jpdb_id
      - cover_blob_hash
      - parse_status
      - parse_error
      - content_version
      - content_blob_hash
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Media id; also the id of its deck.
        title:
          type: string
          minLength: 1
          description: Title.
          examples:
          - 葬送のフリーレン
        kind:
          $ref: '#/components/schemas/MediaKind'
        language:
          type: string
          description: BCP 47; always `ja` in v1.
          examples:
          - ja
        source:
          type: string
          enum:
          - jpdb
          - file
          - url
          - paste
          description: How it was imported. Immutable.
        jpdb_id:
          type:
          - string
          - 'null'
          description: jpdb deck id when `source` is `jpdb`.
          examples:
          - anime/5370
        cover_blob_hash:
          oneOf:
          - $ref: '#/components/schemas/BlobHash'
          - type: 'null'
          description: Cover image blob.
        parse_status:
          type: string
          enum:
          - pending
          - parsing
          - parsed
          - failed
          description: Server-owned parse state.
        parse_error:
          type:
          - string
          - 'null'
          description: Error text when `parse_status` is `failed`.
        content_version:
          type: integer
          minimum: 0
          description: Bumped by each published (re-)parse; 0 = nothing published.
        content_blob_hash:
          oneOf:
          - $ref: '#/components/schemas/BlobHash'
          - type: 'null'
          description: Snapshot archive for `content_version`.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Last change.
        deleted_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Tombstone.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/MediaSegment'
          description: Segments in `ordinal` order. Present on `GET /media/{media_id}` and `PATCH`; omitted in lists.
    MediaPage:
      type: object
      description: A page of media.
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Media'
          description: Media, newest first (without `segments`).
        next_cursor:
          type:
          - string
          - 'null'
          description: Cursor of the next page, or null.
    MediaPatch:
      type: object
      description: Changes to a media. At least one property.
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Title.
        kind:
          $ref: '#/components/schemas/MediaKind'
        cover_blob_hash:
          oneOf:
          - $ref: '#/components/schemas/BlobHash'
          - type: 'null'
          description: Cover image blob, or null to remove.
    MediaDeckOptions:
      type: object
      description: Initial options of the media deck (only used when the import creates it).
      additionalProperties: false
      properties:
        priority:
          type: integer
          minimum: -1000000
          maximum: 1000000
          default: 0
          description: New-card priority.
        enabled:
          type: boolean
          default: true
          description: Whether the deck supplies new cards.
        new_cards_per_day:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9999
          description: Per-deck new-card limit.
    MediaImportFile:
      type: object
      description: One uploaded source file.
      additionalProperties: false
      required:
      - blob_hash
      - filename
      properties:
        blob_hash:
          $ref: '#/components/schemas/BlobHash'
          description: The uploaded file.
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Original file name; its extension selects the parser when `format` is `auto`.
          examples:
          - ep01.srt
        title:
          type: string
          maxLength: 300
          description: Segment title. Default - the file name without extension.
        audio_blob_hash:
          $ref: '#/components/schemas/BlobHash'
          description: Optional uploaded video or audio file for this subtitle file; with `options.cut_audio` the
            worker cuts one clip per sentence.
    MediaImportRequest:
      type: object
      description: What to import (see `POST /media/import`). Also the payload of `media-import` jobs, with `media_id`
        always set and `import_id` omitted (it is the job's `id`).
      additionalProperties: false
      required:
      - source
      properties:
        import_id:
          $ref: '#/components/schemas/Uuid'
          description: Optional idempotency key (UUIDv7) - becomes the job id and, for new media, the media id. A
            retry with the same value returns the existing job (`200`) and enqueues nothing.
        media_id:
          $ref: '#/components/schemas/Uuid'
          description: Existing media to append to. Absent - create a new media.
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Title of the new media.
        kind:
          $ref: '#/components/schemas/MediaKind'
        source:
          type: string
          enum:
          - file
          - url
          - paste
          description: Where the content comes from.
        files:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/MediaImportFile'
          description: '`file` only (required).'
        url:
          type: string
          format: uri
          maxLength: 2000
          description: '`url` only (required) - http or https.'
        text:
          type: string
          minLength: 1
          maxLength: 1000000
          description: '`paste` only (required).'
        format:
          type: string
          enum:
          - auto
          - srt
          - ass
          - vtt
          - epub
          - txt
          - mokuro
          - html
          - texthooker
          default: auto
          description: Source format. `auto` decides by file extension (`file`), is `html` for `url` and `txt` for
            `paste`.
        options:
          type: object
          description: Parser options.
          additionalProperties: false
          properties:
            ruby:
              type: string
              enum:
              - strip
              - hint
              default: hint
              description: What to do with furigana in EPUB/HTML - drop it, or use it as a reading hint.
            cut_audio:
              type: boolean
              default: false
              description: Cut per-sentence audio clips from `audio_blob_hash` files.
        deck:
          $ref: '#/components/schemas/MediaDeckOptions'
    JpdbDeckImportRequest:
      type: object
      description: Which jpdb deck to import. Also the payload of `jpdb-deck-import` jobs, with `media_id` added.
      additionalProperties: false
      required:
      - jpdb_id
      properties:
        jpdb_id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9/_-]*$
          description: 'jpdb deck identifier: the path of the deck page after `jpdb.io/` without the trailing `/vocabulary-list`,
            e.g. `anime/5370`, or a numeric deck id.'
          examples:
          - anime/5370
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Title override. Default - the title jpdb reports.
        kind:
          $ref: '#/components/schemas/MediaKind'
        media_id:
          $ref: '#/components/schemas/Uuid'
          description: Set by the server in the job payload; clients must not send it (`422`).
        deck:
          $ref: '#/components/schemas/MediaDeckOptions'
        remap_only:
          type: boolean
          default: false
          description: 'Set by the server in jobs that re-publish an existing jpdb media after a mapping correction
            (C-11, `contracts/db/MEDIA_PIPELINE.md` 5.4): use cached jpdb responses regardless of age, fetch only
            what the cache lacks; `title`, `kind`, `deck` are not used. Clients must not send it (`422`).'
    JpdbHistoryImportRequest:
      type: object
      description: jpdb export to import. Also the payload of `jpdb-history-import` jobs.
      additionalProperties: false
      required:
      - blob_hash
      properties:
        blob_hash:
          $ref: '#/components/schemas/BlobHash'
          description: The uploaded jpdb review export (JSON).
        import_reviews:
          type: boolean
          default: true
          description: Import review history (creates notes and cards as needed).
        import_word_status:
          type: boolean
          default: true
          description: Import known, never-forget and blacklisted words as overrides.
    SentenceToken:
      type: object
      description: |
        One parser token of a sentence: token format 1, `contracts/api/PARSER.md` section 1 (C-12),
        the same value as `app.sentence.tokens` elements and `contracts/api/token.schema.json`.
        Servers send all ten properties; clients must tolerate unknown ones (later optional
        additions). Within a sentence tokens are ascending and non-overlapping, offsets are UTF-16
        code units into the ORIGINAL sentence text, and `surface` equals that slice; gaps are
        punctuation and whitespace.
      required:
      - s
      - e
      - surface
      - lemma
      - reading
      - pos
      - cform
      - seq
      - class
      - override
      additionalProperties: true
      properties:
        s:
          type: integer
          minimum: 0
          description: Start offset in the sentence text (UTF-16 code units, inclusive).
          examples:
          - 2
        e:
          type: integer
          minimum: 1
          description: End offset (exclusive).
          examples:
          - 4
        surface:
          type: string
          minLength: 1
          description: The original text `[s, e)` (never normalised).
          examples:
          - 食べ
        lemma:
          type: string
          minLength: 1
          description: Dictionary form used for matching (deinflected, from the normalised text).
          examples:
          - 食べる
        reading:
          type: string
          description: Hiragana reading of the surface (Sudachi reading, katakana folded to hiragana); may be
            empty only for override tokens.
          examples:
          - たべ
        pos:
          type: array
          maxItems: 4
          items:
            type: string
            minLength: 1
          description: Sudachi part-of-speech levels 1-4 with `*` removed; empty only for override tokens.
          examples:
          - - 動詞
            - 一般
        cform:
          type:
          - string
          - 'null'
          description: Sudachi conjugation form verbatim (e.g. `連用形-一般`); null if the word does not inflect.
          examples:
          - 連用形-一般
        seq:
          oneOf:
          - $ref: '#/components/schemas/EntrySeq'
          - type: 'null'
          description: Matched dictionary entry; null = unmapped.
        class:
          type: string
          enum:
          - content
          - particle
          - auxiliary
          - name
          - other
          description: Coverage filter class, derived by the table in PARSER.md section 2 (same values as
            `occurrence.pos_class`).
        override:
          type: boolean
          description: true when a parse override produced this token.
    GrammarSpanRef:
      type: object
      description: A grammar span inside a sentence.
      required:
      - grammar_point_id
      - start_offset
      - end_offset
      - origin
      properties:
        grammar_point_id:
          $ref: '#/components/schemas/Uuid'
          description: The grammar point.
        start_offset:
          type: integer
          minimum: 0
          description: UTF-16 offset, inclusive.
        end_offset:
          type: integer
          minimum: 1
          description: UTF-16 offset, exclusive.
        origin:
          $ref: '#/components/schemas/SpanOrigin'
    Sentence:
      type: object
      description: A sentence of imported media (`app.sentence`) with its tokens and live grammar spans.
      required:
      - id
      - media_id
      - segment_id
      - ordinal
      - text
      - tokens
      - origin
      - start_ms
      - end_ms
      - audio_blob_hash
      - image_blob_hash
      - location
      - unknown_count
      - grammar_spans
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Sentence id (stable across re-parses while the text is unchanged).
        media_id:
          $ref: '#/components/schemas/Uuid'
          description: Owning media.
        segment_id:
          $ref: '#/components/schemas/Uuid'
          description: Owning segment.
        ordinal:
          type: integer
          minimum: 0
          description: 0-based order within the segment.
        text:
          type: string
          minLength: 1
          description: Original text.
          examples:
          - パンを食べる。
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/SentenceToken'
          description: Tokens in ascending, non-overlapping order; gaps are untokenised text.
        origin:
          type: string
          enum:
          - media
          - generated
          description: '`generated` = LLM-generated example; always label it as such.'
        start_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Subtitle start within the segment; null for text sources.
        end_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Subtitle end.
        audio_blob_hash:
          oneOf:
          - $ref: '#/components/schemas/BlobHash'
          - type: 'null'
          description: Audio clip blob.
        image_blob_hash:
          oneOf:
          - $ref: '#/components/schemas/BlobHash'
          - type: 'null'
          description: Image blob (manga page crop, screenshot).
        location:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'Source position for non-timed media, e.g. `{"page": 12, "box": [x, y, w, h]}`.'
        unknown_count:
          type: integer
          minimum: 0
          description: Number of unknown words now, as defined on the `filter` parameter (computed at request time).
          examples:
          - 1
        grammar_spans:
          type: array
          items:
            $ref: '#/components/schemas/GrammarSpanRef'
          description: Live spans (detected and manual) whose grammar point is live, by `start_offset`.
    SentencePage:
      type: object
      description: A page of sentences.
      required:
