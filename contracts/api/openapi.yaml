          format: uri
          maxLength: 2000
          description: Target.
    GrammarPoint:
      type: object
      description: A grammar point (`app.grammar_point`).
      required:
      - id
      - language
      - title
      - pattern
      - meaning
      - explanation
      - notes
      - jlpt
      - detection_rules
      - related_ids
      - links
