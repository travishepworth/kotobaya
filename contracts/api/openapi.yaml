          - 〜ざるを得ない
        meaning:
          type: string
          description: Short meaning.
        explanation:
          type: string
          description: Explanation (Markdown).
        notes:
          type: string
          description: Register and nuance notes (Markdown).
        jlpt:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 5
          description: N-level; null if unclassified.
        detection_rules:
          type: array
          items:
            $ref: '#/components/schemas/DetectionRule'
