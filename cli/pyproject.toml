[project]
name = "kotobaya-cli"
version = "0.0.0"
description = "kotobaya command-line client for the Kotobaya API"
requires-python = ">=3.12"
dependencies = [
    "kotobaya_client",
]

[project.scripts]
kotobaya = "kotobaya_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv.sources]
kotobaya_client = { path = "../clients/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kotobaya_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
files = ["src", "tests"]
# The editable install of the generated client is a finder hook mypy cannot see.
mypy_path = "../clients/python"

[[tool.mypy.overrides]]
module = ["kotobaya_client", "kotobaya_client.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
